<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 132" width="512" height="512">
  <!-- The maskable variant. A platform may crop this to a circle, a squircle or a
       rounded square, and only the middle 80% is guaranteed to survive, so the mark is
       scaled to sit inside that and the background runs to the edge. -->
  <rect width="132" height="132" fill="#0B0C0E"/>
  <g transform="translate(66,66) scale(0.70) translate(-66,-66)">
    <circle cx="66" cy="66" r="46" fill="none" stroke="#1E2422" stroke-width="18"/>
    <circle cx="66" cy="66" r="46" fill="none" stroke="#2FD36F" stroke-width="18" stroke-linecap="round" stroke-dasharray="216 289" transform="rotate(-90 66 66)"/>
    <rect x="86" y="86" width="22" height="34" rx="11" fill="#2FD36F" transform="rotate(-45 97 103)"/>
  </g>
</svg>
