<style>
/* Black, white and one green, and the green is the streak itself.
   --mk   the mark colour: fills, rules, rings
   --mkt  the same hue at a weight that can be read as text on the page
   --onmk what sits on top of --mk
   All three step up as a run grows — see [data-stage] below and stageOf(). --acc and --ok
   are kept as names because the rest of the sheet is written in terms of them. */
:root{--bg:#fff;--card:#fff;--line:#e8e9ea;--text:#0b0c0e;--muted:#8b8f94;--soft:#f5f6f6;
  --teal:#0b0c0e;--onteal:#fff;--teal2:#8b8f94;--todo:#d7d9da;--sheet:#fff;--barbg:rgba(255,255,255,.96);
  --acc:var(--mk);--ok:var(--mk);--okbg:var(--mktint);--mkring:rgba(17,129,74,.22);
  /* stage 1: a run that has only just started */
  --mk:#0b5a34;--mkt:#0b5a34;--onmk:#fff;--mktint:#e9f2ed;--mkveil:rgba(11,90,52,.10);
  --g1:#0b5a34;--g2:#0b5a34;--fill:100%}
:root[data-stage="2"]{--mk:#12934f;--mkt:#0e7044;--onmk:#06230f;--mktint:#e7f4ec;--mkveil:rgba(18,147,79,.10);
  --g1:#0b5a34;--g2:#12934f;--fill:52%}
:root[data-stage="3"]{--mk:#1db061;--mkt:#118047;--onmk:#04240f;--mktint:#e6f7ee;--mkveil:rgba(29,176,97,.12);
  --g1:#0b5a34;--g2:#25c56d;--fill:26%}
:root[data-stage="4"]{--mk:#2fd36f;--mkt:#11814a;--onmk:#06230f;--mktint:#e6f9ef;--mkveil:rgba(47,211,111,.14);
  --g1:#0a5230;--g2:#48ec8b;--fill:0%}
/* Dark is the same design on ink rather than paper. The deep greens vanish against it, so
   anything that has to be read as text takes the bright end of the ramp instead. */
:root[data-theme=dark]{--bg:#0a0b0c;--card:#121315;--line:#232527;--text:#f2f3f4;--muted:#9ba0a4;--soft:#1a1c1e;
  --teal:#f2f3f4;--onteal:#0a0b0c;--teal2:#6f7478;--todo:#2c2f31;--sheet:#121315;--barbg:rgba(18,19,21,.94);
  --mkring:rgba(63,220,127,.25)}
:root[data-theme=dark]{--mk:#0f7f45;--mkt:#3fdc7f;--onmk:#fff;--mktint:#11291d;--mkveil:rgba(63,220,127,.12);
  --g1:#0b5a34;--g2:#0f7f45}
:root[data-theme=dark][data-stage="2"]{--mk:#16a35b;--mkt:#48df85;--onmk:#05210e;--mktint:#122b1f;--g1:#0b5a34;--g2:#16a35b}
:root[data-theme=dark][data-stage="3"]{--mk:#26c46d;--mkt:#55e58e;--onmk:#04240f;--mktint:#132e21;--g1:#0b5a34;--g2:#26c46d}
:root[data-theme=dark][data-stage="4"]{--mk:#48ec8b;--mkt:#62ec97;--onmk:#06230f;--mktint:#143222;--g1:#12934f;--g2:#48ec8b}
*{box-sizing:border-box}
html{background:var(--bg)}
/* An installed app, not a page in a browser. touch-action kills the double-tap zoom,
   overscroll-behavior kills the rubber band and pull-to-refresh, and the callout and
   selection are what make a long press feel like a web page rather than an app. */
html,body{overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 "Plus Jakarta Sans",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;
  touch-action:manipulation;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
main{max-width:600px;margin:0 auto;padding:0 0 120px;position:relative;min-height:100vh}
main.out{padding-bottom:0;min-height:0}
.num{font-family:Oswald,system-ui,sans-serif;font-weight:600;font-variant-numeric:tabular-nums}
h2{margin:0;font-size:17px;font-weight:800}
h3{margin:22px 18px 8px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
p{margin:0}
button{font:inherit;font-weight:800;border:0;border-radius:0;padding:11px 16px;background:var(--soft);color:var(--text);cursor:pointer;white-space:nowrap}
/* Pressing: a big button dims the way a native one does; a small icon gives under the
   thumb. Nothing on the page moves because it was tapped, only the thing that was tapped. */
button{transition:opacity .1s ease,background-color .15s ease,color .15s ease,transform .12s cubic-bezier(.2,.7,.2,1)}
button:active{opacity:.6}
.bar button:active,.acts button:active,.stories .s:active,.cin .emo:active,.post .more:active,.x:active,.bin:active,.eye:active,.tb:active,.dot:active,.bgbtn:active{opacity:1;transform:scale(.88)}
button.primary{background:var(--mk);color:var(--onmk)}
button.teal{background:var(--teal);color:var(--onteal)}
button.small{padding:7px 12px;font-size:13px}
button.ghost{background:none;color:var(--muted);padding:6px 4px;font-weight:600}
button:disabled{opacity:.6}
/* 16px is not a taste: iOS zooms the whole page into any field smaller than that when
   it is focused, and will not zoom back out. Every field in the app is at least 16. */
input,select,textarea{font:inherit;font-size:16px;width:100%;padding:12px 14px;border-radius:0;border:1px solid var(--line);background:var(--card);color:var(--text);min-width:0;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--mk);box-shadow:0 0 0 3px var(--mkring)}
textarea{resize:vertical;line-height:1.5}
.check input{width:19px}
input[type=file]{padding:10px;font-size:16px}
label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:12px 0 6px}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--muted);font-size:13px;font-weight:600}
/* header block */
.hdr{background:var(--bg);color:var(--text);padding:calc(16px + env(safe-area-inset-top)) 20px 0;border-bottom:1px solid var(--line)}
.hdr .top{display:flex;justify-content:space-between;align-items:center}
.logo{font-family:Oswald,system-ui,sans-serif;font-weight:600;font-size:17px;letter-spacing:.09em;text-transform:uppercase;color:var(--text);display:flex;align-items:center;gap:8px}
.logo svg{width:24px;height:24px}
.hdr .date{font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.hdr h1{font-family:Oswald,system-ui,sans-serif;margin:16px 0;font-size:34px;font-weight:600;letter-spacing:0;text-transform:uppercase}
.hdr .big{display:flex;align-items:flex-end;gap:13px;margin-top:16px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.hdr .big b{font-size:74px;letter-spacing:-.02em;line-height:.8;padding:.08em .04em .2em 0;margin:-.08em 0 -.2em 0;
  background:linear-gradient(to top,var(--g1) 0,var(--g1) var(--fill),var(--g2) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
:root[data-stage="4"] .hdr .big b{filter:drop-shadow(0 2px 12px rgba(72,236,139,.3))}
.hdr .big div{font-weight:700;font-size:15px;line-height:1.3}
.hdr .big div small{display:block;color:var(--muted);font-weight:600;font-size:12.5px}
.mini{display:block}
.mini div{display:grid;grid-template-columns:minmax(84px,auto) minmax(34px,1fr) auto;align-items:center;gap:0 12px;padding:11px 0;
  border-bottom:1px solid var(--line);font-size:12.5px;font-weight:800;letter-spacing:.01em;color:var(--text)}
.mini div b{font-family:Oswald,system-ui,sans-serif;font-weight:600;font-size:14px;letter-spacing:0;
  color:var(--text);font-variant-numeric:tabular-nums;text-align:right;min-width:0;overflow-wrap:anywhere}
.mini div span{min-width:0;line-height:1.25;overflow-wrap:anywhere}
.mini div em{display:block;font-style:normal;font-weight:600;font-size:11px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.mini i{display:block;height:2px;background:var(--line);border-radius:0;overflow:hidden}
.mini div:last-child{border-bottom:0}
.mini i::after{content:"";display:block;height:100%;background:var(--mk);width:var(--w)}
.mini i.done::after{background:var(--mk)}
/* Only people with something running are in this row, unseen first. A lit ring is a story
   you have not watched; once you have, it goes quiet rather than disappearing. */
.stories{display:flex;gap:14px;padding:14px 20px 2px;overflow-x:auto;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.stories .s{flex:none;width:64px;background:none;padding:0;border-radius:0;display:flex;flex-direction:column;align-items:center;gap:7px}
.stories .rg{position:relative;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;
  background:var(--soft);padding:3px}
/* Always the full sweep, not the streak ramp: early in a run the ramp is nearly flat, and
   a ring that says "unwatched" has to look like one whatever day you are on. */
.stories .rg.new{background:linear-gradient(135deg,#0b5a34,#2fd36f 52%,#7ef0b0)}
/* Watched: the same ring with the life gone out of it, not a different shape. */
.stories .rg.old{background:none;box-shadow:inset 0 0 0 2px var(--line)}
.stories .s.me .rg{background:none;box-shadow:inset 0 0 0 2px var(--line)}
.stories .s.me.has .rg{box-shadow:none}
.stories .rg .av{width:100%;height:100%;font-size:17px;box-shadow:0 0 0 2px var(--bg)}
.stories .rg i{position:absolute;right:-2px;bottom:-2px;width:20px;height:20px;border-radius:50%;background:var(--mk);
  color:var(--onmk);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:15px;line-height:1;border:2px solid var(--bg)}
.stories .nm{font-size:11px;font-weight:700;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stories .s.me .nm{color:var(--text)}

/* One drawing, used by the editor and by everyone who watches it after. */
.face{position:relative;width:100%;aspect-ratio:9/16;overflow:hidden;background:#000;touch-action:none}
.face .fill{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* The words: a block that sits at the point it was dragged to, centred on it. */
.face .type{position:absolute;transform:translate(-50%,-50%);max-width:88%;min-width:40px;padding:6px 12px;
  line-height:1.15;white-space:pre-wrap;overflow-wrap:anywhere;outline:none;
  text-shadow:0 2px 18px rgba(0,0,0,.28);cursor:grab;touch-action:none}
.face .type.boxed{border-radius:10px;text-shadow:none;padding:8px 14px}
.face .type.sz0{font-size:20px}
.face .type.sz1{font-size:30px}
.face .type.sz2{font-size:42px}
.face .type:empty::before{content:attr(data-ph);opacity:.5}
.face .stk{position:absolute;transform:translate(-50%,-50%);font-size:72px;line-height:1;cursor:grab;touch-action:none;
  filter:drop-shadow(0 6px 14px rgba(0,0,0,.35));user-select:none}
/* The two it writes for you. The ring and the sparks are drawn in the ink colour, so
   picking a colour recolours the whole card, not just the words. */
.face .deco{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.face .hero{position:absolute;left:0;right:0;top:11%;display:flex;flex-direction:column;align-items:center;gap:4px;
  pointer-events:none;color:inherit}
.face .hero .big{font-family:Oswald,system-ui,sans-serif;font-weight:600;font-size:172px;line-height:.82;letter-spacing:-.03em;
  text-shadow:0 8px 40px rgba(0,0,0,.28)}
.face .hero .tag{font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-weight:800;font-size:13px;letter-spacing:.24em;
  text-transform:uppercase;margin-top:10px;padding:8px 14px;border:2px solid currentColor;border-radius:999px}
.face .hero .tickring{width:64px;height:64px;margin-bottom:8px}
.face .hero .tickring svg{width:100%;height:100%;display:block}
.face .hero .stamp{position:absolute;right:8%;top:58%;transform:rotate(-9deg);font-family:Oswald,system-ui,sans-serif;font-weight:600;
  font-size:26px;letter-spacing:.2em;text-transform:uppercase;padding:6px 12px 5px;border:4px solid currentColor;border-radius:8px;
  opacity:.85;mix-blend-mode:screen}
.face.tpl .type{text-shadow:0 2px 14px rgba(0,0,0,.35)}

/* Watching. Full screen, because that is what it is for. */
#story,#make{position:fixed;inset:0;z-index:70;background:#050706;display:grid;grid-template-columns:minmax(0,1fr);place-items:center}
#story[hidden],#make[hidden]{display:none}
#story .pane,#make .pane{position:relative;width:min(100%,430px);height:100%;display:flex;flex-direction:column;
  padding:calc(8px + env(safe-area-inset-top)) 0 calc(8px + env(safe-area-inset-bottom))}
#story .bars{display:flex;gap:4px;padding:0 10px}
#story .bars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.28)}
#story .bars i.done{background:rgba(255,255,255,.85)}
#story .bars i.now{background:#fff}
#story .who{display:flex;align-items:center;gap:9px;padding:12px 12px 10px;color:#fff;position:relative;z-index:3}
#story .who b{font-size:14.5px;font-weight:800}
#story .who span{font-size:12px;color:rgba(255,255,255,.7)}
#story .who .x,#story .who .bin{margin-left:auto;background:none;color:#fff;font-size:17px;padding:4px 6px}
#story .who .bin{margin-left:auto}
#story .who .bin + .x{margin-left:0}
#story .face{flex:1;aspect-ratio:auto;min-height:0}
/* Half each, under everything: forward on the right the way every app does it. */
#story .tap{position:absolute;top:70px;bottom:0;width:38%;background:none;padding:0;z-index:2}
#story .tap.back{left:0}
#story .tap.fwd{right:0;width:62%}
/* Who watched: only on your own, in the corner where the other app keeps it. */
#story .eye{position:absolute;left:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:3;display:flex;align-items:center;gap:6px;
  background:rgba(0,0,0,.45);color:#fff;font-size:13px;font-weight:800;padding:8px 12px;border-radius:999px}
#story .eye svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linejoin:round}
#story .seenby{position:absolute;left:0;right:0;bottom:0;max-height:60%;overflow-y:auto;z-index:4;background:#fff;color:var(--ink);
  padding:14px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
#story .seenby[hidden]{display:none}
#story .seenby .hd{display:flex;align-items:center;justify-content:space-between}
#story .seenby .hd .x{background:none;font-size:17px;padding:4px 6px}
#story .seenby b{font-size:14.5px;font-weight:800}

/* Making one. The other app's shape: close on the left, tools on the right, the card in
   the middle, colours along the bottom, share underneath. */
#make .mbar{display:flex;align-items:center;gap:10px;padding:8px 12px;color:#fff}
#make .mbar.top{padding-top:6px}
#make .mbar .x{background:none;color:#fff;font-size:18px;padding:6px 8px}
#make .tools{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0}
#make .bgbtn{width:34px;height:34px;border-radius:50%;padding:0;box-shadow:inset 0 0 0 2px rgba(255,255,255,.85)}
#make .fontpill{background:rgba(255,255,255,.16);color:#fff;border-radius:999px;padding:8px 14px;font-size:13px;min-width:0;flex:0 1 74px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#make .tb{width:36px;height:36px;border-radius:50%;padding:0;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center;font-size:18px}
#make .tb.on{background:#fff;color:#0b0c0e}
#make .tb svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#make .tb .ab{font-weight:800;font-size:15px;line-height:1}
#make .tb.on .ab{background:#0b0c0e;color:#fff;padding:1px 5px;border-radius:4px}
#make .canvas{position:relative;flex:1;min-height:0;display:grid;min-width:0}
#make .canvas .face{height:100%;aspect-ratio:auto}
#make .stickers{position:absolute;left:12px;right:12px;bottom:12px;display:grid;grid-template-columns:repeat(8,1fr);gap:4px;
  padding:10px;background:rgba(0,0,0,.72);backdrop-filter:blur(10px);border-radius:16px;z-index:3}
#make .stickers[hidden]{display:none}
#make .stickers button{background:none;padding:6px 0;font-size:24px;line-height:1}
/* The colours, in a strip along the bottom of the card. */
#make .inks{display:flex;gap:10px;padding:12px 14px 6px;overflow-x:auto;scrollbar-width:none;min-width:0}
#make .inks::-webkit-scrollbar{display:none}
#make .dot{flex:none;width:30px;height:30px;border-radius:50%;padding:0;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
#make .dot.on{box-shadow:0 0 0 2.5px #0b0c0e,0 0 0 5px #fff}
#make .mbar.bottom{padding-bottom:calc(10px + env(safe-area-inset-bottom));min-width:0}
#make .who{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:800;color:#fff;min-width:0}
#make .go{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--mk);color:var(--onmk);
  font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:11px 16px;border-radius:999px}
#make .go svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#make .go:disabled{opacity:.6}

/* The words are typed where they will sit, over the picture, rather than in a box
   somewhere else that has to be imagined onto it. */
#make .type{position:absolute;left:0;right:0;width:100%;background:none;border:0;outline:none;resize:none;
  padding:0 26px;text-align:center;font-weight:800;line-height:1.15;overflow:hidden;
  text-shadow:0 2px 18px rgba(0,0,0,.3);caret-color:currentColor}
#make .type::placeholder{color:currentColor;opacity:.45}
#make .set{min-width:0}
#make .tools::-webkit-scrollbar{display:none}
#make .set span{display:block;font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
  color:rgba(255,255,255,.5);margin-bottom:6px}
#make .set .row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;min-width:0}
#make .set .row::-webkit-scrollbar{display:none}
#make .sw{width:34px;height:34px;flex:none;border-radius:50%;padding:0;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
#make .sw.on{border-color:#fff}
/* Drawn from the two colours the button actually has, rather than from currentColor,
   which left the marker invisible in one of the two states. */
#make .pos{display:block;width:16px;height:16px;box-shadow:inset 0 0 0 1.5px #fff;position:relative}
#make .pos::after{content:"";position:absolute;left:3px;right:3px;height:2.5px;background:#fff}
#make .pos.p2::after{bottom:3px}
#make .emo button{flex:none;background:none;padding:4px;font-size:22px;line-height:1}

/* What happened while you were not looking. Shut, and one line tall: the streak is what
   the top of this screen is for. */
.act{margin:14px 18px 0;border:1px solid var(--line)}
.act summary{display:flex;align-items:center;gap:9px;padding:11px 13px;cursor:pointer;list-style:none;
  font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.act summary::-webkit-details-marker{display:none}
.act summary .dot{width:7px;height:7px;border-radius:50%;background:var(--mk);flex:none}
.act summary .n{margin-left:auto;color:var(--mkt);letter-spacing:.1em}
.act summary .chev{width:15px;height:15px;flex:none;stroke:var(--muted);fill:none;stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round;transition:transform .18s}
.act[open] summary .chev{transform:rotate(180deg)}
.act .e{display:flex;align-items:center;gap:10px;padding:9px 13px;border-top:1px solid var(--line);font-size:13px}
.act .e p{color:var(--muted);font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act .e p b{color:var(--text);font-weight:800}
.act .e .t{margin-left:auto;font-size:11px;color:var(--muted);font-weight:700;white-space:nowrap}
@media (prefers-reduced-motion:reduce){.act summary .chev{transition:none}}
/* cards */
.card{margin:14px 18px;border:1px solid var(--line);border-radius:0;padding:16px;background:var(--card)}
.card h2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h2 span{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
.q{margin-top:14px}
.q .t{display:flex;justify-content:space-between;font-weight:700;font-size:14px}
.q .t span{color:var(--muted)}
.tr{height:3px;border-radius:0;background:var(--line);margin-top:8px;overflow:hidden}
.tr i{display:block;height:100%;border-radius:0;background:var(--mk);transition:width .4s}
.tr i.done{background:var(--mk)}
.ppl{display:flex;margin-top:14px;align-items:center}
.ppl .av{border:2px solid var(--card);margin-left:-8px}
.ppl .av:first-child{margin-left:0}
.ppl span{margin-left:10px}
.av{width:30px;height:30px;border-radius:50%;background:var(--teal);color:var(--onteal);display:grid;place-items:center;font-weight:800;font-size:12px;flex:none;text-transform:uppercase;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.todo{background:var(--todo);color:var(--text)}
.av.todo img{opacity:.45}
.av.sm{width:24px;height:24px;font-size:11px}
.av.lg{width:40px;height:40px;font-size:15px}
.av.xl{width:76px;height:76px;font-size:30px}
.chip{display:inline-block;padding:5px 10px;border-radius:0;border:1px solid var(--line);background:none;font-size:11.5px;font-weight:800;letter-spacing:.02em;white-space:nowrap}
.chip.ok{background:none;border-color:var(--mk);color:var(--mkt)}
.empty{text-align:center;padding:28px 16px}
.empty b{display:block;font-size:16px;margin-bottom:4px}
.check{display:flex;align-items:center;gap:9px;margin-top:14px;font-weight:700;font-size:14px}
.check input{width:19px;height:19px;margin:0;flex:none;accent-color:var(--mk)}
.check span{font-weight:700}
/* Big enough to be seen on the way past, and dashed while it is still a question — the
   answer to which is the difference between a challenge day counting and not. */
.chal{position:relative;display:flex;align-items:center;gap:13px;margin-top:16px;padding:14px;border-radius:0;cursor:pointer;
  border:2px dashed var(--mk);background:linear-gradient(180deg,var(--mkveil),transparent)}
/* Invisible but the size of the whole card, so the tap target is the card rather than a
   28px square, and it is still a real focusable checkbox underneath. */
.chal input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.chal input:focus-visible ~ .box{box-shadow:0 0 0 3px var(--mkring)}
.chal .box{flex:none;width:28px;height:28px;border-radius:0;border:2px solid var(--mk);background:var(--card);
  display:grid;place-items:center}
.chal .box::after{content:"";width:13px;height:7px;border-left:3px solid var(--onmk);border-bottom:3px solid var(--onmk);
  border-radius:1px;transform:rotate(-45deg) translate(1px,-2px);opacity:0;transition:opacity .12s}
.chal input:checked ~ .box{background:var(--mk);border-color:var(--mk)}
.chal input:checked ~ .box::after{opacity:1}
.chal .txt{font-weight:700;font-size:14px;line-height:1.3;min-width:0}
.chal .txt b{display:block;font-size:16px;letter-spacing:-.01em}
.chal .txt small{display:block;color:var(--muted);font-weight:600;font-size:13px;margin-top:1px}
/* Once answered it stops asking: solid rather than dashed, and the line underneath says
   what it now means instead of what to do. */
.chal:has(input:checked){border-style:solid;background:linear-gradient(180deg,var(--mkveil),transparent)}
.chal:has(input:checked) .txt small{visibility:hidden}
.chal:has(input:checked) .txt small::before{content:"Counts towards your challenge";visibility:visible;color:var(--mkt)}
.about{margin:12px 0 0;padding:12px 0 0 18px;border-top:1px solid var(--line);color:var(--muted);
  font-size:13px;font-weight:600;line-height:1.55}
.about li{padding-left:2px}
.nudge{border-color:var(--mk)}
.nudge b{font-family:Oswald,system-ui,sans-serif;font-size:15px}
.nudge p{margin-top:5px;font-size:13px;line-height:1.4}
.chalpick{margin-top:8px}
.chalpick[hidden]{display:none}
.warn{color:#e5484d;font-size:13px;font-weight:600}
.prog{display:block;height:3px;background:var(--line);border-radius:0;overflow:hidden;margin-top:10px}
.prog::after{content:"";display:block;height:100%;background:var(--mk);width:var(--w,0%);transition:width .25s}
.prog[hidden]{display:none}
.rank{flex:none;width:20px;text-align:center;font-family:Oswald,system-ui,sans-serif;font-weight:800;font-size:13px;color:var(--muted)}
.rank.top{color:var(--mkt)}
.list{padding:4px 16px}
.list .row{padding:10px 0;border-top:1px solid var(--line)}
.list .row:first-child{border-top:0}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px;text-align:center}
.stats div{background:none;border:1px solid var(--line);border-radius:0;padding:11px 4px}
.stats b{display:block;font-family:Oswald,system-ui,sans-serif;font-weight:600;font-size:22px;color:var(--text);font-variant-numeric:tabular-nums}
.stats div:first-child b{padding:.06em .04em .18em 0;margin-bottom:-.18em;
  background:linear-gradient(to top,var(--g1) 0,var(--g1) var(--fill),var(--g2) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.stats small{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
/* posts */
.post{padding:0;overflow:hidden}
.reel{position:relative;aspect-ratio:4/5;background:#000;color:#fff}
/* Only the proof itself. Written as ".reel img" this also caught the avatar in the
   overlay above it — absolutely positioned to fill that band, on top of the name and the
   username, which is what a stretched face across every post turned out to be. */
.reel .proof{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;display:block} /* ponytail: cover crops landscape clips; switch to contain if people film sideways */
.reel::after{content:"";position:absolute;left:0;right:0;bottom:0;height:30%;background:linear-gradient(to top,rgba(0,0,0,.45),transparent);pointer-events:none}
/* Who and when, on the card above the clip, the way every established feed does it. */
.post .head{display:flex;align-items:center;gap:10px;padding:12px 14px}
.post .head .av{width:34px;height:34px;font-size:14px}
.post .head .who{font-weight:800;font-size:14.5px;line-height:1.2}
.post .head .when{font-size:12.5px;color:var(--muted);font-weight:600}
.post .head .more{margin-left:auto;background:none;color:var(--muted);font-size:20px;line-height:1;padding:4px 6px}
.reel .badge{position:absolute;right:12px;top:12px;z-index:4;background:#2fd36f;color:#06230f;font-family:Oswald;font-weight:600;font-size:13px;padding:5px 10px;border-radius:0;text-transform:uppercase;letter-spacing:.02em}
/* The player is the clip and one glyph. Tap plays and the pause bars show for a moment
   before getting out of the way; tap again and the triangle is straight back. */
.reel .play{position:absolute;inset:0;display:grid;place-items:center;z-index:1;pointer-events:none}
.reel .play i{width:58px;height:58px;border-radius:50%;background:rgba(0,0,0,.35);border:1.5px solid rgba(255,255,255,.75);display:grid;place-items:center;backdrop-filter:blur(6px);transition:opacity .22s,transform .22s}
.reel .play i::after{content:"";border-left:17px solid #fff;border-top:10px solid transparent;border-bottom:10px solid transparent;margin-left:4px}
.reel.playing .play i{opacity:0;transform:scale(1.25)}
.reel.playing.flash .play i{opacity:1;transform:none}
.reel.playing .play i::after{border:0;width:16px;height:18px;margin:0;background:linear-gradient(to right,#fff 0 36%,transparent 36% 64%,#fff 64%)}
.reel .sound{position:absolute;right:12px;bottom:14px;z-index:2;width:30px;height:30px;border-radius:50%;padding:0;background:rgba(0,0,0,.45);display:grid;place-items:center;opacity:0;transition:opacity .2s}
.reel.started .sound{opacity:1}
.reel .sound svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.reel .sound .m{display:none}
.reel .sound.off .w{display:none}
.reel .sound.off .m{display:block}
/* The only sign of time: a line along the bottom edge. No scrubber, no numbers. */
.reel .prg{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(255,255,255,.25);z-index:2;opacity:0;transition:opacity .2s}
.reel.started .prg{opacity:1}
.reel .prg b{display:block;height:100%;width:0;background:#fff}
.post .cap{padding:8px 14px 0;font-size:14px;line-height:1.45;user-select:text;-webkit-user-select:text}
.post .cap b{font-weight:800;margin-right:6px}
/* What people left, drifting up the left side of the post. Bare emoji, no pill: each one
   bobs on its own slow cycle, offset in phase and nudged sideways so they read as a loose
   column of floating things rather than a stack. */
.reel .reacts{position:absolute;left:14px;bottom:18px;z-index:4;display:flex;flex-direction:column-reverse;
  flex-wrap:wrap-reverse;align-content:flex-start;align-items:flex-start;gap:0 6px;pointer-events:none;
  max-height:calc(100% - 118px);overflow:visible}
/* No overflow clip and no filter on these: over a playing video iOS paints a clipped, filtered
   layer as a faint darker box with an edge, and the bob carried the emoji into that edge. A
   text-shadow keeps them legible on a bright frame without a layer of their own. */
.reel .reacts button{background:none;border:0;padding:2px;font-size:26px;line-height:1;pointer-events:none;
  text-shadow:0 2px 6px rgba(0,0,0,.6);transform:translateX(var(--x,0px));
  animation:bob 3.4s ease-in-out infinite;animation-delay:calc(var(--i,0) * -.7s)}
/* Yours answer to a tap. The glyph is 26px and it is bobbing, so the thing you are
   aiming at is both small and moving: a tap that was dead on when it left your thumb can
   land where the emoji was rather than where it is. The hit area is extended past the
   glyph by more than the bob can carry it, which costs no layout and no paint. */
.reel .reacts button.mine{pointer-events:auto;cursor:pointer;position:relative}
.reel .reacts button.mine::after{content:"";position:absolute;inset:-11px -9px}
@keyframes bob{
  0%,100%{transform:translate(var(--x,0px),0) scale(1)}
  50%{transform:translate(calc(var(--x,0px) + 4px),-9px) scale(1.06)}
}
@media (prefers-reduced-motion:reduce){.reel .reacts button{animation:none}}
/* What you do about a post, under the clip and directly above what people said. */
.acts{position:relative;display:flex;align-items:center;gap:18px;padding:10px 14px 2px}
.acts button{background:none;padding:0;display:flex;align-items:center;gap:6px;color:var(--text);font-size:13.5px;font-weight:800}
.acts svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.acts .lk.on{color:#ff3b5c}
.acts .lk.on svg{fill:#ff3b5c;stroke:#ff3b5c;animation:heart .35s cubic-bezier(.2,.8,.2,1)}
@keyframes heart{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.acts .cc{margin-left:auto;font-size:13px;font-weight:700;color:var(--muted)}
/* Over the row it was opened from, not over the clip. */
.reactpick{position:absolute;left:8px;bottom:calc(100% - 6px);z-index:5;display:flex;gap:2px;padding:6px;
  background:var(--card);border:1px solid var(--line);box-shadow:0 10px 26px -12px rgba(11,12,14,.5)}
.reactpick button{background:none;padding:5px 7px;font-size:22px;line-height:1}
.reactpick button:active{background:var(--soft)}
/* The replies, and a box that is always ready. */
.cmts{padding:6px 14px 12px}
.clist .c.pending{animation:rise .22s cubic-bezier(.2,.7,.2,1)}
.clist{padding:2px 0 6px}
.clist .c{align-items:flex-start;gap:9px}
.clist .c b{display:block;font-size:13px}
.clist .c span{display:block;color:var(--text);font-weight:500;font-size:14px}
.emoji{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;padding:8px 0 0}
.emoji[hidden]{display:none}
.emoji button{background:none;padding:6px 0;font-size:21px;line-height:1}
.emoji button:active{background:var(--soft)}
/* A clip that cannot be played looks exactly like one that is merely slow: a black
   rectangle with a play button that does nothing. This says which it is. */
.reel .bust{position:absolute;inset:0;z-index:3;display:none;flex-direction:column;gap:12px;
  align-items:center;justify-content:center;padding:24px;text-align:center;background:rgba(0,0,0,.72)}
.reel.bust .bust{display:flex}
.reel.bust .play,.reel.bust .proof{display:none}
.reel .bust p{font-size:14px;font-weight:700;line-height:1.4}
.reel .bust button{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.5);padding:8px 16px}
.c{display:flex;gap:8px;padding:7px 0;font-size:14px;align-items:flex-start}
.c b{font-weight:800;flex:none}
.c span{color:var(--muted);flex:1;font-weight:500}
.c .x{background:none;padding:0 4px;color:var(--muted);font-weight:600;font-size:13px}
.cin{display:flex;gap:8px;margin-top:4px;align-items:center}
.cin input{padding:10px 12px}          /* 16px, like every field: smaller and iOS zooms in */
.cin button{padding:0 14px}
/* A word, not a button. The box around it was doing nothing the word was not already
   doing, and the padding is what keeps the tap target the size of a thumb without it. */
.cin button.primary{background:none;color:var(--mkt);padding:9px 6px;font-size:17px;line-height:1.3}
.cin button.primary:active{opacity:.55;transform:none}
.cin .emo{background:var(--soft);padding:0;width:38px;height:38px;flex:none;font-size:19px;line-height:1;border-radius:0}
/* bubble bar */
/* iOS keeps a fixed element pinned to the layout viewport, which is not what is on
   screen: while the URL bar collapses or a keyboard comes up the two differ, and the bar
   slides around on its own. --vvb is the gap between them, kept up to date from
   visualViewport, so the bar stays put against the bottom edge people can actually see. */
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom) + var(--vvb, 0px));width:min(92vw,400px);background:var(--barbg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:999px;display:grid;grid-template-columns:1fr 1fr auto 1fr 1fr;align-items:center;padding:6px;box-shadow:0 12px 30px -10px rgba(0,0,0,.35);z-index:6}
.bar button{background:none;padding:7px 0 5px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:700;color:var(--muted);border-radius:999px}
.bar button{transition:color .2s,transform .12s cubic-bezier(.2,.7,.2,1)}
.bar button.on{color:var(--text);background:none}
/* One underline for the whole bar, so it slides to the tab you chose rather than
   blinking out under one and in under the next. */
.bar .ind{position:absolute;bottom:5px;width:22px;height:2px;background:var(--mk);left:var(--x,0px);opacity:var(--o,0);
  transition:left .28s cubic-bezier(.32,.72,0,1),opacity .2s}
:root[data-theme=dark] .bar button.on{color:var(--text)}
.bar button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bar .add{width:50px;height:50px;border-radius:50%;background:var(--mk);color:var(--onmk);font-size:28px;font-weight:800;display:grid;place-items:center;margin:0 6px;padding:0;line-height:1;box-shadow:0 8px 20px -8px rgba(11,12,14,.4)}
.bar .add svg{width:26px;height:26px;stroke:var(--onmk);stroke-width:2.5}
.bar .add:disabled{opacity:.4}
.bar[hidden]{display:none}
/* A keyboard is up. No app puts its tab bar on top of one, and here it would sit over
   the box being typed into. */
:root.keys .bar{display:none}
dialog{background:var(--sheet);color:var(--text);border:0;border-radius:24px 24px 0 0;width:100%;max-width:100%;
  margin:auto 0 var(--kb, 0px);max-height:calc(100dvh - var(--kb, 0px) - 24px);overflow:auto;
  padding:20px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.2)}
dialog::backdrop{background:rgba(18,33,43,.5);backdrop-filter:blur(2px)}
/* A sheet comes up from the bottom and goes back the way it came; a grab handle says so. */
#dlg::before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:var(--line);margin:-6px auto 14px}
#dlg[open]{animation:sheet .42s cubic-bezier(.32,.72,0,1)}
#dlg[open]::backdrop{animation:fade .3s}
#dlg.out{animation:sheetout .24s cubic-bezier(.4,0,1,1) forwards}
#dlg.out::backdrop{animation:fadeout .24s forwards}
@keyframes sheet{from{transform:translateY(100%)}}
@keyframes sheetout{to{transform:translateY(100%)}}
@media(min-width:640px){
  #dlg[open]{animation:popin .26s cubic-bezier(.2,.8,.2,1)}
  #dlg.out{animation:popout .18s ease-in forwards}
  #dlg::before{display:none}
}
@keyframes popout{to{opacity:0;transform:scale(.96)}}
@keyframes fade{from{opacity:0}}
@keyframes fadeout{to{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@keyframes popin{from{opacity:0;transform:scale(.88)}}
.reactpick{animation:popin .16s cubic-bezier(.2,.8,.2,1);transform-origin:left bottom}
.emoji:not([hidden]){animation:rise .18s cubic-bezier(.2,.7,.2,1)}
#story:not([hidden]),#make:not([hidden]){animation:fade .2s}
#story:not([hidden]) .pane{animation:popin .24s cubic-bezier(.2,.8,.2,1)}
#party:not([hidden]){animation:fade .2s}
#party:not([hidden]) .card{animation:spring .5s cubic-bezier(.2,.8,.2,1)}
@keyframes spring{0%{opacity:0;transform:scale(.8)}60%{opacity:1;transform:scale(1.03)}100%{transform:none}}
#err:not([hidden]){animation:rise .22s cubic-bezier(.2,.7,.2,1)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0s!important;transition-duration:0s!important}}
dialog h2{font-size:20px;margin-bottom:2px}
@media(min-width:640px){dialog{border-radius:24px;width:min(92vw,460px);margin:auto}}
/* welcome + auth */
.welcome{min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--text);border-top:6px solid var(--mk);display:flex;flex-direction:column;padding:calc(28px + env(safe-area-inset-top)) 24px calc(28px + env(safe-area-inset-bottom))}
.welcome .mark svg{width:60px;height:60px}
.welcome h1{font-family:Oswald,system-ui,sans-serif;margin:auto 0 0;font-size:46px;font-weight:600;letter-spacing:0;line-height:.98;text-transform:uppercase;text-wrap:balance}
.welcome p{color:var(--muted);font-weight:600;font-size:17px;line-height:1.45;margin:16px 0 26px;max-width:32ch}
.welcome .primary{width:100%;padding:16px;border-radius:0;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.welcome .ghost{color:var(--muted);align-self:center;margin-top:10px;font-weight:800;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.auth{max-width:400px;margin:8vh auto 0;padding:env(safe-area-inset-top) 18px 0;text-align:center}
.auth .word{display:inline-flex;align-items:center;gap:10px;font-family:Oswald,system-ui,sans-serif;font-weight:600;font-size:32px;letter-spacing:.08em;text-transform:uppercase;color:var(--text)}
.auth .word svg{width:44px;height:44px;border-radius:11px}
.auth h2{font-size:22px;margin:18px 0 4px}
.auth p{color:var(--muted);font-weight:600;margin:0 0 18px}
.auth .card{margin:0;text-align:left}
.auth .card .primary{width:100%;margin-top:18px;padding:13px}
.auth .switch{margin-top:14px;color:var(--muted);font-weight:600}
.auth .switch button{padding:0 4px;background:none;color:var(--mkt)}
.back{margin:12px 18px 0}
/* recording in the app */
#cam{position:fixed;inset:0;width:100%;max-width:100%;height:100%;max-height:100%;margin:0;padding:0;
  border:0;border-radius:0;background:#000;box-shadow:none;display:flex;flex-direction:column;overflow:hidden}
#cam:not([open]){display:none}
#cam::backdrop{background:#000}
#campre{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
/* The front camera is shown mirrored, the way every phone camera shows it — you are
   looking at yourself, not at a picture of yourself. What is recorded is not mirrored. */
#campre.mirror{transform:scaleX(-1)}
.camtop{position:relative;z-index:2;display:flex;align-items:center;gap:10px;
  padding:calc(12px + env(safe-area-inset-top)) 16px 0}
.camtop button{background:rgba(0,0,0,.45);color:#fff;border-radius:999px;width:38px;height:38px;padding:0;font-size:17px;
  display:grid;place-items:center;flex:none}
.camtop button svg{width:19px;height:19px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.camtop button.on{background:var(--mk)}
.camtop button.on svg{stroke:var(--onmk)}
/* display:grid above, and display on an SVG path, both beat the plain hidden attribute,
   so a control meant to be absent sits there looking live. Said outright instead. */
.camtop button[hidden],#micoff[hidden]{display:none}
.camtop .rec{flex:1;text-align:center;color:#fff;font-weight:800;font-family:Oswald,system-ui,sans-serif;font-size:15px;
  text-shadow:0 1px 6px rgba(0,0,0,.6)}
.camtop .rec b{display:inline-block;width:9px;height:9px;border-radius:50%;background:#ff3b30;margin-right:7px;
  vertical-align:middle;animation:blink 1.1s steps(2,end) infinite}
@keyframes blink{50%{opacity:0}}
.camtop .rec small{font-weight:700;opacity:.65;font-size:13px}
/* Timer, shutter, flip — the shutter dead centre whatever sits beside it. */
.cambot{position:relative;z-index:2;margin-top:auto;display:grid;grid-template-columns:1fr auto 1fr;
  align-items:center;justify-items:center;gap:10px;padding:0 20px calc(28px + env(safe-area-inset-bottom))}
.shutter{width:74px;height:74px;border-radius:50%;padding:0;background:rgba(255,255,255,.25);
  border:4px solid #fff;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.shutter.on{background:var(--mk);border-radius:18px;width:58px;height:58px}
.shutter[disabled]{opacity:.45}
.camaux{width:54px;height:54px;border-radius:50%;padding:0;background:rgba(0,0,0,.45);color:#fff;
  display:grid;place-items:center;font-weight:800;font-size:13px;border:1px solid rgba(255,255,255,.25)}
.camaux svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.camaux.on{background:var(--mk);border-color:transparent;color:var(--onmk)}
.camaux.on svg{stroke:var(--onmk)}
.camaux[hidden]{display:none}
.camaux[disabled]{opacity:.35}
/* Pick the days. Seven of anything on a phone wants to be a row of taps, not a menu. */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.days label{display:block;position:relative}
.days input{position:absolute;opacity:0;width:100%;height:100%;margin:0;left:0;top:0}
.days span{display:grid;place-items:center;height:40px;border-radius:0;border:1px solid var(--line);
  background:var(--card);font-weight:800;font-size:13px;color:var(--muted)}
.days input:checked + span{background:var(--teal);border-color:var(--teal);color:var(--onteal)}
#gdays[hidden]{display:none}
/* Which of the two the shutter takes. Sits where a phone camera puts it: just above it. */
.cammode{position:absolute;left:0;right:0;bottom:calc(112px + env(safe-area-inset-bottom));z-index:2;
  display:flex;justify-content:center;gap:6px}
.cammode button{background:rgba(0,0,0,.45);color:rgba(255,255,255,.7);border-radius:999px;padding:7px 16px;font-size:13px;font-weight:800}
.cammode button.on{background:#fff;color:#111}
.cammode[hidden]{display:none}
.camrev img{flex:1;min-height:0;width:100%;object-fit:contain;background:#000}
.camrev img[hidden],.camrev video[hidden]{display:none}
.shutter.pic{background:#fff}
.camzoom{position:absolute;left:0;right:0;bottom:calc(128px + env(safe-area-inset-bottom));z-index:2;padding:0 28px}
.camzoom[hidden]{display:none}
.camzoom input{width:100%}
/* The count-in, for filming yourself: put the phone down and get into position. */
.camcount{position:absolute;inset:0;z-index:3;display:grid;place-items:center;pointer-events:none;
  color:#fff;font-family:Oswald,system-ui,sans-serif;font-size:104px;font-weight:800;text-shadow:0 4px 30px rgba(0,0,0,.7)}
.camcount[hidden]{display:none}
/* Watch it back before it goes anywhere, the way you would on a camera roll. */
.camrev{position:absolute;inset:0;z-index:4;background:#000;display:flex;flex-direction:column}
.camrev[hidden]{display:none}
.camrev video{flex:1;min-height:0;width:100%;object-fit:contain;background:#000}
.camrevw{color:#fff;opacity:.75;font-size:13px;font-weight:700;text-align:center;padding:12px 16px 0}
.camrev .row{padding:12px 16px calc(22px + env(safe-area-inset-bottom));gap:12px}
.camrev .row button{flex:1}
.camwhy{position:relative;z-index:2;margin:auto 22px;color:#fff;font-weight:700;text-align:center;line-height:1.4}
.camwhy[hidden]{display:none}

/* the wheel */
.wheelbox{position:relative;width:min(260px,72vw);margin:14px auto 0;aspect-ratio:1}
.wheel-face{width:100%;height:100%;display:block;filter:drop-shadow(0 10px 24px rgba(0,0,0,.22))}
/* 4.2s, slowing right down at the end, so it reads as a wheel losing momentum */
.wheel-spin{width:100%;height:100%;transition:transform 4.2s cubic-bezier(.15,.85,.15,1)}
.pointer{position:absolute;top:-3px;left:50%;translate:-50% 0;z-index:2;width:0;height:0;
  border-left:11px solid transparent;border-right:11px solid transparent;border-top:19px solid var(--text);
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.stage{transition:opacity .3s}
.stage.later{opacity:0;height:0;overflow:hidden}
.stagelabel{margin:18px 0 -4px;text-align:center;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.landed{text-align:center;font-family:Oswald,system-ui,sans-serif;font-weight:800;font-size:19px;
  margin:14px 0 0;opacity:0;transform:translateY(6px);transition:opacity .35s,transform .35s}
.landed.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.wheel-spin{transition-duration:1.2s}}

/* a wheel as it appears in the group */
.wh{border:1px solid var(--line);border-radius:0;padding:13px 14px;margin-top:10px}
.wh:first-of-type{margin-top:0}
.wh .top{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;padding:0;
  font:inherit;color:inherit;text-align:left;cursor:pointer}
.wh .top:active{transform:none;opacity:.6}
.wh .chev{width:16px;height:16px;flex:none;margin-left:-2px;stroke:var(--muted);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.wh b{font-size:15px}
.wh .when{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
.wh .got{font-weight:800;font-size:15px;margin-top:8px}
.wh .got.out{color:var(--muted);font-weight:700}
.wh .who{font-size:13px;font-weight:600;color:var(--muted);margin-top:2px}
.due{border-color:var(--mk);background:linear-gradient(180deg,var(--mkveil),transparent)}
.spinday{border-color:var(--mk)}
.spinday b{font-family:Oswald,system-ui,sans-serif;font-size:15px}
.spinday p{margin-top:4px}
.ticks{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tick{display:inline-block;padding:6px 9px;border-radius:0;border:1px solid var(--line);background:var(--card);
  font-size:12px;font-weight:700;color:var(--muted)}
.tick.on{background:var(--mktint);border-color:var(--mk);color:var(--mkt)}

/* Hitting a long run is the whole point of the app, so it is worth stopping for. Sits over
   everything, waits to be dismissed, and is the one place in here that is allowed to be
   loud. */
#party{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:24px;
  background:rgba(8,12,10,.55);backdrop-filter:blur(3px)}
#party[hidden]{display:none}
#party canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#party .card{position:relative;background:var(--card);border:1px solid var(--line);padding:30px 26px 24px;
  max-width:330px;width:100%;text-align:center;box-shadow:0 30px 60px -20px rgba(8,12,10,.5)}
#party .n{font-family:Oswald,system-ui,sans-serif;font-weight:600;font-size:76px;line-height:.82;
  letter-spacing:-.02em;padding:.08em .04em .2em 0;margin:-.08em 0 -.2em 0;
  background:linear-gradient(to top,var(--g1) 0,var(--g1) var(--fill),var(--g2) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
#party .days{display:block;font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;
  color:var(--muted);margin-top:10px}
#party h2{font-size:21px;font-weight:800;letter-spacing:-.02em;margin-top:16px}
#party p{color:var(--muted);font-weight:600;font-size:14.5px;line-height:1.45;margin-top:8px}
#party button{width:100%;margin-top:22px;padding:14px;background:var(--mk);color:var(--onmk);
  font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
#party button.share{margin-top:9px;background:none;color:var(--mkt);border:1px solid var(--line)}

/* the splash while the first load runs, and the banner when it fails */
.splash{display:flex;flex-direction:column;align-items:center;gap:18px;padding-top:28vh;color:var(--muted)}
.splash svg{width:64px;height:64px;border-radius:16px}
.splash i{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--mk);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.splash i{animation-duration:2.4s}}
#err{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));max-width:576px;margin:0 auto;z-index:30;display:flex;gap:12px;align-items:center;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:0;padding:12px 14px;box-shadow:0 12px 30px -10px rgba(0,0,0,.35);font-size:13px;font-weight:600;line-height:1.35}
#err[hidden]{display:none}
#err span{flex:1;min-width:0}
#err button{flex:none;background:var(--soft);color:var(--mkt);padding:7px 12px;font-size:13px}
/* iOS Safari has no install prompt, so this explains Add to Home Screen once */
#a2hs{position:fixed;top:calc(10px + env(safe-area-inset-top));left:12px;right:12px;max-width:576px;margin:0 auto;z-index:20;display:flex;gap:12px;align-items:center;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:0;padding:12px 14px;box-shadow:0 12px 30px -10px rgba(0,0,0,.35)}
#a2hs[hidden]{display:none}
#a2hs .share{width:26px;height:26px;flex:none;stroke:var(--mkt);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#a2hs p{flex:1;min-width:0;font-size:13px;line-height:1.35}
#a2hs b{display:block;font-size:14px}
#a2hs span{color:var(--muted);font-weight:600}
#a2hs button{background:none;color:var(--muted);padding:4px 6px;font-size:15px;flex:none}
</style>

// An access token that went stale while the app was closed is the ordinary case for an
// installed app: it can sit suspended for days. Worth one forced refresh before giving up.
const authErr = e => e && (e.status === 401 || e.code === 'PGRST301' || /jwt|token|not authenticated|unauthorized/i.test(e.message || ''));

let inFlight = null, lastLoad = 0, pushKnown = false;
function load() { return inFlight || (inFlight = runLoad().finally(() => { inFlight = null; lastLoad = Date.now(); })); }

async function runLoad() {
  quiet++;
  try {
    try { await fetchAll(); }
    catch (e) {
      if (!authErr(e)) throw e;
      const {data, error} = await sb.auth.refreshSession();
      if (error || !data.session) { S.me = null; S.open = null; S.auth = 'welcome'; hideErr(); return; } // signed out for real, not just stale
      await fetchAll();
    }
    hideErr();
  } catch (e) {
    showErr(navigator.onLine ? `Could not load: ${plainly(e.message)}` : 'You are offline. Showing what was already here.', e && e.stack);
  } finally {
    quiet--; S.booting = false; render();
    // Whether notifications are on is only known by asking the browser, and until it has
    // been asked the feed cannot tell whether to offer them. Once per launch is enough.
    if (!pushKnown && me()) { pushKnown = true; refreshPush().then(render).catch(() => {}); }
    if (me() && location.hash) goToHash();
  }
}
function render() {
  const m = me();
  // One number decides the green everywhere: the best run going across your groups. Set on
  // the root so the tokens, the figure in the header and the arc in the mark all agree.
  document.documentElement.dataset.stage = String(stageOf(myStreak()));
  $('#bar').hidden = !m; $('#app').classList.toggle('out', !m);
  // Until the first load lands we do not know whether there is a session, and guessing
  // means flashing the sign-in screen at someone who is already signed in.
  if (!m) return $('#app').innerHTML = S.booting ? splashView() : S.auth === 'welcome' ? welcomeView() : S.auth === 'reset' ? resetView() : authView(S.auth);
  const g = S.open && S.groups.find(x => x.id === S.open && x.members.includes(m.id));
  if (S.open && !g) S.open = null;
  // One screen that cannot be drawn must not take the app with it. This runs inside
  // runLoad's finally, so a throw here escapes the load entirely and leaves whatever was
  // on screen — the splash, on a cold start — with a Retry that fails the same way.
  try {
    // The screen is rebuilt from scratch, which used to take a playing clip with it: a like
    // or a reply swapped the <video> for a fresh one that had not decoded a frame, and the
    // post went black. The reels already on screen are kept and put back, along with
    // anything half-typed into a reply box.
    const keep = new Map([...document.querySelectorAll('#app .post[data-post] .reel')].map(r => [r.parentNode.dataset.post, r]));
    const typed = new Map([...document.querySelectorAll('#app .post[data-post] .cin input')].filter(i => i.value).map(i => [i.closest('.post').dataset.post, i.value]));
    $('#app').innerHTML = g ? groupView(g) : {feed: feedView, groups: groupsView, friends: friendsView, profile: profileView}[S.tab]();
    document.querySelectorAll('#app .post[data-post] .reel').forEach(r => {
      const old = keep.get(r.parentNode.dataset.post); if (!old) return;
      const np = r.querySelector('.proof'), op = old.querySelector('.proof');
      if (!np || !op || np.tagName !== op.tagName) return;          // a different thing now: take the new one
      if (np.dataset.src) op.dataset.src = np.dataset.src;         // a reload re-signs every URL; the old one is still good for an hour
      const nr = r.querySelector('.reacts'), or = old.querySelector('.reacts');   // the one other thing on a reel that changes
      if (or) or.remove(); if (nr) old.appendChild(nr);
      r.replaceWith(old);
    });
    typed.forEach((v, id) => { const i = document.querySelector(`#app .post[data-post="${id}"] .cin input`); if (i) i.value = v; });
  // After the screen is drawn, not before: the celebration sits over whatever you were
  // looking at. Cheap enough to ask on every render, and it answers once.
  const mile = milestoneDue();
  if (mile && $('#party').hidden) party(mile);
  } catch (e) {
    console.error(e);
    showErr(`This screen could not be drawn: ${e.message}`, e.stack);
    $('#app').innerHTML = `<div class="card empty"><b>Something here is not right</b><p class="muted">${esc(e.message)}</p>
      <p class="muted">The other tabs still work.</p></div>`;
  }
  const ico = {feed: '<path d="M4 6h16M4 12h16M4 18h10"/>', groups: '<circle cx="9" cy="8" r="3.5"/><circle cx="17" cy="9" r="2.5"/><path d="M3 19c0-3.3 2.7-5 6-5s6 1.7 6 5M15 15c2.8 0 5 1.3 5 4"/>', friends: '<circle cx="10" cy="8" r="3.5"/><path d="M4 19c0-3.3 2.7-5 6-5s6 1.7 6 5M19 8v6M16 11h6"/>', profile: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/>'};
  const tab = (t, l) => `<button data-tab="${t}" onclick="go('${t}')"><svg viewBox="0 0 24 24">${ico[t]}</svg>${l}</button>`;
  watchClips();
  // The bar is only rebuilt when its markup changes; which tab is on is a class and the
  // underline's position, so the underline can slide rather than be redrawn.
  const bar = $('#bar'), html = tab('feed', 'Feed') + tab('groups', 'Groups') + `<button class="add" onclick="submitDlg(${g ? g.id : 0})" title="Submit proof" ${myGroups().length ? '' : 'disabled'}><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>` + tab('friends', 'Friends') + tab('profile', 'Profile');
  if (bar.dataset.html !== html) { bar.innerHTML = html + '<i class="ind"></i>'; bar.dataset.html = html; }
  bar.querySelectorAll('button[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === S.tab && !S.open));
  const on = bar.querySelector('button.on'), ind = bar.querySelector('.ind');
  ind.style.setProperty('--o', on ? 1 : 0);
  if (on) ind.style.setProperty('--x', (on.offsetLeft + on.offsetWidth / 2 - 11) + 'px');
}

// ---- views
const splashView = () => `<div class="splash">${LOGO(true)}<i></i></div>`;
// One wheel inside a group: what you owe or what you got, then what everyone else got.
// Seeing each other's result is the whole point, so it is not tucked away anywhere.
function wheelCard(g, w) {
  const m = me(), c = cycleOf(w), mine = spinOf(w, m.id, c), soon = !running(w);
  const others = g.members.filter(id => id !== m.id).map(id => ({id, sp: spinOf(w, id, c)}));
  const head = `<button class="top" onclick="wheelInfoDlg(${w.id})" title="See what is on this wheel">
      <b>${esc(w.name)}</b><span class="when">${soon ? `starts ${dayLabel(w.starts_on)}`
    : `every ${plural(w.every_days, 'day')} · next ${dayLabel(cycleStart(w, c + 1))}`}</span>
      <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>`
    + (w.breaks_streak ? `<div class="who">Not finishing this breaks your streak.</div>` : '');
  const yours = soon ? '' : !mine
    ? `<div class="row" style="margin-top:10px"><button class="primary grow" onclick="spinDlg(${g.id})">Spin the wheel</button></div>`
    : satOut(mine)
    ? `<div class="got out">Sitting this one out</div><div class="who">Back on ${dayLabel(cycleStart(w, c + 1))}.</div>`
    : mustBorrow(mine) && !mine.challenge_override
    ? `<div class="got">${esc(BORROW)}</div><div class="who">Pick whose you are doing before it can count.</div>
       <div class="row" style="margin-top:10px"><button class="primary grow" onclick="borrowDlg(${mine.id})">Choose whose</button></div>`
    : `<div class="got">${esc(effChallenge(mine))}${mine.challenge_override ? ` <span class="muted" style="font-weight:600">(borrowed)</span>` : ''}</div>${trackRow(g, w, mine)}`;
  const rest = others.length ? `<div class="who">${others.map(o => `${esc(name(user(o.id)))}: ${!o.sp ? 'not spun yet'
    : satOut(o.sp) ? 'sitting out'
    : mustBorrow(o.sp) && !o.sp.challenge_override ? 'picking whose to do'
    : esc(effChallenge(o.sp)) + (challengeDone(g, o.sp) ? ' ✓' : '')}`).join('<br>')}</div>` : '';
  return `<div class="wh${!soon && !mine ? ' due' : ''}">${head}${yours}${rest}</div>`;
}

// How the cycle is going. Nothing to tick any more: a day fills when that day's quota has
// been met with the challenge, which is what posting with the box ticked records.
function trackRow(g, w, sp) {
  const need = requiredDays(w, sp);
  if (!need) return `<div class="who">Nothing to do this time.</div>`;
  const filled = challengeDays(g, sp), days = cycleDays(w, sp.cycle);
  const label = `${filled.length} of ${plural(need, 'day')} done`;
  return `<div class="who">${challengeDone(g, sp) ? `Done — ${label}` : label}</div>
    <div class="ticks">${days.map(d => `<span class="tick${filled.includes(d) ? ' on' : ''}">${
      d === today() ? 'Today' : dayLabel(d).replace(/,.*$/, '')}</span>`).join('')}</div>`;
}

function spinPrompt() {
  const waiting = anyDue();
  if (!waiting.length) return '';
  return waiting.map(g => `<div class="card spinday">
    <b>Today is wheel spin day</b>
    <p class="muted">${esc(dueIn(g).map(w => w.name).join(' and '))} in ${esc(g.name)}. Spin before you post.</p>
    <div class="row" style="margin-top:12px"><button class="primary grow" onclick="spinDlg(${g.id})">Spin the wheel</button></div>
  </div>`).join('');
}

// What everyone owes and what they landed on, for the group page.
// Landing on the borrow slice means choosing whose challenge to take. Only what somebody
// else actually got is on offer, and the database checks the same thing.
function borrowDlg(spinId) {
  const sp = S.spins.find(x => x.id === spinId);
  const w = sp && S.wheels.find(x => x.id === sp.wheel_id);
  if (!w) return;
  const g = S.groups.find(x => x.id === w.group_id);
  const opts = borrowable(g, w, sp);
  dlg(`<h2>Whose are you doing?</h2>
    <p class="muted">The wheel sent you to somebody else's. Pick one, and it is yours until ${dayLabel(cycleStart(w, sp.cycle + 1))}.</p>
    ${opts.length ? `<div class="list card" style="margin:14px 0 0">${opts.map(t => `<div class="row"><b class="grow">${esc(t)}</b>
      <button class="primary small" onclick="takeChallenge(${sp.id},${JSON.stringify(JSON.stringify(t)).replace(/"/g, '&quot;')})">Take it</button></div>`).join('')}</div>`
      : `<p class="warn" style="margin-top:12px">Nobody else has spun yet. Come back once they have.</p>`}
    <div class="row" style="margin-top:18px"><button type="button" class="grow" onclick="dlg()">Close</button></div>`);
}

async function takeChallenge(spinId, json) {
  try { await q(sb.rpc('use_challenge', {p_spin: spinId, p_text: JSON.parse(json)})); }
  catch (e) { return; }
  dlg(); await load();
}

function boardView(g) {
  return `<div class="card list">${standings(g).map((row, i) => {
    const u = user(row.id), you = row.id === me().id;
    return `<div class="row"><span class="rank${i === 0 && row.st ? ' top' : ''}">${i + 1}</span>${av(u)}
      <div class="grow"><b>${esc(name(u))}${you ? ' <span class="muted">(you)</span>' : ''}</b>
      <div class="muted">${row.r ? `hit the quota ${row.r.pct}% of the last ${plural(row.r.of, 'day')}` : 'just getting started'}</div></div>
      <span class="chip${row.st ? ' ok' : ''}">${plural(row.st, 'day')}</span></div>`;
  }).join('')}</div>`;
}
const smallHdr = title => `<div class="hdr"><div class="top"><div class="logo">${LOGO(false)}Quota</div><span class="date">${new Date().toLocaleDateString(undefined, {weekday: 'short', month: 'short', day: 'numeric'})}</span></div><h1>${title}</h1></div>`;
function feedView() {
  const m = me(), gs = myGroups();
  const cur = Math.max(0, ...gs.map(g => streak(g, m.id))), bst = Math.max(0, ...gs.map(g => best(g, m.id)));
  const lines = gs.flatMap(g => g.quotas.map(qq => ({g, qq, d: done(g, m.id, qq.metric)})));
  const doneN = lines.filter(l => l.d >= l.qq.target).length;
  // The challenge sits beside the quota it is being done with: today's reps say whether
  // today is in hand, the days say how the cycle is going, and both belong in one glance.
  const chals = gs.flatMap(g => myChallenges(g).map(sp => {
    const w = S.wheels.find(x => x.id === sp.wheel_id);
    return {g, sp, w, need: requiredDays(w, sp), d: challengeDays(g, sp).length};
  })).filter(c => c.need);
  return `<div class="hdr"><div class="top"><div class="logo">${LOGO(false)}Quota</div><span class="date">${new Date().toLocaleDateString(undefined, {weekday: 'long', month: 'long', day: 'numeric'})}</span></div>
    <div class="big"><b class="num">${cur}</b><div>day streak<small>${bst ? `best ${bst}` : 'no streak yet'}${lines.length ? ` · ${doneN} of ${lines.length} quota${lines.length === 1 ? '' : 's'} done today` : ''}</small></div></div>
    ${lines.length || chals.length ? `<div class="mini">${lines.map(l => `<div><span>${esc(l.qq.metric)}${gs.length > 1 ? `<em>${esc(l.g.name)}</em>` : ''}</span><i class="${l.d >= l.qq.target ? 'done' : ''}" style="--w:${Math.min(100, l.d / l.qq.target * 100)}%"></i><b>${l.d}/${l.qq.target}</b></div>`).join('')
      }${chals.map(c => `<div><span>${esc(effChallenge(c.sp))}${gs.length > 1 ? `<em>${esc(c.g.name)}</em>` : ''}</span><i class="${c.d >= c.need ? 'done' : ''}" style="--w:${Math.min(100, c.d / c.need * 100)}%"></i><b>${c.d}/${c.need} challenge ${c.need === 1 ? 'day' : 'days'}</b></div>`).join('')}</div>` : ''}</div>`
    + storyRow()
    + pushPrompt()
    + spinPrompt()
    + activityBox()
    + (gs.length ? feed(S.posts, true) : `<div class="card empty"><b>No groups yet</b><p class="muted">Make one under Groups, or accept an invite. Proof from your groups shows up here.</p></div>`);
}
// ---- stories
// Only people with something running appear, unseen first, the way every app that has
// these does it. Somebody in your groups who has posted nothing is not a gap in the row —
// they are simply not in it.
const FRESH = () => Date.now() - 864e5;
const liveStories = () => S.stories.filter(x => x.ts > FRESH());
const storiesOf = id => liveStories().filter(x => x.u === id).sort((a, b) => a.ts - b.ts);
const unseenOf = id => storiesOf(id).filter(x => !S.seen.includes(x.id));
// Ways for a card of text to look. The app's own greens first, then a couple that are just
// for fun, because a story is allowed to be.
const STORY_BG = ['linear-gradient(160deg,#0b5a34,#2fd36f)', 'linear-gradient(160deg,#0b0c0e,#343b3f)',
  'linear-gradient(160deg,#2fd36f,#a7f3d0)', 'linear-gradient(160deg,#12934f,#0b0c0e)',
  'linear-gradient(160deg,#f7f7f5,#d9dedb)', 'linear-gradient(160deg,#1db061,#0b5a34)',
  'linear-gradient(160deg,#ff9f43,#ff5d73)', 'linear-gradient(160deg,#5fd0ff,#a78bfa)'];
// Tap the pill to go round these, the way the other app does it.
const STORY_FONT = [
  {name: 'Strong', css: 'Oswald,system-ui,sans-serif', w: 600, tt: 'uppercase', ls: '.02em'},
  {name: 'Classic', css: "'Plus Jakarta Sans',system-ui,sans-serif", w: 800, tt: 'none', ls: '-.02em'},
  {name: 'Light', css: "'Plus Jakarta Sans',system-ui,sans-serif", w: 500, tt: 'none', ls: '0'},
  {name: 'Mono', css: 'ui-monospace,SFMono-Regular,Menlo,monospace', w: 700, tt: 'none', ls: '0'},
];
const STORY_INK = ['#ffffff', '#0b0c0e', '#2fd36f', '#ffd60a', '#ff5d73', '#ff9f43', '#5fd0ff', '#a78bfa', '#ff6fb5', '#7ef0b0', '#8b8f94'];
// What goes behind words when they are boxed: the ink itself, with whichever of black or
// white reads on it.
const onInk = c => { const [r, g, b] = [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16)); return (r * .299 + g * .587 + b * .114) > 150 ? '#0b0c0e' : '#ffffff'; };
const styleOf = st => ({bg: 0, font: 0, ink: 0, size: 1, box: 0, align: 'center', x: .5, y: .5,
  stk: null, sx: .5, sy: .74, tpl: null, n: null, sub: null, ...(st.style || {})});

// The words as a block that sits wherever it was dragged to. In the editor the same block
// is the thing being typed into, so what you see is exactly what everyone else gets.
function wordsOf(st, editing) {
  const y = styleOf(st), f = STORY_FONT[y.font] || STORY_FONT[0], ink = STORY_INK[y.ink] || '#fff';
  if (!st.body && !editing) return '';
  const boxed = y.box === 1 ? `background:${ink};color:${onInk(ink)}` : y.box === 2 ? `background:rgba(0,0,0,.38);color:${ink}` : `color:${ink}`;
  return `<div class="type sz${y.size}${y.box ? ' boxed' : ''}" style="left:${y.x * 100}%;top:${y.y * 100}%;font-family:${f.css};font-weight:${f.w};text-transform:${f.tt};letter-spacing:${f.ls};text-align:${y.align};${boxed}"${
    editing ? ' contenteditable="true" spellcheck="false" data-ph="Say something"' : ''}>${esc(st.body || '')}</div>`;
}

// Decoration for the two it writes for you: the app's own ring, large and faint, and a
// scatter of sparks. Drawn in the ink colour so the colour strip recolours it too.
const SPARK = (x, y, r) => `<path d="M${x} ${y - r} Q${x} ${y} ${x + r} ${y} Q${x} ${y} ${x} ${y + r} Q${x} ${y} ${x - r} ${y} Q${x} ${y} ${x} ${y - r}Z"/>`;
function tplFace(y) {
  const deco = `<svg class="deco" viewBox="0 0 390 693" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <g fill="currentColor" opacity=".9">${SPARK(62, 118, 16)}${SPARK(330, 96, 10)}${SPARK(342, 250, 22)}${SPARK(48, 372, 9)}${SPARK(300, 560, 13)}${SPARK(84, 610, 18)}</g>
    <circle cx="330" cy="620" r="150" fill="none" stroke="currentColor" stroke-width="34" opacity=".14"/>
    <circle cx="330" cy="620" r="150" fill="none" stroke="currentColor" stroke-width="34" stroke-linecap="round" stroke-dasharray="705 942" transform="rotate(-90 330 620)" opacity=".28"/>
  </svg>`;
  if (y.tpl === 'streak') return `${deco}<div class="hero">
    <b class="big">${esc(String(y.n ?? ''))}</b><span class="tag">day streak</span></div>`;
  return `${deco}<div class="hero">
    <span class="tickring"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="20" fill="none" stroke="currentColor" stroke-width="4"/><path d="M15 25l6 6 12-13" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    <b class="big">${esc(String(y.n ?? ''))}</b><span class="tag">${esc(y.sub || '')}</span>
    <span class="stamp">Done</span></div>`;
}

// One drawing used by the editor and the viewer alike.
function storyFace(st, live, editing) {
  const y = styleOf(st), bg = st.kind === 'text' ? STORY_BG[y.bg] || STORY_BG[0] : '#000';
  const media = st.kind === 'text' ? ''
    : st.kind === 'photo' ? `<img class="fill" alt=""${st.url ? ` src="${esc(st.url)}"` : ''}>`
    : `<video class="fill" playsinline ${live ? 'autoplay' : ''} muted="${live ? 'false' : 'true'}"${st.url ? ` src="${esc(st.url)}"` : ''}></video>`;
  const stk = y.stk ? `<span class="stk" style="left:${y.sx * 100}%;top:${y.sy * 100}%">${esc(y.stk)}</span>` : '';
  return `<div class="face${y.tpl ? ' tpl' : ''}" style="background:${bg};color:${STORY_INK[y.ink] || '#fff'}">${media}${y.tpl ? tplFace(y) : ''}${wordsOf(st, editing)}${stk}</div>`;
}

function storyRow() {
  const m = me();
  // Everyone you can see, which is both rules at once: your groups and your friends.
  const near = [...new Set([...myGroups().flatMap(g => g.members), ...S.friends])].filter(id => id !== m.id);
  const withOne = near.filter(id => storiesOf(id).length);
  const order = [...withOne.filter(id => unseenOf(id).length), ...withOne.filter(id => !unseenOf(id).length)];
  const mine = storiesOf(m.id).length;
  return `<div class="stories">
    <button type="button" class="s me${mine ? ' has' : ''}" onclick="${mine ? `openStory('${m.id}')` : 'storyKind()'}">
      <span class="rg${mine ? (unseenOf(m.id).length ? ' new' : ' old') : ''}">${av(m)}${mine ? '' : '<i>+</i>'}</span>
      <span class="nm">${mine ? 'Your story' : 'Add story'}</span></button>
    ${order.map(id => { const u = user(id), fresh = unseenOf(id).length;
      return `<button type="button" class="s" onclick="openStory('${id}')">
        <span class="rg ${fresh ? 'new' : 'old'}">${av(u)}</span>
        <span class="nm">${esc(name(u))}</span></button>`; }).join('')}
  </div>`;
}

// ---- watching one
let storyTimer = null;
function openStory(uid) {
  const all = storiesOf(uid);
  if (!all.length) return;
  // Straight to the first one you have not seen, so opening somebody twice does not make
  // you sit through the ones you have.
  const from = all.findIndex(x => !S.seen.includes(x.id));
  S.story = {uid, i: from < 0 ? 0 : from};
  paintStory();
}
function closeStory() { clearTimeout(storyTimer); S.story = null; $('#story').hidden = true; $('#story').innerHTML = ''; render(); }
function stepStory(d) {
  const all = storiesOf(S.story.uid), i = S.story.i + d;
  if (i < 0) return;
  if (i >= all.length) return closeStory();
  S.story.i = i; paintStory();
}
function paintStory() {
  const box = $('#story'), all = storiesOf(S.story.uid), st = all[S.story.i];
  if (!st) return closeStory();
  const u = user(st.uid || S.story.uid);
  box.hidden = false;
  box.innerHTML = `<div class="pane">
    <div class="bars">${all.map((x, i) => `<i class="${i < S.story.i ? 'done' : i === S.story.i ? 'now' : ''}"></i>`).join('')}</div>
    <div class="who">${av(u)}<b>${esc(name(u))}</b><span>${ago(st.ts)}</span>
      ${st.u === me().id ? `<button type="button" class="bin" onclick="delStory(${st.id})" aria-label="Delete">🗑</button>` : ''}
      <button type="button" class="x" onclick="closeStory()" aria-label="Close">✕</button></div>
    ${storyFace(st, true)}
    <button type="button" class="tap back" onclick="stepStory(-1)" aria-label="Previous"></button>
    <button type="button" class="tap fwd" onclick="stepStory(1)" aria-label="Next"></button>
    ${st.u === me().id ? `<button type="button" class="eye" onclick="seenBy(${st.id})">${EYE} ${viewersOf(st.id).length}</button><div class="seenby" hidden></div>` : ''}
  </div>`;
  markSeen(st.id);
  clearTimeout(storyTimer);
  // A card of text is read in a few seconds; a clip runs as long as it runs.
  if (st.kind !== 'video') storyTimer = setTimeout(() => S.story && stepStory(1), 5000);

// Drag a thing about the card. A press that does not move is a tap, and a tap on the words
// puts the caret in them; a press that moves takes the block with it and remembers where it
// was let go. While the words have the caret, pointer events are theirs to place it.
function dragify(el, kx, ky, onTap) {
  let sx = 0, sy = 0, ox = 0, oy = 0, moved = false, live = false;
  el.addEventListener('pointerdown', e => {
    if (el.isContentEditable && document.activeElement === el) return;
    live = true; moved = false; sx = e.clientX; sy = e.clientY;
    const r = el.getBoundingClientRect(); ox = r.left + r.width / 2; oy = r.top + r.height / 2;
    try { el.setPointerCapture(e.pointerId); } catch (x) {}
    e.preventDefault();
  });
  el.addEventListener('pointermove', e => {
    if (!live) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (!moved && Math.hypot(dx, dy) < 6) return;
    moved = true;
    const st = el.closest('.face').getBoundingClientRect();
    el.style.left = `${((ox + dx - st.left) / st.width) * 100}%`;
    el.style.top = `${((oy + dy - st.top) / st.height) * 100}%`;
  });
  const done = e => {
    if (!live) return; live = false;
    if (!moved) return onTap();
    const st = el.closest('.face').getBoundingClientRect();
    const x = Math.min(.95, Math.max(.05, (e.clientX - sx + ox - st.left) / st.width));
    const yy = Math.min(.95, Math.max(.05, (e.clientY - sy + oy - st.top) / st.height));
    S.draft.style = {...styleOf(S.draft), [kx]: +x.toFixed(3), [ky]: +yy.toFixed(3)};
  };
  el.addEventListener('pointerup', done);
  el.addEventListener('pointercancel', done);
}

// A signed URL lasts an hour and every post gets one at load, so a feed left open long
// enough, or a post whose file could not be signed at all, ends up pointing at nothing.
// Either way the player shows a black rectangle and a play button that does nothing,
// which is indistinguishable from a clip that is just slow to arrive. So a failure
// quietly asks for a fresh URL and tries once more, and only says so if that fails too.
// A phone will only keep a handful of <video> elements loaded at once — past that they
// come up black and will not start, which is why it is the ones further down a long feed
// that "sometimes don't work". So a clip is only given its source while it is near the
// screen, and gives it back once it is well past and not playing.
let clipObs = null;
const attachClip = v => {
  delete v.dataset.idle;
  if (v.getAttribute('src') || !v.dataset.src) return;
  v.src = v.dataset.src;
  // preload="metadata" fetches the header and stops, and a video element that has never
  // decoded a frame paints nothing — which is the black rectangle where the first frame
  // of somebody's clip should be. Nudging off zero makes it decode one and show it.
  if (v.tagName === 'VIDEO') v.addEventListener('loadedmetadata', () => {
    try { if (v.currentTime < 0.05) v.currentTime = 0.05; } catch (e) {}
  }, {once: true});
};
function releaseClip(v) {
  if (!v.getAttribute('src') || (v.tagName === 'VIDEO' && !v.paused)) return;
  v.dataset.idle = '1';                    // so letting go is not mistaken for a failure
  v.removeAttribute('src');
  v.load();
}
function watchClips() {
  if (clipObs) clipObs.disconnect();
  const vs = [...document.querySelectorAll('.reel .proof')];
  // Without an observer there is no way to tell what is on screen, so load them all and
  // accept the old behaviour rather than showing nothing.
  if (!self.IntersectionObserver) return vs.forEach(attachClip);
  // A hidden element reports as off screen too — a clip whose reel is showing a failure,
  // say. That is not "scrolled away", and taking its source back gains nothing, so only
  // something with a box of its own is let go.
  clipObs = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) attachClip(e.target);
    else if (e.boundingClientRect.width) releaseClip(e.target);
  }), {rootMargin: '150% 0px'});
  vs.forEach(v => clipObs.observe(v));
}

// The phone's own keyboard has an emoji key, and this does not replace it — it is there
// for the same reason every chat box has one: reaching emoji without leaving the field.

const reelOf = v => v.closest('.reel');
function bustMsg(v, msg) {
  const reel = reelOf(v);

  reel.classList.remove('playing');
}
async function freshUrl(postId) {
  const p = S.posts.find(x => x.id === postId);
  if (!p || !p.path) return '';
  const {data, error} = await sb.storage.from('proof').createSignedUrl(p.path, 3600);
  if (error || !data || !data.signedUrl) return '';
  p.url = data.signedUrl;
  return p.url;                            // the element's data-src is refreshed by whoever asked
}
async function clipBust(v, postId, play) {
  if (v.dataset.idle) return;              // we took its source away on purpose
  // Code 4 is the browser saying it cannot decode this at all. A newer URL will not help
  // — the clip was recorded in something this device has no decoder for.
  if (v.error && v.error.code === 4) return bustMsg(v, 'This clip is in a format this device cannot play.');
  const what = v.tagName === 'IMG' ? 'picture' : 'clip';
  if (v.dataset.retried) return bustMsg(v, `This ${what} could not be loaded.`);
  v.dataset.retried = '1';
  const url = await freshUrl(postId);
  if (!url) return bustMsg(v, `This ${what} could not be loaded.`);
  v.dataset.src = url;
  v.src = url;
  if (v.tagName === 'VIDEO') { v.load(); if (play) v.play().catch(() => {}); }
}
function playClip(v, postId) {
  attachClip(v);                           // tapped before it came into view: give it back its source

  if (!v.paused) return v.pause();
  // play() rejects when the source never arrived, and an unhandled rejection here is the
  // whole bug: the tap does nothing and nothing says why.
  const go = v.play();
  if (go && go.catch) go.catch(() => clipBust(v, postId, true));
}

function clipState(v, st) {

  reel.classList.toggle('playing', st === 'play');
  clearTimeout(reel._flash);
  if (st === 'play') { reel.classList.add('started', 'flash'); reel._flash = setTimeout(() => reel.classList.remove('flash'), 700); }
  else reel.classList.remove('flash');
  if (st === 'end') { reel.classList.remove('started'); const b = reel.querySelector('.prg b'); if (b) b.style.width = '0'; }
}
function clipTime(v) {
  const b = reelOf(v)?.querySelector('.prg b');

}
function clipSound(btn) {

const MILESTONES = [25, 50, 100, 150, 250, 365, 500, 1000];

// thing to say out loud, and a hundred is a different kind of thing again.
const STORY_MILESTONES = [3, 5, 7, 10, 14, 21, 25, 30, 50, 75, 100, 150, 200, 250, 300, 365, 500, 1000];
const STORY_MILE_LINE = d => d >= 365 ? 'A full year. Every single day.' : d >= 100 ? 'Not one missed.' : 'Still going.';
const MILESTONE_LINE = {

  100: 'Three figures. This is the one people remember.',
  150: 'Five months of showing up, whatever the day looked like.',

// The milestone is for the day it was earned, so today has to be in the bag: the run is
// counted only in groups where the quota is already done.
function milestoneDue() {
  const m = me(); if (!m) return 0;
  const done = myGroups().filter(g => hit(g, m.id));
  if (!done.length) return 0;
  const best = Math.max(0, ...done.map(g => streak(g, m.id)));
  let seen = 0; try { seen = +(localStorage.milestone || 0); } catch (e) {}
  // The highest one newly passed, so arriving at 100 having never opened the app at 50
  // celebrates the 100 rather than walking up through every number below it.
  return MILESTONES.filter(d => d <= best && d > seen).pop() || 0;
}
function party(d) {
