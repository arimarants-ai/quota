/* The circle is what you get; one big shadow clipped by the box dims everything outside
   it, so the ring needs no second element cut out of a rectangle. */
.cropmask{position:absolute;inset:0;border-radius:50%;pointer-events:none;
  box-shadow:0 0 0 9999px rgba(11,12,14,.72);border:2px solid rgba(255,255,255,.9)}
.cropzoom,#crop .row{width:min(78vw,320px)}
.cropzoom input{width:100%}
#crop .row{gap:12px}
#crop .row button{flex:1}
.camzoom{position:absolute;left:0;right:0;bottom:calc(128px + env(safe-area-inset-bottom));z-index:2;padding:0 28px}
.camzoom[hidden]{display:none}
.camzoom input{width:100%}
/* The count-in, for filming yourself: put the phone down and get into position. */
.camcount{position:absolute;inset:0;z-index:3;display:grid;place-items:center;pointer-events:none;
  color:#fff;font-family:Oswald,system-ui,sans-serif;font-size:104px;font-weight:800;text-shadow:0 4px 30px rgba(0,0,0,.7)}
.camcount[hidden]{display:none}
/* Watch it back before it goes anywhere, the way you would on a camera roll. */
.camrev{position:absolute;inset:0;z-index:4;background:#000;display:flex;flex-direction:column}
.camrev[hidden]{display:none}
.camrev video{flex:1;min-height:0;width:100%;object-fit:contain;background:#000}
.camrevw{color:#fff;opacity:.75;font-size:13px;font-weight:700;text-align:center;padding:12px 16px 0}
.camrev .row{padding:12px 16px calc(22px + env(safe-area-inset-bottom));gap:12px}
.camrev .row button{flex:1}
.camwhy{position:relative;z-index:2;margin:auto 22px;color:#fff;font-weight:700;text-align:center;line-height:1.4}
.camwhy[hidden]{display:none}

/* the wheel */
.wheelbox{position:relative;width:min(260px,72vw);margin:14px auto 0;aspect-ratio:1}
.wheel-face{width:100%;height:100%;display:block;filter:drop-shadow(0 10px 24px rgba(0,0,0,.22))}
/* 4.2s, slowing right down at the end, so it reads as a wheel losing momentum */
.wheel-spin{width:100%;height:100%;transition:transform 4.2s cubic-bezier(.15,.85,.15,1)}
.pointer{position:absolute;top:-3px;left:50%;translate:-50% 0;z-index:2;width:0;height:0;
  border-left:11px solid transparent;border-right:11px solid transparent;border-top:19px solid var(--text);
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.stage{transition:opacity .3s}
.stage.later{opacity:0;height:0;overflow:hidden}
.stagelabel{margin:18px 0 -4px;text-align:center;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.landed{text-align:center;font-family:Oswald,system-ui,sans-serif;font-weight:800;font-size:19px;
  margin:14px 0 0;opacity:0;transform:translateY(6px);transition:opacity .35s,transform .35s}
.landed.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.wheel-spin{transition-duration:1.2s}}

/* a wheel as it appears in the group */
.wh{border:1px solid var(--line);border-radius:0;padding:13px 14px;margin-top:10px}
.wh:first-of-type{margin-top:0}
.wh .top{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;padding:0;
  font:inherit;color:inherit;text-align:left;cursor:pointer}
.wh .top:active{transform:none;opacity:.6}
.wh .chev{width:16px;height:16px;flex:none;margin-left:-2px;stroke:var(--muted);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.wh b{font-size:15px}
.wh .when{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
.wh .got{font-weight:800;font-size:15px;margin-top:8px}
.wh .got.out{color:var(--muted);font-weight:700}
.wh .who{font-size:13px;font-weight:600;color:var(--muted);margin-top:2px}
.due{border-color:var(--mk);background:linear-gradient(180deg,var(--mkveil),transparent)}
.spinday{border-color:var(--mk)}
.spinday b{font-family:Oswald,system-ui,sans-serif;font-size:15px}
.spinday p{margin-top:4px}
.ticks{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tick{display:inline-block;padding:6px 9px;border-radius:0;border:1px solid var(--line);background:var(--card);
  font-size:12px;font-weight:700;color:var(--muted)}
.tick.on{background:var(--mktint);border-color:var(--mk);color:var(--mkt)}

/* Hitting a long run is the whole point of the app, so it is worth stopping for. Sits over
   everything, waits to be dismissed, and is the one place in here that is allowed to be
   loud. */
#party{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:24px;
  background:rgba(8,12,10,.55);backdrop-filter:blur(3px)}
#party[hidden]{display:none}
#party canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#party .card{position:relative;background:var(--card);border:1px solid var(--line);padding:30px 26px 24px;
  max-width:330px;width:100%;text-align:center;box-shadow:0 30px 60px -20px rgba(8,12,10,.5)}
#party .n{font-family:Oswald,system-ui,sans-serif;font-weight:600;font-size:76px;line-height:.82;
  letter-spacing:-.02em;padding:.08em .04em .2em 0;margin:-.08em 0 -.2em 0;
  background:linear-gradient(to top,var(--g1) 0,var(--g1) var(--fill),var(--g2) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
#party .days{display:block;font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;
  color:var(--muted);margin-top:10px}
#party h2{font-size:21px;font-weight:800;letter-spacing:-.02em;margin-top:16px}
#party p{color:var(--muted);font-weight:600;font-size:14.5px;line-height:1.45;margin-top:8px}
#party button{width:100%;margin-top:22px;padding:14px;background:var(--mk);color:var(--onmk);
  font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
#party button.share{margin-top:9px;background:none;color:var(--mkt);border:1px solid var(--line)}

/* the splash while the first load runs, and the banner when it fails */
.splash{display:flex;flex-direction:column;align-items:center;gap:18px;padding-top:28vh;color:var(--muted)}
.splash svg{width:64px;height:64px;border-radius:16px}
.splash i{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--mk);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.splash i{animation-duration:2.4s}}
#err{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));max-width:576px;margin:0 auto;z-index:30;display:flex;gap:12px;align-items:center;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:0;padding:12px 14px;box-shadow:0 12px 30px -10px rgba(0,0,0,.35);font-size:13px;font-weight:600;line-height:1.35}
#err[hidden]{display:none}
#err span{flex:1;min-width:0}
#err button{flex:none;background:var(--soft);color:var(--mkt);padding:7px 12px;font-size:13px}
#err button[hidden]{display:none}
/* There was no way to put this bar away. Something that had already been read, or that
   there was nothing to be done about, stayed across the bottom of a working app until the
   next successful load — which for a fault that repeats is forever. */
#err .dis{background:none;color:var(--muted);padding:7px 4px;font-size:15px;line-height:1}
/* A line down from the top for somebody who is already here. Not a notification: it lives
   in the app, it goes away on its own, and the whole card is the way to the thing. */
#drop{position:fixed;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top));max-width:580px;margin:0 auto;
  z-index:40;display:flex;align-items:center;gap:0;background:var(--text);color:var(--bg);
  box-shadow:0 16px 40px -12px rgba(0,0,0,.55);animation:dropin .26s cubic-bezier(.2,.7,.2,1)}
#drop[hidden]{display:none}
@keyframes dropin{from{opacity:0;transform:translateY(-14px)}}
#drop .dropcard{flex:1;min-width:0;display:flex;align-items:center;gap:11px;padding:11px 4px 11px 12px;
  background:none;color:inherit;text-align:left;border-radius:0}
#drop .av{background:var(--bg);color:var(--text)}
#drop .gr{flex:1;min-width:0}
#drop b{display:block;font-size:13.5px;font-weight:800}
#drop .gr span{display:block;font-size:12.5px;opacity:.72;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#drop .x{flex:none;background:none;color:inherit;opacity:.55;font-size:15px;padding:12px 12px}
/* iOS Safari has no install prompt, so this explains Add to Home Screen once */
#a2hs{position:fixed;top:calc(10px + env(safe-area-inset-top));left:12px;right:12px;max-width:576px;margin:0 auto;z-index:20;display:flex;gap:12px;align-items:center;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:0;padding:12px 14px;box-shadow:0 12px 30px -10px rgba(0,0,0,.35)}
#a2hs[hidden]{display:none}
#a2hs .share{width:26px;height:26px;flex:none;stroke:var(--mkt);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#a2hs p{flex:1;min-width:0;font-size:13px;line-height:1.35}
#a2hs b{display:block;font-size:14px}
#a2hs span{color:var(--muted);font-weight:600}
#a2hs button{background:none;color:var(--muted);padding:4px 6px;font-size:15px;flex:none}
</style>
</head>

// Proof somebody put on a story, fetched as itself. The feed carries the last two hundred
// posts in groups this account is in, and a story can point at neither — somebody's own
// older post, or one in a group shared with them but not with you. Asked for only when a
// story on screen actually points at one, so the ordinary load is unchanged.
//
// What comes back is whatever the policy allows, which for a shared post is everyone who
// can see the story, so in practice all of them. One that is missing draws as a card
// saying the post has gone rather than as a hole.
async function storyPosts() {
  const want = [...new Set(S.stories.map(x => (x.style || {}).post)
    .filter(id => Number.isFinite(+id) && +id > 0).map(Number))]
    .filter(id => !S.posts.some(p => p.id === id));
  if (!want.length) { S.spost = {}; return; }
  try {
    const rows = await q(sb.from('posts').select('*').in('id', want));
    const list = (rows || []).map(p => ({id: p.id, groupId: p.group_id, userId: p.user_id, metric: p.metric,
      amount: p.amount, caption: p.caption, path: p.video_path, day: p.day, ts: Date.parse(p.created_at),
      challenge: p.challenge, spinId: p.spin_id, onProfile: !!p.on_profile}));
    if (list.length) {
      const urls = await q(sb.storage.from('proof').createSignedUrls(list.map(x => x.path), 3600));
      urls.forEach((u, i) => { list[i].url = u.signedUrl; });
    }
    S.spost = Object.fromEntries(list.map(p => [p.id, p]));
  } catch (e) { S.spost = {}; }            // a card that says the post has gone beats no stories at all
}

// The spin-day reminder has to go out in the morning, and the server has no idea when
// that is for anyone. This is the only place that knows. Written once, and again if
// someone travels; a failure here costs a reminder at the wrong hour, nothing more.
async function keepTz() {
  let tz = '';
  try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) {}
  if (!tz || tz === S.me.tz) return;
  try { await sb.from('profiles').update({tz}).eq('id', S.me.id); S.me.tz = tz; } catch (e) {}
}

// ---- loading, and what to do when it fails
// render() used to run only at the end of a successful fetch, so anything that went
// wrong left an empty page behind: an alert saying "JWT expired" and then nothing.
// Now every path ends in a render, and the page paints before the first fetch even starts.
// What went wrong is worth keeping whole. The bar has room for a sentence, but the thing
// that makes a fault like this findable is the stack and the build it happened on, and a
// phone has no console to read them off. So the full text is kept and can be copied out.
let lastErr = '';
// Safari says "Load failed" and Chrome says "Failed to fetch" when a request never
// reached anything. Neither means a thing to somebody holding a phone, and both look
// like a fault in the app rather than in the way there.
const plainly = m => !m ? 'something went wrong'
  : /load failed|failed to fetch|networkerror|network request failed/i.test(m)
    ? 'could not reach the server. Check your connection and try again.' : m;

// A load that failed keeps its bar up: there is a Retry on it and the app is showing
// whatever it had before until that is pressed. A report of something that already went
// wrong is a different thing — there is nothing to press and nothing to retry — so it says
// its piece and goes, rather than sitting over a working app until the next successful
// load, which for a fault that repeats on every load is never.
let errTimer = null;
const SOFT_MS = 9000;
const showErr = (msg, detail, soft) => {
  const e = $('#err');
  lastErr = `${msg}\n\n${detail || ''}\n${BUILD} · ${navigator.userAgent}`.trim();
  e.querySelector('span').textContent = msg;
  e.querySelector('.rty').hidden = !!soft;
  e.hidden = false;
  clearTimeout(errTimer);
  if (soft) errTimer = setTimeout(hideErr, SOFT_MS);
};
const hideErr = () => { clearTimeout(errTimer); $('#err').hidden = true; };
// A clip swapped out while it was starting rejects with AbortError; a browser that will
// not play one unprompted rejects with NotAllowedError; a request dropped because the
// screen it belonged to has gone rejects with nothing worth reading. None of the three is
// a fault anybody can act on, and all three used to put a bar across a working app.
const noise = r => !r || r.name === 'AbortError' || r.name === 'NotAllowedError'
  || (typeof r === 'object' && !r.message && !r.stack);
async function copyErr(btn) {
  const was = btn.textContent;
  try { await navigator.clipboard.writeText(lastErr); btn.textContent = 'Copied'; }
  catch (e) { alert(lastErr); return; }                  // no clipboard: at least show it
  setTimeout(() => { btn.textContent = was; }, 1500);
}
// An access token that went stale while the app was closed is the ordinary case for an
// installed app: it can sit suspended for days. Worth one forced refresh before giving up.
const authErr = e => e && (e.status === 401 || e.code === 'PGRST301' || /jwt|token|not authenticated|unauthorized/i.test(e.message || ''));

let inFlight = null, lastLoad = 0, pushKnown = false;
function load() { return inFlight || (inFlight = runLoad().finally(() => { inFlight = null; lastLoad = Date.now(); })); }

async function runLoad() {
  quiet++;
  try {
    try { await fetchAll(); }
    catch (e) {
      if (!authErr(e)) throw e;
      const {data, error} = await sb.auth.refreshSession();
      if (error || !data.session) { S.me = null; S.open = null; S.auth = 'welcome'; hideErr(); return; } // signed out for real, not just stale
      await fetchAll();
    }
    hideErr();
  } catch (e) {
    showErr(navigator.onLine ? `Could not load: ${plainly(e.message)}` : 'You are offline. Showing what was already here.', e && e.stack);
  } finally {
    quiet--; S.booting = false; render();
    // Whether notifications are on is only known by asking the browser, and until it has
    // been asked the feed cannot tell whether to offer them. Once per launch is enough.
    if (!pushKnown && me()) { pushKnown = true; refreshPush().then(render).catch(() => {}); }
    if (me()) goLive(); else dropLive();
    if (me() && location.hash) goToHash();
  }
}
// Which screen this is, as markup, without putting it anywhere. render() uses it to draw,
// and a swipe uses it to build the screen you are dragging towards before you have
// committed to going there — which is the whole reason it is a function of its own.
// The order is the order render() draws in, and the two must not drift.
function screenHTML() {
  const m = me();
  if (S.legal) return legalView(S.legal);
  // Until the first load lands we do not know whether there is a session, and guessing
  // means flashing the sign-in screen at someone who is already signed in.
  if (!m) return S.booting ? splashView() : S.auth === 'welcome' ? welcomeView() : S.auth === 'reset' ? resetView() : authView(S.auth);
  if (needsTerms(m)) return acceptView();
  const g = S.open && S.groups.find(x => x.id === S.open && x.members.includes(m.id));
  return S.chat ? (S.chat === 'list' ? chatsView() : chatView(S.chat))
    : S.flag ? (S.flag === 'all' ? flagsView() : flagView(S.flag))
    : S.settings ? settingsView()
    : S.who ? personView(S.who)
    : g ? groupView(g)
    : {feed: feedView, groups: groupsView, friends: friendsView, profile: profileView}[S.tab]();
}

// Swap a container's contents without throwing away what was alive in it. A rebuild used
// to take a playing clip with it: a like or a reply swapped the <video> for a fresh one
// that had not decoded a frame, and the post went black. The reels already on screen are
// kept and put back, along with anything half-typed into a reply box and any emoji tray
// left open. The screen and the single-post layer both need this, which is why it is a
// function rather than the middle of render().
function redraw(sel, html) {
  const box = $(sel); if (!box) return;
  const at = s => [...document.querySelectorAll(`${sel} .post[data-post] ${s}`)];
  const keep = new Map(at('.reel').map(r => [r.parentNode.dataset.post, r]));
  const typed = new Map(at('.cin input').filter(i => i.value).map(i => [i.closest('.post').dataset.post, i.value]));
  const trays = at('.emoji:not([hidden])').map(t => t.closest('.post').dataset.post);
  // The chat composer is not attached to a post, so the preserving above walks straight
  // past it — and a conversation redraws itself every few seconds while it is open, which
  // is the one screen where a redraw is most likely to land mid-sentence.
  const cin = box.querySelector('.csend input');
  const said = cin ? cin.value : '';
  const caret = cin ? cin.selectionStart : 0;
  const typing = cin && document.activeElement === cin;
  const cTray = !!box.querySelector('.cemoji:not([hidden])');
  box.innerHTML = html;
  at('.reel').forEach(r => {
    const old = keep.get(r.parentNode.dataset.post); if (!old) return;
    const np = r.querySelector('.proof'), op = old.querySelector('.proof');
    if (!np || !op || np.tagName !== op.tagName) return;          // a different thing now: take the new one
    if (np.dataset.src) op.dataset.src = np.dataset.src;         // a reload re-signs every URL; the old one is still good for an hour
    const nr = r.querySelector('.reacts'), or = old.querySelector('.reacts');   // the one other thing on a reel that changes
    if (or) or.remove(); if (nr) old.appendChild(nr);
    r.replaceWith(old);
  });
  typed.forEach((v, id) => { const i = document.querySelector(`${sel} .post[data-post="${id}"] .cin input`); if (i) i.value = v; });
  trays.forEach(id => { const t = document.querySelector(`${sel} .post[data-post="${id}"] .emoji`); if (t) t.hidden = false; });
  const back = box.querySelector('.csend input');
  if (back && said) {
    back.value = said;
    // Focus back where it was, or the keyboard slides away under somebody mid-word.
    if (typing) { back.focus(); try { back.setSelectionRange(caret, caret); } catch (e) {} }
  }
  if (cTray) { const t = box.querySelector('.cemoji'); if (t) t.hidden = false; }
}

function render() {
  const m = me();
  // One number decides the green everywhere: the best run going across your groups. Set on
  // the root so the tokens, the figure in the header and the arc in the mark all agree.
  document.documentElement.dataset.stage = String(stageOf(myStreak()));
  // A document being read, and an account that has agreed to none of them, are both
  // whole-screen states: there is no tab bar over either, signed in or not.
  const held = !m || !!S.legal || needsTerms(m);
  // A conversation is a screen of its own, the way it is in every app that has one. The tab
  // bar would sit under the box you type in, and worse: the box is pinned to the bottom, so
  // it moved whenever the keyboard class flipped — including between the press and the
  // release of a tap on Send, which is a tap the browser then never reports as a click at
  // all. Putting the bar away lets the box sit still.
  const inChat = !!m && !!S.chat && S.chat !== 'list';
  $('#bar').hidden = held;
  $('#bar').classList.toggle('away', inChat);   // a fade, not a pop, over the screen coming in
  $('#app').classList.toggle('chatting', inChat);
  $('#app').classList.toggle('out', held);
  if (held) return $('#app').innerHTML = screenHTML();
  // Still needed down at the tab bar, which offers the + for whichever group you are in.
  const g = S.open && S.groups.find(x => x.id === S.open && x.members.includes(m.id));
  if (S.open && !g) S.open = null;
  // One screen that cannot be drawn must not take the app with it. This runs inside
  // runLoad's finally, so a throw here escapes the load entirely and leaves whatever was
  // on screen — the splash, on a cold start — with a Retry that fails the same way.
  try {
    redraw('#app', screenHTML());
    // A post opened on its own sits in its own layer, so a redraw of the screen behind it
    // left it as it was: a reply written there did not appear until it was closed and
    // opened again, and a like counted up everywhere except in front of you.
    if (S.one != null) { const p = postById(S.one); p ? redraw('#onewrap', feed([p], true)) : closePost(); }
  // After the screen is drawn, not before: the celebration sits over whatever you were
  // looking at. Cheap enough to ask on every render, and it answers once.
  const mile = milestoneDue();
  if (mile && $('#party').hidden) party(mile);
  } catch (e) {
    console.error(e);
    showErr(`This screen could not be drawn: ${e.message}`, e.stack);
    $('#app').innerHTML = `<div class="card empty"><b>Something here is not right</b><p class="muted">${esc(e.message)}</p>
      <p class="muted">The other tabs still work.</p></div>`;
  }
  const ico = {feed: '<path d="M4 6h16M4 12h16M4 18h10"/>', groups: '<circle cx="9" cy="8" r="3.5"/><circle cx="17" cy="9" r="2.5"/><path d="M3 19c0-3.3 2.7-5 6-5s6 1.7 6 5M15 15c2.8 0 5 1.3 5 4"/>', friends: '<circle cx="10" cy="8" r="3.5"/><path d="M4 19c0-3.3 2.7-5 6-5s6 1.7 6 5M19 8v6M16 11h6"/>', profile: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/>'};
  const tab = (t, l) => `<button data-tab="${t}" onclick="go('${t}')"><svg viewBox="0 0 24 24">${ico[t]}</svg>${l}</button>`;
  watchClips();
  keepClocks();
  // A conversation is read from the bottom, and jumping there is right exactly when it has
  // just been opened or something new has landed — not on every redraw, which would yank
  // you back down while you were reading up.
  if (S.chat && S.chat !== 'list') {
    const sig = `${S.chat}:${msgsIn(S.chat).length}`;
    if (sig !== chatAt) { chatAt = sig; chatToEnd(); markChatRead(S.chat); }
  } else chatAt = '';
  keepChatFresh();
  // The bar is only rebuilt when its markup changes; which tab is on is a class and the
  // underline's position, so the underline can slide rather than be redrawn.
  const bar = $('#bar'), html = tab('feed', 'Feed') + tab('groups', 'Groups') + `<button class="add" onclick="submitDlg(${g ? g.id : 0})" title="Submit proof" ${myGroups().length ? '' : 'disabled'}><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>` + tab('friends', 'Friends') + tab('profile', 'Profile');
  if (bar.dataset.html !== html) { bar.innerHTML = html + '<i class="ind"></i>'; bar.dataset.html = html; }
  bar.querySelectorAll('button[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === S.tab && !S.open && !S.who && !S.settings));
  const on = bar.querySelector('button.on'), ind = bar.querySelector('.ind');
  ind.style.setProperty('--o', on ? 1 : 0);
  if (on) ind.style.setProperty('--x', (on.offsetLeft + on.offsetWidth / 2 - 11) + 'px');
}

// ---- words that do not go on Quota
// filter:start  (test/language.test.mjs lifts everything down to filter:end and runs it)
//
// One list, checked in one place. Every form on the page goes through the submit guard at
// the bottom of this file, in the capture phase, so it runs before the form's own
// onsubmit and nothing is sent and nothing is written. The story editor is the only text
// box that is not in a form, and postStory() calls the same check itself. Adding a screen
// does not mean remembering to add a check to it.
//
// Two ways of matching, because one rule cannot serve both. ANY words are looked for
// anywhere inside what was typed, so fuckyou123 is caught as a username; every word in
// those lists is a string no ordinary English word contains. WORD words are only matched
// whole, because each one sits inside something innocent: raccoon, analysis, suspicion,
// peacock, pussycat, flame retardant, Pakistan. NOTBAD, below, covers the other direction.
const BAD = {
  slur: {
    any: ['nigger', 'nigga', 'niglet', 'faggot', 'kike', 'chingchong', 'tranny', 'shemale',
      'ladyboy', 'wetback', 'towelhead', 'raghead', 'beaner', 'jigaboo', 'porchmonkey',
      'mudslime', 'darkie', 'poofter', 'mongoloid', 'midget', 'retarded', 'hitler', 'nazi'],
    word: ['coon', 'spic', 'chink', 'gook', 'wop', 'dago', 'paki', 'jap', 'homo', 'fag',
      'fags', 'dyke', 'tard', 'spaz', 'spastic', 'poof'],
  },
  sexual: {
    any: ['blowjob', 'handjob', 'dildo', 'cumshot', 'deepthroat', 'bukkake', 'creampie',
      'gangbang', 'hentai', 'porn', 'whore', 'slut', 'milf', 'jizz', 'wank', 'titties',
      'rapist', 'pedophile', 'paedophile', 'pedophilia', 'molest'],
    word: ['pussy', 'cock', 'dick', 'tits', 'anal', 'boner', 'rape', 'cum', 'pedo'],
  },
  swear: {
    any: ['fuck', 'shit', 'cunt', 'bitch', 'asshole', 'arsehole', 'twat', 'bastard',
      'bollocks', 'bellend', 'douchebag', 'dumbass', 'dickhead', 'cocksucker'],
    word: ['prick'],
  },
};
// Why it was stopped. A refusal that does not say which rule it is cannot be argued with,
// and half of these are words somebody typed without thinking.
const BADWHY = {
  slur: 'That is a slur. There is no context on Quota where it is all right.',
  sexual: 'That is sexually explicit, and none of that goes on Quota.',
  swear: 'That is a swear word. Quota keeps them off posts, comments and names.',
};
const BADANY = Object.entries(BAD).flatMap(([why, t]) => t.any.map(w => [w, why]));
const BADWORD = new Map(Object.entries(BAD).flatMap(([why, t]) => t.word.map(w => [w, why])));
// Accents dropped, invisible characters dropped, the usual number-for-letter swaps undone,
// and a letter held down (fuuuuuck) cut back to one. Three of the same letter or more, not
// two: collapsing every double turns coon into con, and con is a word somebody may mean.
// ponytail: this does not see f.u.c.k or f u c k. Catching those means matching across
// separators, which is where a filter starts eating innocent sentences whole.
const LEET = {'4': 'a', '@': 'a', '8': 'b', '(': 'c', '3': 'e', '6': 'g', '9': 'g',
  '1': 'i', '!': 'i', '|': 'i', '0': 'o', '5': 's', '$': 's', '7': 't', '+': 't'};
// Names that happen to contain one of the ANY words, taken out before anything is looked
// for. There is no rule that tells Scunthorpe apart from what is inside it, so the only
// honest answer is a list, and the list is short.
const NOTBAD = /scunthorpe|shitterton|penistone|clitheroe|cockburn|assington|twatt/g;
const flatten = v => String(v ?? '').toLowerCase()
  .normalize('NFKD').replace(/[\u0300-\u036f\u200b-\u200f\u2060\ufeff]/g, '')
  .replace(/[4@8(3691!|05$7+]/g, c => LEET[c])
  .replace(/(.)\1{2,}/g, '$1')
  .replace(NOTBAD, ' ');
// Every distinct word found, worst first, so what gets quoted back is the slur rather than
// whichever swear happened to come earlier in the sentence.
function badWords(v) {
  const flat = flatten(v), hits = new Map();
  for (const [w, why] of BADANY) if (flat.includes(w)) hits.set(w, why);
  for (const t of flat.split(/[^a-z]+/)) if (BADWORD.has(t)) hits.set(t, BADWORD.get(t));
  const rank = {slur: 0, sexual: 1, swear: 2};
  return [...hits].map(([word, why]) => ({word, why})).sort((a, b) => rank[a.why] - rank[b.why]);
}
// filter:end
// Typed text only. A password is never read here, and neither is a recovery code: its
// alphabet can spell a short word by accident, and being locked out of your own account by
// a coincidence is worse than the word.
const TYPED = 'input:not([type]):not([data-raw]),input[type=text]:not([data-raw]),input[type=search],textarea';
// What was refused, without saying it back. Whoever typed it knows which word it was, and
// quoting it puts the thing the filter exists to keep off the screen onto the screen — in
// an alert, in front of whoever is holding the phone.
function refuse(hits, el) {
  const {why} = hits[0];
  if (el) { el.focus(); try { el.setSelectionRange(0, el.value.length); } catch (e) {} }
  const many = hits.length > 1;
  alert(`Some of the language here cannot go on Quota.\n\n${BADWHY[why]}\n\nTake ${many ? 'those words' : 'that word'} out and the rest goes through.`);
  return false;
}
function clean(f) {
  for (const el of f.querySelectorAll(TYPED)) {
    const hits = badWords(el.value);
    if (hits.length) return refuse(hits, el);
  }
  return true;
}
// Capture, on the document: it runs before the form's own onsubmit, and stopping
// propagation here means that handler is never reached at all.
document.addEventListener('submit', e => {
  if (clean(e.target)) return;
  e.preventDefault();
  e.stopPropagation();
}, true);

// ---- views
const splashView = () => `<div class="splash">${LOGO(true)}<i></i></div>`;
// One wheel inside a group: what you owe or what you got, then what everyone else got.
// Seeing each other's result is the whole point, so it is not tucked away anywhere.
function wheelCard(g, w) {
  const m = me(), c = cycleOf(w), mine = spinOf(w, m.id, c), soon = !running(w);
  const others = g.members.filter(id => id !== m.id).map(id => ({id, sp: spinOf(w, id, c)}));
  const head = `<button class="top" onclick="wheelInfoDlg(${w.id})" title="See what is on this wheel">
      <b>${esc(w.name)}</b><span class="when">${soon ? `starts ${dayLabel(w.starts_on)}`
    : `every ${plural(w.every_days, 'day')} · next ${dayLabel(cycleStart(w, c + 1))}`}</span>
      <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>`
    + (w.breaks_streak ? `<div class="who">Not finishing this breaks your streak.</div>` : '');
  const yours = soon ? '' : !mine
    ? `<div class="row" style="margin-top:10px"><button class="primary grow" onclick="spinDlg(${g.id})">Spin the wheel</button></div>`
    : satOut(mine)
    ? `<div class="got out">Sitting this one out</div><div class="who">Back on ${dayLabel(cycleStart(w, c + 1))}.</div>`
    : mustBorrow(mine) && !mine.challenge_override
    ? `<div class="got">${esc(BORROW)}</div><div class="who">Pick whose you are doing before it can count.</div>
       <div class="row" style="margin-top:10px"><button class="primary grow" onclick="borrowDlg(${mine.id})">Choose whose</button></div>`
    : `<div class="got">${esc(effChallenge(mine))}${mine.challenge_override ? ` <span class="muted" style="font-weight:600">(borrowed)</span>` : ''}</div>${trackRow(g, w, mine)}`;
  const rest = others.length ? `<div class="who">${others.map(o => `${esc(name(user(o.id)))}: ${!o.sp ? 'not spun yet'
    : satOut(o.sp) ? 'sitting out'
    : mustBorrow(o.sp) && !o.sp.challenge_override ? 'picking whose to do'
    : esc(effChallenge(o.sp)) + (challengeDone(g, o.sp) ? ' ✓' : '')}`).join('<br>')}</div>` : '';
  return `<div class="wh${!soon && !mine ? ' due' : ''}">${head}${yours}${rest}</div>`;
}

// How the cycle is going. Nothing to tick any more: a day fills when that day's quota has
// been met with the challenge, which is what posting with the box ticked records.
function trackRow(g, w, sp) {
  const need = requiredDays(w, sp);
  if (!need) return `<div class="who">Nothing to do this time.</div>`;
  const filled = challengeDays(g, sp), days = cycleDays(w, sp.cycle);
  const label = `${filled.length} of ${plural(need, 'day')} done`;
  return `<div class="who">${challengeDone(g, sp) ? `Done — ${label}` : label}</div>
    <div class="ticks">${days.map(d => `<span class="tick${filled.includes(d) ? ' on' : ''}">${
      d === today() ? 'Today' : dayLabel(d).replace(/,.*$/, '')}</span>`).join('')}</div>`;
}

function spinPrompt() {
  const waiting = anyDue();
  if (!waiting.length) return '';
  return waiting.map(g => `<div class="card spinday">
    <b>Today is wheel spin day</b>
    <p class="muted">${esc(dueIn(g).map(w => w.name).join(' and '))} in ${esc(g.name)}. Spin before you post.</p>
    <div class="row" style="margin-top:12px"><button class="primary grow" onclick="spinDlg(${g.id})">Spin the wheel</button></div>
  </div>`).join('');
}

// What everyone owes and what they landed on, for the group page.
// Landing on the borrow slice means choosing whose challenge to take. Only what somebody
// else actually got is on offer, and the database checks the same thing.
function borrowDlg(spinId) {
  const sp = S.spins.find(x => x.id === spinId);
  const w = sp && S.wheels.find(x => x.id === sp.wheel_id);
  if (!w) return;
  const g = S.groups.find(x => x.id === w.group_id);
  const opts = borrowable(g, w, sp);
  dlg(`<h2>Whose are you doing?</h2>

// The line stories are watched in, and the order the row shows them in, which have to be

// then anyone with something you have not seen, then everyone you are already caught up
// with — still in the line, because being able to go back to one you have watched is the
// point of being able to swipe at all.
function storyPeople() {
  const m = me();
  // Everyone you can see, which is both rules at once: your groups and your friends.
  const near = [...new Set([...myGroups().flatMap(g => g.members), ...S.friends])].filter(id => id !== m.id);
  const withOne = near.filter(id => storiesOf(id).length);
  return [...(storiesOf(m.id).length ? [m.id] : []),

// ---- watching one
let storyTimer = null;
function openStory(uid) {
  const all = storiesOf(uid);
  if (!all.length) return;
  // The line is taken once, here, and held for as long as the viewer is open. Working it
  // out again on every step would reshuffle it underneath you: watching somebody moves
  // them out of the unseen half, and the next swipe would land on a stranger.
  let q = storyPeople();
  if (!q.includes(uid)) q = [uid];         // opened from a notification, by somebody no longer in the row
  const from = all.findIndex(x => !S.seen.includes(x.id));
  S.story = {q, p: q.indexOf(uid), uid, i: from < 0 ? 0 : from, at: Date.now()};
  paintStory();
}
function closeStory() { clearTimeout(storyTimer); clearTimeout(holdTimer); holdTimer = null; held = false;
  S.story = null; $('#story').classList.remove('held'); $('#story').hidden = true; $('#story').innerHTML = ''; render(); }
// What is one step along the line, without going there. Off the end of somebody's stories
// is the next person's, off the front is the one before's last, and off either end of the
// line there is nothing. Asking rather than doing is what lets a swipe put the answer on
// screen beside the story you are still holding.
// What one step along the line is, without going there. `cross` asks for the next *person*
// rather than the next story, which is what a swipe means: in a story viewer a tap walks
// through what somebody posted and a sideways drag leaves them for the next one, and the
// rest of theirs is not something you drag past one at a time.
function neighbour(d, cross) {

  if (!cross && i >= 0 && i < all.length) return {uid: s.uid, all, i};
  for (let p = s.p + d; p >= 0 && p < s.q.length; p += d) {
    const next = storiesOf(s.q[p]);
    if (!next.length) continue;            // theirs ran out of the day while you were watching
    // Forward lands on the first you have not seen, the same rule as opening somebody from
    // the row. Back lands on their last, because that is the one you swiped away from.
    const un = next.findIndex(x => !S.seen.includes(x.id));

// One step along the line, whether it was tapped, swiped, or the clock ran out. The one you
// are heading for is built beside the one you are on and the pair of them move across —
// the same move a finger makes, so tapping and swiping look like the same thing because
// they are. Only when there is nothing to move — no strip yet, or motion turned off — does
// it go straight to the far side.
//
// A step already in flight is left alone. The strip being armed is what says so, and a
// second step during those 320ms would land on the wrong story.
// The slide is what leaving one person for the next looks like, and it is only ever that.
// Another of the same person's is not a journey: the bar moves on, the picture changes, and

// Drag a thing about the card. A press that does not move is a tap, and a tap on the words
// puts the caret in them; a press that moves takes the block with it and remembers where it
// was let go. While the words have the caret, pointer events are theirs to place it.
function dragify(el, set, onTap) {
  let sx = 0, sy = 0, ox = 0, oy = 0, moved = false, live = false;
  el.addEventListener('pointerdown', e => {
    if (el.isContentEditable && document.activeElement === el) return;
    live = true; moved = false; sx = e.clientX; sy = e.clientY;
    const r = el.getBoundingClientRect(); ox = r.left + r.width / 2; oy = r.top + r.height / 2;
    try { el.setPointerCapture(e.pointerId); } catch (x) {}
    e.preventDefault();
  });
  el.addEventListener('pointermove', e => {
    if (!live) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (!moved && Math.hypot(dx, dy) < 6) return;
    moved = true;
    const st = el.closest('.face').getBoundingClientRect();
    el.style.left = `${((ox + dx - st.left) / st.width) * 100}%`;
    el.style.top = `${((oy + dy - st.top) / st.height) * 100}%`;
  });
  const done = e => {
    if (!live) return; live = false;
    if (!moved) return onTap();
    const st = el.closest('.face').getBoundingClientRect();
    const x = Math.min(.95, Math.max(.05, (e.clientX - sx + ox - st.left) / st.width));
    const yy = Math.min(.95, Math.max(.05, (e.clientY - sy + oy - st.top) / st.height));
    set(+x.toFixed(3), +yy.toFixed(3));
  };
  el.addEventListener('pointerup', done);
  el.addEventListener('pointercancel', done);
}

// A story is small and already the right size, so it goes up as it is.
async function postStory() {
  const d = S.draft, m = me();
  if (!d) return;
  // The editor is a contenteditable, not a form, so the submit guard never sees it.
  const bad = badWords(d.body || '');
  if (bad.length) return refuse(bad, null);
  const go = $('#make .go');
  if (go) { go.disabled = true; go.textContent = d.editing ? 'Saving…' : 'Sharing…'; }
  try {
    // Editing one that is already up: the words and the look go back to the row it came
    // from, and the file it points at is left exactly where it is.
    if (d.editing) {
      await q(sb.from('stories').update({body: d.body || null, style: styleOf(d)}).eq('id', d.editing));
      closeDraft();
      await load();
      return;
    }
    let path = null;
    if (d.file) {
      path = `${m.id}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${(d.file.name || '').split('.').pop() || (d.kind === 'photo' ? 'jpg' : 'mp4')}`;
      const {error} = await sb.storage.from('stories').upload(path, d.file, {contentType: d.file.type || undefined});
      if (error) throw error;
    }
    await q(sb.from('stories').insert({user_id: m.id, kind: d.kind, media_path: path,
      body: d.body || null, style: styleOf(d)}));
  } catch (e) {
    if (go) { go.disabled = false; go.textContent = d.editing ? 'Save' : 'Share'; }
    return showErr(d.editing ? 'That change did not save.' : 'That story did not go up.', String(e && e.message || e));
  }
  closeDraft();
  await load();
}

function suggest(kind, data) {

}

// Shut by default and one line tall. The streak is what the top of this screen is for;

function activityBox() {
  const m = me(), mine = new Set(S.posts.filter(p => p.userId === m.id).map(p => p.id));
  const ev = [];
  for (const p of S.posts) if (p.userId !== m.id) ev.push({t: p.ts, u: p.userId, what: `posted ${effort(p)}`});
  for (const c of S.comments) if (c.userId !== m.id)
    ev.push({t: c.ts, u: c.userId, what: mine.has(c.postId) ? 'commented on your proof' : 'left a comment'});

  // Today, and only today. Yesterday's is not news, and a row with no time on it cannot

  const list = ev.filter(e => Number.isFinite(e.t) && S.profiles[e.u] && ymd(new Date(e.t)) === today())

// bare is the flag screen: the post, and nothing you do to a post. What is being asked

function feed(ps, showGroup, bare) {

    const h = p.day !== day ? `<p class="muted" style="margin:14px 18px 0">${dayLabel(p.day)}</p>` : ''; day = p.day;

        : `<video class="proof" playsinline preload="metadata"${p.url ? ` data-src="${esc(p.url)}"` : ''} onclick="playClip(this,${p.id})" onerror="clipBust(this,${p.id})" onplay="clipState(this,'play')" onpause="clipState(this,'pause')" onended="clipState(this,'end')" ontimeupdate="clipTime(this)"></video>`}

      <button type="button" class="sound" onclick="clipSound(this)" aria-label="Sound"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="w" d="M16 9a4 4 0 0 1 0 6"/><path class="m" d="M4 4l16 16"/></svg></button>
      <div class="prg"><b></b></div>`}

// A signed URL lasts an hour and every post gets one at load, so a feed left open long
// enough, or a post whose file could not be signed at all, ends up pointing at nothing.
// Either way the player shows a black rectangle and a play button that does nothing,
// which is indistinguishable from a clip that is just slow to arrive. So a failure
// quietly asks for a fresh URL and tries once more, and only says so if that fails too.
// A phone will only keep a handful of <video> elements loaded at once — past that they
// come up black and will not start, which is why it is the ones further down a long feed
// that "sometimes don't work". So a clip is only given its source while it is near the
// screen, and gives it back once it is well past and not playing.
let clipObs = null;
const attachClip = v => {
  delete v.dataset.idle;
  if (v.getAttribute('src') || !v.dataset.src) return;
  v.src = v.dataset.src;
  // preload="metadata" fetches the header and stops, and a video element that has never
  // decoded a frame paints nothing — which is the black rectangle where the first frame
  // of somebody's clip should be. Nudging off zero makes it decode one and show it.
  if (v.tagName === 'VIDEO') v.addEventListener('loadedmetadata', () => {
    try { if (v.currentTime < 0.05) v.currentTime = 0.05; } catch (e) {}
  }, {once: true});
};
function releaseClip(v) {
  if (!v.getAttribute('src') || (v.tagName === 'VIDEO' && !v.paused)) return;
  v.dataset.idle = '1';                    // so letting go is not mistaken for a failure
  v.removeAttribute('src');
  // Only a <video> has load(). Proof is a clip or a picture, and a picture is an <img>,
  // which does not — so scrolling a photo post off the screen threw, and threw again on
  // every scroll after it, which is what put a bar across the bottom of the app that
  // nothing would clear. Everywhere else that calls load() already asks first.
  if (v.tagName === 'VIDEO') v.load();
}
// #app is the screen, and #one is the single post that opens over it. Both, and nothing
// else: a screen on its way out lives in #ghost for the length of a transition, and
// loading video for a picture nobody will see again is what scoping this to #app fixed.
// Leaving #one out went the other way — the clip you had just tapped through to was the
// one element on the page that never got its source, so it sat there black.
const CLIPS = '#app .reel .proof, #app .tile .proof, #one .reel .proof';
function watchClips() {
  if (clipObs) clipObs.disconnect();
  const vs = [...document.querySelectorAll(CLIPS)];
  // Without an observer there is no way to tell what is on screen, so load them all and
  // accept the old behaviour rather than showing nothing.
  if (!self.IntersectionObserver) return vs.forEach(attachClip);
  // A hidden element reports as off screen too — a clip whose reel is showing a failure,
  // say. That is not "scrolled away", and taking its source back gains nothing, so only
  // something with a box of its own is let go.
  clipObs = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) attachClip(e.target);
    else if (e.boundingClientRect.width) releaseClip(e.target);
  }), {rootMargin: '150% 0px'});
  vs.forEach(v => clipObs.observe(v));
}

// The phone's own keyboard has an emoji key, and this does not replace it — it is there
// for the same reason every chat box has one: reaching emoji without leaving the field.
const EMOJI = ['🔥', '💪', '👏', '😤', '😂', '😮', '🥵', '🫡', '🙌', '❤️', '🏆', '🐐',
  '👀', '😭', '💀', '🤝', '⚡', '✅', '🧊', '🚀'];
// One tray per post now that every post carries its own box to type in, so both of these
// work off the post they were tapped in rather than the only one on the page. Found by
// which post it is rather than by walking up from the button: a tap that lands as the
// screen is being redrawn is holding a button whose branch has already been replaced, and
// walking up from that reaches the copy that was thrown away — the emoji went into a box
// nobody could see.
const postPart = (el, sel) => {
  const id = el.closest('.post')?.dataset.post;
  return id ? document.querySelector(`.post[data-post="${id}"] ${sel}`) : el.closest('.cmts')?.querySelector(sel);
};
function toggleEmoji(btn) {
  const box = postPart(btn, '.emoji');
  if (box) box.hidden = !box.hidden;
}
function putEmoji(btn, e) {
  const input = postPart(btn, '.cin input');
  if (!input) return;
  const at = input.selectionStart ?? input.value.length;
  input.value = input.value.slice(0, at) + e + input.value.slice(input.selectionEnd ?? at);
  input.focus();
  const to = at + e.length;
  try { input.setSelectionRange(to, to); } catch (err) {}
}

// Where a post lives depends on where you came at it from. The feed carries the last two
// hundred; a profile grid is fetched on its own and reaches posts in groups this account
// is not in at all, and further back than the feed goes. Anything that takes a post id
// has to look in both, or it works in the feed and quietly fails everywhere else — which
// is what left a clip on somebody's profile with a play button that did nothing.
const postById = id => S.posts.find(x => x.id === id)
  || Object.values(S.pro).flatMap(x => x.posts || []).find(x => x.id === id)
  || S.spost[id];

const reelOf = v => v.closest('.reel');
function bustMsg(v, msg) {
  const reel = reelOf(v);
  if (!reel) return;
  reel.querySelector('.bust p').textContent = msg;
  reel.classList.add('bust');
  reel.classList.remove('playing');
}
async function freshUrl(postId) {
  const p = postById(postId);
  if (!p || !p.path) return '';
  const {data, error} = await sb.storage.from('proof').createSignedUrl(p.path, 3600);
  if (error || !data || !data.signedUrl) return '';
  p.url = data.signedUrl;
  return p.url;                            // the element's data-src is refreshed by whoever asked
}
async function clipBust(v, postId, play) {
  if (v.dataset.idle) return;              // we took its source away on purpose
  // Code 4 is the browser saying it cannot decode this at all. A newer URL will not help
  // — the clip was recorded in something this device has no decoder for.
  if (v.error && v.error.code === 4) return bustMsg(v, 'This clip is in a format this device cannot play.');
  const what = v.tagName === 'IMG' ? 'picture' : 'clip';
  if (v.dataset.retried) return bustMsg(v, `This ${what} could not be loaded.`);
  v.dataset.retried = '1';
  const url = await freshUrl(postId);
  if (!url) return bustMsg(v, `This ${what} could not be loaded.`);
  v.dataset.src = url;
  v.src = url;
  if (v.tagName === 'VIDEO') { v.load(); if (play) v.play().catch(() => {}); }
}
function playClip(v, postId) {
  attachClip(v);                           // tapped before it came into view: give it back its source
  if (!v.getAttribute('src')) return clipBust(v, postId, true);
  if (!v.paused) return v.pause();
  // play() rejects when the source never arrived, and an unhandled rejection here is the
  // whole bug: the tap does nothing and nothing says why.
  const go = v.play();
  if (go && go.catch) go.catch(() => clipBust(v, postId, true));
}
// The reel wears the player's state. Playing hides the glyph after showing the pause bars
// for a moment; paused brings the play triangle straight back; ended rewinds the line.
function clipState(v, st) {
  const reel = reelOf(v); if (!reel) return;
  reel.classList.toggle('playing', st === 'play');
  clearTimeout(reel._flash);
  if (st === 'play') { reel.classList.add('started', 'flash'); reel._flash = setTimeout(() => reel.classList.remove('flash'), 700); }
  else reel.classList.remove('flash');
  if (st === 'end') { reel.classList.remove('started'); const b = reel.querySelector('.prg b'); if (b) b.style.width = '0'; }
}
function clipTime(v) {
  const b = reelOf(v)?.querySelector('.prg b');
  if (b && v.duration) b.style.width = (v.currentTime / v.duration * 100) + '%';
}
function clipSound(btn) {
  const v = reelOf(btn).querySelector('video'); if (!v) return;
  v.muted = !v.muted; btn.classList.toggle('off', v.muted);
}
function retryClip(btn, postId) {
  const reel = btn.closest('.reel'), v = reel.querySelector('.proof');
  reel.classList.remove('bust');
  delete v.dataset.retried;
  clipBust(v, postId, true);
}

// Down the right-hand side, where every app that shows a reel puts them. Over the clip
// rather than under it, so the picture keeps the whole card.
const likesOn = id => S.likes.filter(l => l.p === id);
const iLike = id => S.likes.some(l => l.p === id && l.u === me().id);
// Under the clip rather than down the side of it, and directly above what people said,
// so liking a post and replying to it are the same gesture in the same place.
// The count sits beside its icon always, zero included: a blank space where a number goes
// reads as something still loading, and you cannot tell a post nobody liked from one
// whose likes have not arrived.
function acts(p, comments) {
  const n = likesOn(p.id).length, mine = iLike(p.id);
  return `<div class="acts">
    <button type="button" class="lk${mine ? ' on' : ''}" onclick="toggleLike(${p.id})" aria-label="${mine ? 'Unlike' : 'Like'}, ${plural(n, 'like')}">
      <svg viewBox="0 0 24 24"><path d="M12 20.5 4.2 13a4.8 4.8 0 0 1 6.8-6.8l1 1 1-1A4.8 4.8 0 0 1 19.8 13z"/></svg>
      <b class="n">${num(n)}</b>
    </button>
    <button type="button" class="react" onclick="pickReact(event,${p.id})" aria-label="React">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 10h.01M15 10h.01M8.5 14.5a4.5 4.5 0 0 0 7 0"/></svg>
    </button>
    ${flagButton(p)}
    <span class="cc">${num(comments)} ${comments === 1 ? 'comment' : 'comments'}</span>
  </div>${flagStrip(p)}`;
}
// Top right of the feed, where every app that has one puts it, with what is waiting on it.
// Not there at all until the v28 block has been run.
function chatIcon() {
  const date = `<span class="date">${new Date().toLocaleDateString(undefined, {weekday: 'long', month: 'long', day: 'numeric'})}</span>`;
  if (S.noChat) return date;
  const n = unreadTotal();
  return `<button type="button" class="chatbtn" onclick="openChats()" aria-label="Chats${n ? `, ${n} unread` : ''}">
    <svg viewBox="0 0 24 24"><path d="M20.5 12a8 8 0 0 1-8.5 8 9 9 0 0 1-3.6-.7L4 20.5l1.3-4a8.2 8.2 0 0 1-.8-3.6 8 8 0 0 1 8-8 8 8 0 0 1 8 7.1z"/></svg>
    ${n ? `<i class="num">${num(n)}</i>` : ''}</button>`;
}

// ---- talking to each other
// What the screen was last drawn holding, so a redraw that changes nothing about the
// conversation does not scroll it.
let chatAt = '';
// A chat nobody is watching updates when the app next loads, like everything else. One
// that is open on screen cannot wait fifteen seconds for a reply, so while a thread is up
// it asks more often. ponytail: a poll, until the realtime pass replaces it with a
// subscription — at which point this whole function goes.
let chatPoll = null;
function keepChatFresh() {
  // Off entirely where the subscription is working: the same lines would arrive twice, and
  // the poll exists for exactly the case where they would not arrive at all.
  const want = S.chat && S.chat !== 'list' && !S.noChat && !liveOn;
  if (want && !chatPoll) chatPoll = setInterval(refreshChat, 5000);
  else if (!want && chatPoll) { clearInterval(chatPoll); chatPoll = null; }
}
// Two queries rather than the twenty a whole load runs: a conversation on screen needs the
// messages and what people put on them, and nothing else on the page has changed because
// somebody typed. Redrawn only when something really is different, or a redraw every five
// seconds would take the caret out of the box being typed into.
async function refreshChat() {
  if (document.hidden || S.noChat || !S.chat || S.chat === 'list') return;
  const [rows, rx] = await Promise.all([
    soft(sb.from('messages').select('*').order('created_at', {ascending: false}).limit(400)),
    soft(sb.from('message_reactions').select('message_id,user_id,emoji')),
  ]);
  if (!rows) return;
  const msgs = rows.map(x => ({id: x.id, groupId: x.group_id, a: x.a, b: x.b,
    userId: x.user_id, body: x.body, ts: Date.parse(x.created_at)})).sort((x, y) => x.ts - y.ts);
  const mreacts = (rx || []).map(r => ({m: r.message_id, u: r.user_id, e: r.emoji}));
  const same = msgs.length === S.msgs.length && mreacts.length === S.mreacts.length
    && msgs.every((x, i) => x.id === S.msgs[i].id);
  if (same) return;
  // Anything still in flight keeps its place until the real row arrives.
  const pending = S.msgs.filter(x => x.pending && !msgs.some(y => y.body === x.body && y.userId === x.userId));
  S.msgs = [...msgs, ...pending];
  S.mreacts = mreacts;
  // The lines, and not the screen. render() would rebuild the composer along with
  // everything else, and this runs every five seconds — redraw() puts a half-typed message
  // back, but not rebuilding it at all is better than putting it back.
  const box = $('#msgs');
  if (!box) return render();
  box.innerHTML = chatBody(S.chat);
  chatToEnd();
  markChatRead(S.chat);
}
// A chat is named by a short string rather than by an object, because it is a key: it is
// what a read mark is stored against, what a notification points at, and what the screen
// holds while it is open. 'g:12' is a group's, 'u:<them>' is a private one.
const gKey = id => `g:${id}`;
const uKey = id => `u:${id}`;
const keyOf = m => m.groupId ? gKey(m.groupId) : uKey(m.a === me().id ? m.b : m.a);
const msgsIn = key => S.msgs.filter(m => keyOf(m) === key);
const seenAt = key => (S.reads.find(r => r.k === key) || {ts: 0}).ts;
// Yours are never unread, and neither is anything you had already scrolled past.
const unreadIn = key => msgsIn(key).filter(m => m.userId !== me().id && m.ts > seenAt(key)).length;
const reactsOnMsg = id => S.mreacts.filter(r => r.m === id);
// Every group you are in has one, whether anything has been said in it or not: the chat is
// the group. A private one appears once there is something in it; starting a new one is
// what the Friends tab is for.
function chatRows() {
  const m = me();
  const groups = myGroups().map(g => ({key: gKey(g.id), name: g.name, group: g}));
  const people = [...new Set(S.msgs.filter(x => x.a).map(keyOf))]
    .map(k => ({key: k, name: name(user(k.slice(2))), who: user(k.slice(2))}));
  return [...groups, ...people].map(c => {
    const list = msgsIn(c.key);
    return {...c, last: list[list.length - 1] || null, unread: unreadIn(c.key)};
  }).sort((x, y) => (y.last ? y.last.ts : 0) - (x.last ? x.last.ts : 0));
}
const unreadTotal = () => S.noChat ? 0 : chatRows().reduce((n, c) => n + c.unread, 0);

function openChats() { if (S.noChat) return; S.chat = 'list'; S.settings = false; stackOn(); }
// Back out of a conversation is always the hub, and back out of the hub is wherever you
// were before any of it — a group, Friends, the feed — at the spot you left it. One rule,
// however the conversation was reached.
//
// A thread opened from anywhere but the hub has no hub underneath it to go back to, so one
// is put there: an extra entry on the stack, at the top of the page, above the entry for
// the screen you came from. The first back pops the hub, the second pops the screen. The
// drag-back gesture pops one entry per screen and needs no special case for this.
function openChat(key) {
  if (S.noChat) return;
  const viaHub = S.chat === 'list';
  S.chat = key; S.settings = false;
  stackOn();
  if (!viaHub) backY.push(0);
  markChatRead(key);
}
function closeChat() { S.chat = S.chat !== 'list' ? 'list' : null; stackOff(); }
// Written once when a chat is opened, and again when something lands while it is open —
// which is also what stops a notification for a message you are looking at.
async function markChatRead(key) {
  if (S.noChat || !unreadIn(key)) return;
  const ts = Date.now();
  S.reads = [...S.reads.filter(r => r.k !== key), {k: key, ts}];
  render();
  try { await q(sb.from('chat_reads').upsert({user_id: me().id, chat: key, seen_at: new Date(ts).toISOString()})); }
  catch (e) { /* a read mark that did not save costs a bold row, nothing more */ }
}

function chatsView() {
  const rows = chatRows(), groups = rows.filter(c => c.group), people = rows.filter(c => !c.group);
  const row = c => `<button type="button" class="crow${c.unread ? ' un' : ''}" onclick="openChat('${esc(c.key)}')">
    ${c.group ? gav(c.group) : av(c.who, '')}
    <span class="gr"><b>${esc(c.name)}</b>
      <span>${c.last ? `${c.last.userId === me().id ? 'You: ' : (c.group ? esc(name(user(c.last.userId))) + ': ' : '')}${esc(c.last.body)}`
        : c.group ? 'Nothing said yet' : ''}</span></span>
    <span class="rt">${c.last ? `<em>${esc(ago(c.last.ts))}</em>` : ''}${c.unread ? `<i class="num">${num(c.unread)}</i>` : ''}</span></button>`;
  return `<button type="button" class="backx" onclick="closeChat()" aria-label="Back">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="hdr"><h1>Chats</h1></div>
    ${groups.length ? `<h3>Groups</h3>${groups.map(row).join('')}` : ''}
    ${people.length ? `<h3>People</h3>${people.map(row).join('')}` : ''}
    ${!groups.length && !people.length ? `<div class="card empty"><b>No chats yet</b>
      <p class="muted">Every group you are in has one. Friends gets you a private one.</p></div>` : ''}
    ${people.length ? '' : `<p class="muted pad">To start a private one, open somebody from Friends.</p>`}`;
}

// One conversation. Days are marked because a chat read a day later is otherwise a wall of
// lines with no time in it anywhere.
// Just the lines, so the poll can swap them without touching the box being typed into.
function chatBody(key) {
  const m = me(), isGroup = key.startsWith('g:');
  const list = msgsIn(key);
  if (!list.length) {
    const other = isGroup ? null : user(key.slice(2));
    return `<div class="card empty"><b>Nothing said yet</b><p class="muted">${
      isGroup ? 'Everyone in the group can read this.' : `Only you and ${esc(name(other))}.`}</p></div>`;
  }
  let day = '', lastWho = '';
  return list.map(msg => {
    const mine = msg.userId === m.id;
    const d = ymd(new Date(msg.ts));
    const head = d !== day ? `<div class="cday">${esc(dayLabel(d))}</div>` : '';
    if (d !== day) lastWho = '';
    day = d;
    // Who said it, once per run of theirs, and only in a group: a private chat has two
    // people in it and one of them is you.
    const nameLine = isGroup && !mine && msg.userId !== lastWho
      ? `<div class="cwho">${esc(name(user(msg.userId)))}</div>` : '';
    lastWho = msg.userId;
    const rx = reactsOnMsg(msg.id);
    const grouped = [...new Set(rx.map(r => r.e))].map(e => ({e, n: rx.filter(r => r.e === e).length,
      mine: rx.some(r => r.e === e && r.u === m.id)}));
    // Nothing is hung on a line that has not landed yet: it has no real id to react to or
    // delete by until load() brings the row back.
    return head + nameLine + `<div class="m ${mine ? 'me' : 'them'}${msg.pending ? ' pending' : ''}" data-msg="${msg.id}">
      <button type="button" class="say"${msg.pending ? '' : ` onclick="pickMsgReact(event,${msg.id})"`}>${esc(msg.body)}</button>
      ${grouped.length ? `<div class="mrx">${grouped.map(r => `<button type="button" class="${r.mine ? 'mine' : ''}"
        onclick="toggleMsgReact(${msg.id},'${r.e}')">${r.e}${r.n > 1 ? `<b>${r.n}</b>` : ''}</button>`).join('')}</div>` : ''}
      ${mine && !msg.pending ? `<button type="button" class="drop" onclick="delMessage(${msg.id})" aria-label="Delete">\u2715</button>` : ''}</div>`;
  }).join('');
}

// One conversation. Days are marked because a chat read a day later is otherwise a wall of
// lines with no time in it anywhere.
function chatView(key) {
  const m = me(), isGroup = key.startsWith('g:');
  const g = isGroup && S.groups.find(x => x.id === +key.slice(2) && x.members.includes(m.id));
  const other = isGroup ? null : user(key.slice(2));
  if (isGroup && !g) return chatsView();
  return `<div class="cbar">
      <button type="button" class="backx" onclick="closeChat()" aria-label="Back">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      ${isGroup ? gav(g) : av(other, '')}
      <span class="nm"><b>${esc(isGroup ? g.name : name(other))}</b>
        <span>${isGroup ? `${g.members.length} ${g.members.length === 1 ? 'person' : 'people'}` : '@' + esc(other.username || '')}</span></span>
    </div>
    <div class="msgs" id="msgs">${chatBody(key)}</div>
    <div class="emoji cemoji" hidden>${EMOJI.map(e => `<button type="button" onclick="putChatEmoji(this,'${e}')">${e}</button>`).join('')}</div>
    <form class="csend" onsubmit="event.preventDefault();sendMessage(this,'${esc(key)}')">
      <button type="button" class="emo" onclick="toggleChatEmoji(this)" aria-label="Emoji">${SMILEY}</button>
      <input name="body" placeholder="Message" maxlength="2000" required autocomplete="off">
      <button class="primary">Send</button>
    </form>`;
}

// Shown before the write lands, the way a comment is: a line that waits on a round trip
// reads as a Send that did nothing. It carries no real id until load() brings the row back,
// so it cannot be reacted to or deleted yet.
async function sendMessage(f, key) {
  const body = f.body.value.trim();
  if (!body) return;
  f.body.value = '';                       // before the redraw, the same as a comment
  const m = me(), isGroup = key.startsWith('g:');
  const row = isGroup ? {group_id: +key.slice(2), user_id: m.id, body}
    : {...pairOf(key.slice(2)), user_id: m.id, body};
  const tmp = {id: -Date.now(), groupId: isGroup ? +key.slice(2) : null,
    a: isGroup ? null : row.a, b: isGroup ? null : row.b, userId: m.id, body, ts: Date.now(), pending: true};
  S.msgs = [...S.msgs, tmp];
  render(); chatToEnd();
  try { await q(sb.from('messages').insert(row)); }
  catch (e) {
    S.msgs = S.msgs.filter(x => x !== tmp);
    const back = document.querySelector('#app .csend input');
    if (back) back.value = body;           // it did not send: give them back what they wrote
    render();
    return showErr('That message did not send.', String(e && e.message || e));
  }
  await load(); chatToEnd();
}
// The pair, sorted, which is how the row is stored and how the policy looks it up.
const pairOf = other => { const [a, b] = [me().id, other].sort(); return {a, b}; };
// A conversation is read from the bottom. Twice, because a long one has not finished laying
// itself out when the first one runs — the same reason coming back to a feed does it twice.
function chatToEnd() {
  const box = $('#msgs'); if (!box) return;
  const end = () => { box.scrollTop = box.scrollHeight; };
  end(); requestAnimationFrame(end);
}
// What you answer a message with is not what you answer a post with. A post is somebody's
// proof and the answers are cheers; a line in a conversation is something said, and the
// answers are agreeing with it, not agreeing with it, or laughing. Six, and then everything
// else behind the +, because six is never quite the one you wanted.
const CHAT_REACTS = ['❤️', '👍', '👎', '😂', '😮', '🙏'];
function pickMsgReact(ev, id) {
  ev.stopPropagation();
  const row = ev.currentTarget.closest('.m');
  const had = row.querySelector('.reactpick');
  if (had) return had.remove();
  document.querySelectorAll('#app .m .reactpick').forEach(x => x.remove());
  const box = document.createElement('div');
  box.className = 'reactpick';
  box.innerHTML = msgReactRow(id);
  row.appendChild(box);
}
const msgReactBtn = (id, e) => `<button type="button" onclick="toggleMsgReact(${id},'${e}');this.closest('.reactpick').remove()">${e}</button>`;
const msgReactRow = id => CHAT_REACTS.map(e => msgReactBtn(id, e)).join('')
  + `<button type="button" class="more" onclick="moreMsgReact(event,this,${id})" aria-label="Any other emoji">+</button>`;
// Everything else, in the same tray rather than in a sheet over the conversation: the
// answer you are picking belongs to the line it is hanging off, and a sheet would cover it.
function moreMsgReact(ev, btn, id) {
  // Stopped here like every other opener, and for a sharper reason: the line below replaces
  // this button with the full set, so by the time a listener on the document looked at the
  // click its target would be a node no longer in the page — and "is this inside a tray"
  // has no answer for something that is not in the document at all.
  ev.stopPropagation();
  const box = btn.closest('.reactpick');
  box.classList.add('all');
  box.innerHTML = [...new Set([...CHAT_REACTS, ...EMOJI, ...STICKER_MORE])].map(e => msgReactBtn(id, e)).join('');
}
// Same as reacting to a post: shown at once and put back if the write is refused.
async function toggleMsgReact(id, emoji) {
  const m = me(), had = S.mreacts.some(r => r.m === id && r.u === m.id && r.e === emoji);
  const undo = () => { S.mreacts = had ? [...S.mreacts, {m: id, u: m.id, e: emoji}]
    : S.mreacts.filter(r => !(r.m === id && r.u === m.id && r.e === emoji)); render(); };
  S.mreacts = had ? S.mreacts.filter(r => !(r.m === id && r.u === m.id && r.e === emoji))
    : [...S.mreacts, {m: id, u: m.id, e: emoji}];
  render();
  try {
    if (had) await q(sb.from('message_reactions').delete().eq('message_id', id).eq('user_id', m.id).eq('emoji', emoji));
    else await q(sb.from('message_reactions').insert({message_id: id, user_id: m.id, emoji}));
  } catch (e) { undo(); }
}
async function delMessage(id) {
  if (!confirm('Delete this message?')) return;
  const before = S.msgs;
  S.msgs = S.msgs.filter(x => x.id !== id); render();
  try { await q(sb.from('messages').delete().eq('id', id)); }
  catch (e) { S.msgs = before; render(); return showErr('That did not delete.', String(e && e.message || e)); }
  load();
}
function toggleChatEmoji(btn) {
  const box = $('#app .cemoji'); if (box) box.hidden = !box.hidden;
}
function putChatEmoji(btn, e) {
  const input = $('#app .csend input'); if (!input) return;
  const at = input.selectionStart ?? input.value.length;
  input.value = input.value.slice(0, at) + e + input.value.slice(input.selectionEnd ?? at);
  input.focus();
  const to = at + e.length;
  try { input.setSelectionRange(to, to); } catch (err) {}
}

// ---- the clock on a flag
// A running one, because the whole question is how long is left. Under an hour it drops the
// hours rather than showing a leading zero nobody reads.
const two = n => String(n).padStart(2, '0');
function leftOf(at) {
  const s = Math.max(0, Math.round((at - Date.now()) / 1000));
  if (!s) return 'time up';
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  return h ? `${h}:${two(m)}:${two(s % 60)}` : `${m}:${two(s % 60)}`;
}
// One interval for every clock on the page, started when there is one and stopped the
// moment there is not: a timer running on a screen with no clock on it is a wake-up every
// second for nothing. render() calls this after it draws, so it follows the screen about
// without anything having to remember to switch it off.
let tickTimer = null;
function tickClocks() {
  const els = [...document.querySelectorAll('[data-until]')];
  if (!els.length) { clearInterval(tickTimer); tickTimer = null; return; }
  let out = false;
  els.forEach(el => { const at = +el.dataset.until; el.textContent = leftOf(at); if (at <= Date.now()) out = true; });
  // A clock reaching zero is not the result. The database decides — close_due_flags() runs
  // at the top of every load — so this asks for the answer rather than working one out.
  // Throttled on lastLoad, or a flag the server cannot close would be asked about every
  // second for as long as the screen was open.
  if (out && Date.now() - lastLoad > 5000) load();
}
function keepClocks() {
  if (document.querySelector('[data-until]')) { if (!tickTimer) tickTimer = setInterval(tickClocks, 1000); }
  else if (tickTimer) { clearInterval(tickTimer); tickTimer = null; }
}

// The word filter runs on a submit listener at the document, in the capture phase, so this
// is never reached with a slur in it and nothing here has to remember to check.
async function submitFlag(f, postId) {
  const reason = f.reason.value.trim();
  if (!reason) return;
  working(f, '…');
  try { await q(sb.from('flags').insert({post_id: postId, by_user: me().id, reason})); }
  catch (e) { dlg(); return showErr('That flag did not go up.', String(e && e.message || e)); }
  dlg();
  await load();
  const fl = flagOf(postId);
  if (fl) openFlag(fl.id);                 // straight to the thing you just started
}

// One vote each, and changing it before the result is out is not a second one. Shown first
// and written after, the way a like is: a tap that waits on a round trip reads as a tap
// that did nothing.
async function castVote(fid, yes) {
  const m = me(), had = myVote(fid);
  if (had && had.yes === yes) return;
  const before = S.fvotes;
  S.fvotes = had ? S.fvotes.map(v => v === had ? {...v, yes} : v) : [...S.fvotes, {f: fid, u: m.id, yes}];
  render();
  try {
    if (had) await q(sb.from('flag_votes').update({agree: yes}).eq('flag_id', fid).eq('user_id', m.id));
    else await q(sb.from('flag_votes').insert({flag_id: fid, user_id: m.id, agree: yes}));
  } catch (e) {
    S.fvotes = before; render();
    return showErr('That vote did not go through.', String(e && e.message || e));
  }
  // Everybody having voted ends it early, and that is the database's call, not this one's.
  await load();
}

// What people have left on a post, drifting up the side of it the way likes drift up a
// reel: one emoji per reaction, bare, each on its own slow bob with its own phase so they
// never move in step. Yours are the ones that answer to a tap.
const REACTS = ['🔥', '💪', '👏', '😤', '😂', '🫡'];
const FLOAT_MAX = 10;                      // past this it is a wall, not a feeling
const reactsOn = id => S.reacts.filter(r => r.p === id);
function reactBubbles(id) {
  const all = reactsOn(id).slice(-FLOAT_MAX);
  if (!all.length) return '';
  const m = me().id;
  return `<div class="reacts">${all.map((r, i) => {
    const mine = r.u === m;
    // A little sideways scatter, deterministic per slot so a re-render does not shuffle them.
    const x = ((i * 37) % 23) - 6;
    return `<button type="button" style="--i:${i};--x:${x}px" class="${mine ? 'mine' : ''}"
      ${mine ? `onclick="toggleReact(${id},'${r.e}')"` : 'tabindex="-1"'} aria-label="${esc(r.e)}${mine ? ' (yours, tap to remove)' : ''}">${r.e}</button>`;
  }).join('')}</div>`;
}

function pickReact(ev, id) {
  ev.stopPropagation();
  const row = ev.currentTarget.closest('.acts');
  const had = row.querySelector('.reactpick');
  if (had) return had.remove();
  const box = document.createElement('div');
  box.className = 'reactpick';
  box.innerHTML = REACTS.map(e => `<button type="button" onclick="toggleReact(${id},'${e}');this.parentNode.remove()">${e}</button>`).join('');
  row.appendChild(box);
}

// Same as a like: shown at once and put back if the write is refused.
async function toggleReact(id, emoji) {
  const m = me(), had = S.reacts.some(r => r.p === id && r.u === m.id && r.e === emoji);
  const undo = () => { S.reacts = had ? [...S.reacts, {p: id, u: m.id, e: emoji}]
    : S.reacts.filter(r => !(r.p === id && r.u === m.id && r.e === emoji)); render(); };
  S.reacts = had ? S.reacts.filter(r => !(r.p === id && r.u === m.id && r.e === emoji))
                 : [...S.reacts, {p: id, u: m.id, e: emoji}];
  render();
  try {
    if (had) await q(sb.from('reactions').delete().eq('post_id', id).eq('user_id', m.id).eq('emoji', emoji));
    else await q(sb.from('reactions').insert({post_id: id, user_id: m.id, emoji}));
  } catch (e) { undo(); }
}

// Kept in front of them straight away rather than after a round trip: a heart that waits
// on the network to fill in feels broken even when it is working.
async function toggleLike(id) {
  const m = me(), had = iLike(id);
  S.likes = had ? S.likes.filter(l => !(l.p === id && l.u === m.id)) : [...S.likes, {p: id, u: m.id}];
  render();
  try {
    if (had) await q(sb.from('likes').delete().eq('post_id', id).eq('user_id', m.id));
    else await q(sb.from('likes').insert({post_id: id, user_id: m.id}));
  } catch (e) {
    S.likes = had ? [...S.likes, {p: id, u: m.id}] : S.likes.filter(l => !(l.p === id && l.u === m.id));
    render();
  }
}

const MILESTONES = [25, 50, 100, 150, 250, 365, 500, 1000];
// Worth a story sooner than it is worth stopping the app for: a first week is a real
// thing to say out loud, and a hundred is a different kind of thing again.
const STORY_MILESTONES = [3, 5, 7, 10, 14, 21, 25, 30, 50, 75, 100, 150, 200, 250, 300, 365, 500, 1000];
const STORY_MILE_LINE = d => d >= 365 ? 'A full year. Every single day.' : d >= 100 ? 'Not one missed.' : 'Still going.';
const MILESTONE_LINE = {
  25: 'Three and a half weeks without missing one.',
  50: 'Fifty days. Most people never see the far side of a fortnight.',
  100: 'Three figures. This is the one people remember.',
  150: 'Five months of showing up, whatever the day looked like.',
  250: 'Two hundred and fifty. There is no luck left in this number.',
  365: 'A full year. Every single day.',
  500: 'Five hundred days. This is just who you are now.',
  1000: 'One thousand days. Nothing left to say.',
};
// ---- badges
// What a long run leaves behind. Earned once and kept: the run can break the next day and
// the badge stays, and reaching the same number again does not produce a second one — the
// row is already there and the database will not take another.
//
// Each one is a shield until the numbers stop being ordinary, and then it stops being a
// shield: a year gets laurels, and past that it is a crown. At the size these are drawn,
// only the silhouette and the metal carry, so that is what changes. The fine detail is for
// the one in the dialog, which is the same drawing at three times the size.
const BADGE_NAME = {
  25: 'Steady', 50: 'Half century', 100: 'Century', 150: 'Unbroken',
  250: 'Ironclad', 365: 'A full year', 500: 'Five hundred', 1000: 'A thousand days',
};
const SHIELD = 'M12 1.7 20.4 4.8V11c0 5.6-3.5 9.6-8.4 11.3C7.1 20.6 3.6 16.6 3.6 11V4.8Z';
const STAR = 'M12 7.1l1.5 3.4 3.7.35-2.8 2.45.83 3.6L12 15l-3.2 1.9.83-3.6-2.8-2.45 3.7-.35Z';
const CROWN = 'M3.2 8.6 7 12l5-8 5 8 3.8-3.4-1.5 11.4H4.7Z';
const LAUREL = 'M12 2.6a9.4 9.4 0 0 0-9.4 9.4 9.4 9.4 0 0 0 9.4 9.4 9.4 9.4 0 0 0 9.4-9.4A9.4 9.4 0 0 0 12 2.6Zm0 2.2a7.2 7.2 0 0 1 7.2 7.2 7.2 7.2 0 0 1-7.2 7.2A7.2 7.2 0 0 1 4.8 12 7.2 7.2 0 0 1 12 4.8Z';
// The fill, and what sits on it. Ordered so the jump from green to metal and from metal to
// a crown lands exactly where the number stops being something most people reach.
function badgeMark(n, cls = '') {
  const g = k => `url(#bg${k})`;
  const inner = (d, fill, op = '1') => `<path d="${d}" fill="${fill}" opacity="${op}"/>`;
  // Rank chevrons rather than bars: two bars stacked read as an equals sign, which is not
  // what a badge should say.
  const chev = y => `<path d="M8 ${y}l4 3.2 4-3.2" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity=".95"/>`;
  const art =
      n === 25   ? `<path d="${SHIELD}" fill="${g('Green')}"/>${chev(9.8)}`
    : n === 50   ? `<path d="${SHIELD}" fill="${g('Green')}"/>${chev(8.2)}${chev(12)}`
    : n === 100  ? `<path d="${SHIELD}" fill="${g('Bronze')}"/>${inner(STAR, '#4a2a12', '.85')}`
    : n === 150  ? `<path d="${SHIELD}" fill="${g('Silver')}"/>${inner(STAR, '#3d474c', '.85')}`
    : n === 250  ? `<path d="${SHIELD}" fill="${g('Gold')}"/>${inner(STAR, '#6b4a06', '.85')}`
    : n === 365  ? `<path d="${LAUREL}" fill="${g('Gold')}"/><circle cx="12" cy="12" r="6" fill="${g('Gold')}" opacity=".3"/>${inner(STAR, g('Gold'))}`
    : n === 500  ? `<path d="${CROWN}" fill="${g('Gold')}"/><rect x="4.7" y="17.4" width="14.6" height="2.4" fill="${g('Gold')}"/>`
    : `<path d="${CROWN}" fill="${g('Royal')}"/><rect x="4.7" y="17.4" width="14.6" height="2.4" fill="${g('Royal')}"/><circle cx="12" cy="14.2" r="1.9" fill="${g('Gem')}"/>`;
  return `<svg class="bdg ${cls}" viewBox="0 0 24 24" aria-hidden="true">${art}</svg>`;
}
const badgesOf = uid => S.badges.filter(b => b.u === uid).sort((a, b) => a.n - b.n);
const topBadge = uid => badgesOf(uid).slice(-1)[0];
// Next to a name, only the highest: a row of eight beside somebody's name is a wall, and
// the one that matters is the last one they passed. The rest are on the profile.
function badgeChip(uid) {
  const b = topBadge(uid);
  if (!b) return '';
  return `<button type="button" class="bchip" onclick="event.stopPropagation();badgeDlg('${esc(uid)}',${b.n})"
    aria-label="${b.n} day streak badge">${badgeMark(b.n)}</button>`;
}
function badgeDlg(uid, n) {
  const u = user(uid), b = S.badges.find(x => x.u === uid && x.n === n);
  const when = b && Number.isFinite(b.ts)
    ? new Date(b.ts).toLocaleDateString(undefined, {day: 'numeric', month: 'long', year: 'numeric'}) : '';
  dlg(`<div class="bwin">${badgeMark(n, 'big')}
    <b class="num">${n}</b><span class="days">day streak</span>
    <h2>${esc(BADGE_NAME[n] || '')}</h2>
    <p class="muted">${esc(MILESTONE_LINE[n] || '')}</p>
