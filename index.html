<style>
/* Black, white and one green, and the green is the streak itself.
   --mk   the mark colour: fills, rules, rings
   --mkt  the same hue at a weight that can be read as text on the page
   --onmk what sits on top of --mk
   All three step up as a run grows — see [data-stage] below and stageOf(). --acc and --ok
   are kept as names because the rest of the sheet is written in terms of them. */
:root{--bg:#fff;--card:#fff;--line:#e8e9ea;--text:#0b0c0e;--muted:#8b8f94;--soft:#f5f6f6;
  --teal:#0b0c0e;--onteal:#fff;--teal2:#8b8f94;--todo:#d7d9da;--sheet:#fff;--barbg:rgba(255,255,255,.96);
  --acc:var(--mk);--ok:var(--mk);--okbg:var(--mktint);--mkring:rgba(17,129,74,.22);
  /* stage 1: a run that has only just started */
  --mk:#0b5a34;--mkt:#0b5a34;--onmk:#fff;--mktint:#e9f2ed;--mkveil:rgba(11,90,52,.10);
  --g1:#0b5a34;--g2:#0b5a34;--fill:100%}
:root[data-stage="2"]{--mk:#12934f;--mkt:#0e7044;--onmk:#06230f;--mktint:#e7f4ec;--mkveil:rgba(18,147,79,.10);
  --g1:#0b5a34;--g2:#12934f;--fill:52%}
:root[data-stage="3"]{--mk:#1db061;--mkt:#118047;--onmk:#04240f;--mktint:#e6f7ee;--mkveil:rgba(29,176,97,.12);
  --g1:#0b5a34;--g2:#25c56d;--fill:26%}
:root[data-stage="4"]{--mk:#2fd36f;--mkt:#11814a;--onmk:#06230f;--mktint:#e6f9ef;--mkveil:rgba(47,211,111,.14);
  --g1:#0a5230;--g2:#48ec8b;--fill:0%}
/* Dark is the same design on ink rather than paper. The deep greens vanish against it, so
   anything that has to be read as text takes the bright end of the ramp instead. */
:root[data-theme=dark]{--bg:#0a0b0c;--card:#121315;--line:#232527;--text:#f2f3f4;--muted:#9ba0a4;--soft:#1a1c1e;
  --teal:#f2f3f4;--onteal:#0a0b0c;--teal2:#6f7478;--todo:#2c2f31;--sheet:#121315;--barbg:rgba(18,19,21,.94);
  --mkring:rgba(63,220,127,.25)}
:root[data-theme=dark]{--mk:#0f7f45;--mkt:#3fdc7f;--onmk:#fff;--mktint:#11291d;--mkveil:rgba(63,220,127,.12);
  --g1:#0b5a34;--g2:#0f7f45}
:root[data-theme=dark][data-stage="2"]{--mk:#16a35b;--mkt:#48df85;--onmk:#05210e;--mktint:#122b1f;--g1:#0b5a34;--g2:#16a35b}
:root[data-theme=dark][data-stage="3"]{--mk:#26c46d;--mkt:#55e58e;--onmk:#04240f;--mktint:#132e21;--g1:#0b5a34;--g2:#26c46d}
:root[data-theme=dark][data-stage="4"]{--mk:#48ec8b;--mkt:#62ec97;--onmk:#06230f;--mktint:#143222;--g1:#12934f;--g2:#48ec8b}
*{box-sizing:border-box}
html{background:var(--bg)}
/* An installed app, not a page in a browser. touch-action kills the double-tap zoom,
   overscroll-behavior kills the rubber band and pull-to-refresh, and the callout and
   selection are what make a long press feel like a web page rather than an app. */
html,body{overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 "Plus Jakarta Sans",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;
  touch-action:manipulation;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
main{max-width:600px;margin:0 auto;padding:0 0 120px;position:relative;min-height:100vh}
main.out{padding-bottom:0;min-height:0}
.num{font-family:Oswald,system-ui,sans-serif;font-weight:600;font-variant-numeric:tabular-nums}
h2{margin:0;font-size:17px;font-weight:800}
h3{margin:22px 18px 8px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
p{margin:0}
button{font:inherit;font-weight:800;border:0;border-radius:0;padding:11px 16px;background:var(--soft);color:var(--text);cursor:pointer;white-space:nowrap}
/* Pressing: a big button dims the way a native one does; a small icon gives under the
   thumb. Nothing on the page moves because it was tapped, only the thing that was tapped. */
button{transition:opacity .1s ease,background-color .15s ease,color .15s ease,transform .12s cubic-bezier(.2,.7,.2,1)}
button:active{opacity:.6}
.bar button:active,.acts button:active,.stories .s:active,.cin .emo:active,.post .more:active,.x:active,.bin:active,.eye:active,.tb:active,.dot:active,.bgbtn:active{opacity:1;transform:scale(.88)}
button.primary{background:var(--mk);color:var(--onmk)}
button.teal{background:var(--teal);color:var(--onteal)}
button.small{padding:7px 12px;font-size:13px}
button.ghost{background:none;color:var(--muted);padding:6px 4px;font-weight:600}
button:disabled{opacity:.6}
/* 16px is not a taste: iOS zooms the whole page into any field smaller than that when
   it is focused, and will not zoom back out. Every field in the app is at least 16. */
input,select,textarea{font:inherit;font-size:16px;width:100%;padding:12px 14px;border-radius:0;border:1px solid var(--line);background:var(--card);color:var(--text);min-width:0;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--mk);box-shadow:0 0 0 3px var(--mkring)}
textarea{resize:vertical;line-height:1.5}
.check input{width:19px}
input[type=file]{padding:10px;font-size:16px}
label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:12px 0 6px}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--muted);font-size:13px;font-weight:600}
/* header block */
.hdr{background:var(--bg);color:var(--text);padding:calc(16px + env(safe-area-inset-top)) 20px 0;border-bottom:1px solid var(--line)}
.hdr .top{display:flex;justify-content:space-between;align-items:center}
.logo{font-family:Oswald,system-ui,sans-serif;font-weight:600;font-size:17px;letter-spacing:.09em;text-transform:uppercase;color:var(--text);display:flex;align-items:center;gap:8px}
.logo svg{width:24px;height:24px}
.hdr .date{font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.hdr h1{font-family:Oswald,system-ui,sans-serif;margin:16px 0;font-size:34px;font-weight:600;letter-spacing:0;text-transform:uppercase}
.hdr .big{display:flex;align-items:flex-end;gap:13px;margin-top:16px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.hdr .big b{font-size:74px;letter-spacing:-.02em;line-height:.8;padding:.08em .04em .2em 0;margin:-.08em 0 -.2em 0;
  background:linear-gradient(to top,var(--g1) 0,var(--g1) var(--fill),var(--g2) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
:root[data-stage="4"] .hdr .big b{filter:drop-shadow(0 2px 12px rgba(72,236,139,.3))}
.hdr .big div{font-weight:700;font-size:15px;line-height:1.3}
.hdr .big div small{display:block;color:var(--muted);font-weight:600;font-size:12.5px}
.mini{display:block}
.mini div{display:grid;grid-template-columns:minmax(84px,auto) minmax(34px,1fr) auto;align-items:center;gap:0 12px;padding:11px 0;
  border-bottom:1px solid var(--line);font-size:12.5px;font-weight:800;letter-spacing:.01em;color:var(--text)}
.mini div b{font-family:Oswald,system-ui,sans-serif;font-weight:600;font-size:14px;letter-spacing:0;
  color:var(--text);font-variant-numeric:tabular-nums;text-align:right;min-width:0;overflow-wrap:anywhere}
.mini div span{min-width:0;line-height:1.25;overflow-wrap:anywhere}
.mini div em{display:block;font-style:normal;font-weight:600;font-size:11px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
/* The whole gradient is the whole day. A quarter done shows the first quarter of it, which
   is the dark end, and it lightens as it fills — so the colour says how far along you are
   and not merely that you are along. Drawn as the gradient with the unearned part covered
   rather than as a fill that is coloured, because a fill scales its own gradient and a
   quarter-width fill would then be the whole dark-to-light run squeezed into a quarter. */
.mini i{display:block;height:2px;background:linear-gradient(90deg,#0b5a34,#2fd36f 55%,#48ec8b);border-radius:0;overflow:hidden}
.mini div:last-child{border-bottom:0}
.mini i::after{content:"";display:block;height:100%;margin-left:var(--w);width:calc(100% - var(--w));
  background:var(--line);transition:margin-left .4s,width .4s}
/* Only people with something running are in this row, unseen first. A lit ring is a story
   you have not watched; once you have, it goes quiet rather than disappearing. */
.stories{display:flex;gap:14px;padding:14px 20px 2px;overflow-x:auto;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.stories .s{flex:none;width:64px;background:none;padding:0;border-radius:0;display:flex;flex-direction:column;align-items:center;gap:7px}
/* One ring, used by the row and by every face on a post. Sized off the face inside it, so
   the same rule works around a 58px avatar and a 34px one. */
.rg{position:relative;display:grid;place-items:center;flex:none;border-radius:50%;padding:2.5px;background:var(--soft)}
button.rg{border:0;font:inherit}
.rg .av{box-shadow:0 0 0 2px var(--card)}
/* Always the full sweep, not the streak ramp: early in a run the ramp is nearly flat, and
   a ring that says "unwatched" has to look like one whatever day you are on. */
.rg.new{background:linear-gradient(135deg,#0b5a34,#2fd36f 52%,#7ef0b0)}
/* Watched: the same ring with the life gone out of it, not a different shape. */
.rg.old{background:none;box-shadow:inset 0 0 0 2px var(--line)}
.stories .rg{width:58px;height:58px;padding:3px}
.stories .s.me .rg{background:none;box-shadow:inset 0 0 0 2px var(--line)}
/* Once there is something to watch, your own ring is a ring like everyone else's: the
   empty-circle treatment above is for the day you have posted nothing. */
.stories .s.me.has .rg.new{background:linear-gradient(135deg,#0b5a34,#2fd36f 52%,#7ef0b0);box-shadow:none}
.stories .s.me.has .rg.old{box-shadow:inset 0 0 0 2px var(--line)}
.stories .rg .av{width:100%;height:100%;font-size:17px;box-shadow:0 0 0 2px var(--bg)}
.stories .rg i{position:absolute;right:-2px;bottom:-2px;width:20px;height:20px;border-radius:50%;background:var(--mk);
  color:var(--onmk);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:15px;line-height:1;border:2px solid var(--bg)}
/* A day is not one story. Once you have posted one, your own circle keeps the plus — the
   face watches back what is there, the plus adds to it. They are separate taps because
   they are separate things, and a button cannot live inside a button. */
.stories .s.me.has{position:relative}
.stories .s.me .own{background:none;padding:0;border-radius:50%;line-height:0}
.stories .s.me .plus{position:absolute;right:1px;top:38px;z-index:2;width:22px;height:22px;padding:0;border-radius:50%;
  background:var(--mk);color:var(--onmk);font-weight:800;font-size:16px;line-height:1;display:grid;place-items:center;
  border:2px solid var(--bg)}
.stories .nm{font-size:11px;font-weight:700;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stories .s.me .nm{color:var(--text)}

/* One drawing, used by the editor and by everyone who watches it after. */
.face{position:relative;width:100%;aspect-ratio:9/16;overflow:hidden;background:#000;touch-action:none}
.face .fill{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* The words: a block that sits at the point it was dragged to, centred on it. */
.face .type{position:absolute;transform:translate(-50%,-50%);max-width:88%;min-width:40px;padding:6px 12px;
  line-height:1.15;white-space:pre-wrap;overflow-wrap:anywhere;outline:none;
  text-shadow:0 2px 18px rgba(0,0,0,.28);cursor:grab;touch-action:none}
.face .type.boxed{border-radius:10px;text-shadow:none;padding:8px 14px}
.face .type.fx{text-shadow:none}
.face .type.sz2.fx[style*="text-stroke"]{-webkit-text-stroke-width:2px}
.face .type.sz0{font-size:20px}
.face .type.sz1{font-size:30px}
.face .type.sz2{font-size:42px}
.face .type:empty::before{content:attr(data-ph);opacity:.5}
.face .stk{position:absolute;transform:translate(-50%,-50%);font-size:72px;line-height:1;cursor:grab;touch-action:none;
  filter:drop-shadow(0 6px 14px rgba(0,0,0,.35));user-select:none}
/* The two it writes for you. The ring and the sparks are drawn in the ink colour, so
   picking a colour recolours the whole card, not just the words. */
/* Proof lifted from the feed onto a story. A card with an edge and a shadow, sitting a
   little off square, so it reads as something stuck on rather than something shot for
   this. Above the tap zones, which are z-index 2, or a tap on it would step the story on
   instead of opening what it is a picture of. */
.face .pcard{position:absolute;transform:translate(-50%,-50%) rotate(-2.4deg);width:68%;max-width:272px;z-index:3;
  padding:0;border:0;border-radius:14px;overflow:hidden;background:#0b0c0e;color:#fff;text-align:left;
  box-shadow:0 18px 44px -12px rgba(0,0,0,.6),0 0 0 3px rgba(255,255,255,.9);touch-action:none;cursor:pointer}
.face .pcard .shot{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;background:#0b0c0e}
.face .pcard .foot{display:flex;align-items:center;gap:7px;padding:8px 10px;background:#0b0c0e;min-width:0}
.face .pcard .foot b{font-size:12.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.face .pcard .foot em{margin-left:auto;font-style:normal;font-family:Oswald,system-ui,sans-serif;font-weight:600;
  font-size:12px;color:#2fd36f;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;flex:none}
.face .pcard .foot .av{width:20px;height:20px;font-size:9px;flex:none}
.face .pcard .gone{padding:34px 16px;text-align:center;font-size:13.5px;font-weight:700;color:rgba(255,255,255,.72)}
.face .pcard:active{transform:translate(-50%,-50%) rotate(-2.4deg) scale(.97)}
.face .deco{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.face .hero{position:absolute;left:0;right:0;top:11%;display:flex;flex-direction:column;align-items:center;gap:4px;
  pointer-events:none;color:inherit}
.face .hero .big{font-family:Oswald,system-ui,sans-serif;font-weight:600;font-size:172px;line-height:.82;letter-spacing:-.03em;
  text-shadow:0 8px 40px rgba(0,0,0,.28)}
.face .hero .word{font-family:Oswald,system-ui,sans-serif;font-weight:600;font-size:58px;line-height:1;letter-spacing:-.01em;
  text-transform:uppercase;text-align:center;padding:0 22px;text-shadow:0 8px 40px rgba(0,0,0,.28);overflow-wrap:anywhere}
.face .hero .tag{font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-weight:800;font-size:13px;letter-spacing:.24em;
  text-transform:uppercase;margin-top:10px;padding:8px 14px;border:2px solid currentColor;border-radius:999px}
.face .hero .tickring{width:64px;height:64px;margin-bottom:8px}
.face .hero .tickring svg{width:100%;height:100%;display:block}
.face .hero .stamp{position:absolute;right:8%;top:58%;transform:rotate(-9deg);font-family:Oswald,system-ui,sans-serif;font-weight:600;
  font-size:26px;letter-spacing:.2em;text-transform:uppercase;padding:6px 12px 5px;border:4px solid currentColor;border-radius:8px;
  opacity:.85;mix-blend-mode:screen}
.face.tpl .type{text-shadow:0 2px 14px rgba(0,0,0,.35)}

/* Watching. Full screen, because that is what it is for. */
#story,#make{position:fixed;inset:0;z-index:70;background:#050706;display:grid;grid-template-columns:minmax(0,1fr);place-items:center}
#story[hidden],#make[hidden]{display:none}
#story .pane,#make .pane{position:relative;width:min(100%,430px);height:100%;display:flex;flex-direction:column;
  padding:calc(8px + env(safe-area-inset-top)) 0 calc(8px + env(safe-area-inset-bottom))}
/* A strip rather than a single card, so the one you are heading for is already beside the
   one you are on and the whole thing can move with your finger. */
#story{overflow:hidden}
#story .track{position:relative;width:min(100%,430px);height:100%;display:flex;will-change:transform;
  transform:translateX(calc(var(--base,0px) + var(--dx,0px)));
  transition:transform 320ms cubic-bezier(.32,.72,0,1)}
#story .track.grab{transition:none}
#story .track > .pane{flex:0 0 100%;width:100%}
#story .bars{display:flex;gap:4px;padding:0 10px}
#story .bars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.28)}
#story .bars i.done{background:rgba(255,255,255,.85)}
/* The one being watched fills as it runs, which is the whole of what tells you how long is
   left — and, now that another of the same person's arrives with no slide, the only thing
   that moves when it does. Held still while a finger is down. */
#story .bars i.now{background:rgba(255,255,255,.28);overflow:hidden}
#story .bars i.now b{display:block;height:100%;width:var(--from,0%);background:#fff;border-radius:2px;
  animation:barfill var(--run,5000ms) linear forwards}
#story.held .bars i.now b{animation-play-state:paused}
@keyframes barfill{to{width:100%}}
#story .who{display:flex;align-items:center;gap:9px;padding:12px 12px 10px;color:#fff;position:relative;z-index:3}
#story .who b{font-size:14.5px;font-weight:800}
#story .who span{font-size:12px;color:rgba(255,255,255,.7)}
#story .who .x{margin-left:auto;background:none;color:#fff;font-size:17px;padding:4px 6px}
/* Under the ✕ rather than beside it: the way out of a story and what to do with it are
   two different decisions, and the corner is where the thumb already is for both. The
   chip is there because a story can be a white photo and bare white on it is nothing. */
#story .who .bin{position:absolute;right:12px;top:100%;margin:0;padding:7px;border-radius:50%;
  background:rgba(0,0,0,.42);color:#fff;display:grid;place-items:center;line-height:0}
#story .who .bin svg{width:20px;height:20px;display:block;fill:currentColor;
  filter:drop-shadow(0 1px 4px rgba(0,0,0,.5))}
#story .face{flex:1;aspect-ratio:auto;min-height:0}
/* Sideways is ours, so a swipe across is not taken as a page gesture first. Up and down
   is left alone, because the list of who watched scrolls. */
#story{touch-action:pan-y}
/* Half each, under everything: forward on the right the way every app does it. */
#story .tap{position:absolute;top:70px;bottom:0;width:38%;background:none;padding:0;z-index:2}
#story .tap.back{left:0}
#story .tap.fwd{right:0;width:62%}
/* Who watched: only on your own, in the corner where the other app keeps it. */
#story .eye{position:absolute;left:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:3;display:flex;align-items:center;gap:6px;
  background:rgba(0,0,0,.45);color:#fff;font-size:13px;font-weight:800;padding:8px 12px;border-radius:999px}
#story .eye svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linejoin:round}
#story .seenby{position:absolute;left:0;right:0;bottom:0;max-height:60%;overflow-y:auto;z-index:4;background:#fff;color:var(--ink);
  padding:14px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
#story .seenby[hidden]{display:none}
#story .seenby .hd{display:flex;align-items:center;justify-content:space-between}
#story .seenby .hd .x{background:none;font-size:17px;padding:4px 6px}
#story .seenby .tabs{display:flex;gap:6px;min-width:0}
#story .seenby .tabs button{background:none;padding:6px 0;margin-right:10px;font-size:14.5px;font-weight:800;color:var(--muted);border-bottom:2px solid transparent}
#story .seenby .tabs button.on{color:var(--text);border-bottom-color:var(--mk)}
#story .seenby .mark{display:flex;align-items:center;gap:8px;flex:none}
#story .seenby .em{font-style:normal;font-size:17px;line-height:1}
#story .seenby .hrt{display:block;width:17px;height:17px}
#story .seenby .hrt svg{width:100%;height:100%;fill:#ff3b5c;stroke:#ff3b5c;stroke-width:1.6}
/* A list of things you can do, one per line, the last one the one you cannot undo. */
.menu{display:flex;flex-direction:column;gap:2px;margin-top:14px}
.menu button{background:none;text-align:left;padding:14px 4px;font-size:15px;font-weight:700;border-bottom:1px solid var(--line)}
.menu button:last-child{border-bottom:0}
.menu button.bad{color:#d1344f}
#story .seenby b{font-size:14.5px;font-weight:800}
/* Answering one: a heart and an emoji, along the bottom where a thumb already is. */
#story .answer{position:absolute;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:3;
  display:flex;flex-direction:row;align-items:center;gap:6px}
#story .answer button{background:none;padding:8px;color:#fff;display:grid;place-items:center}
#story .answer svg{width:31px;height:31px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;
  filter:drop-shadow(0 2px 8px rgba(0,0,0,.55))}
#story .answer .lk.on svg{fill:#ff3b5c;stroke:#ff3b5c;animation:heart .35s cubic-bezier(.2,.8,.2,1)}
#story .answer .reactpick{bottom:calc(100% + 4px);right:0;left:auto;transform-origin:bottom right;
  background:rgba(0,0,0,.72);backdrop-filter:blur(14px);border:0;border-radius:999px}
#story .answer .reactpick button{padding:6px 8px;font-size:24px;line-height:1}
/* What your own story got: beside the eye, in the same quiet pill. */
#story .tally{position:absolute;left:104px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:3;display:flex;align-items:center;gap:6px;
  background:rgba(0,0,0,.45);color:#fff;font-size:13px;font-weight:800;padding:8px 12px;border-radius:999px}
#story .tally svg{width:17px;height:17px;fill:#ff3b5c;stroke:#ff3b5c;stroke-width:1.6}
/* Drifting up the left, exactly as they do on a post. */
#story .reacts{position:absolute;left:14px;bottom:76px;z-index:3;display:flex;flex-direction:column-reverse;
  flex-wrap:wrap-reverse;align-content:flex-start;align-items:flex-start;gap:0 6px;pointer-events:none;max-height:50%}
#story .reacts span{font-size:26px;line-height:1;padding:2px;text-shadow:0 2px 6px rgba(0,0,0,.6);
  transform:translateX(var(--x,0px));animation:bob 3.4s ease-in-out infinite;animation-delay:calc(var(--i,0) * -.7s)}

/* Making one. The other app's shape: close on the left, tools on the right, the card in
   the middle, colours along the bottom, share underneath. */
#make .mbar{display:flex;align-items:center;gap:10px;padding:8px 12px;color:#fff}
#make .mbar.top{padding-top:6px}
#make .mbar .x{background:none;color:#fff;font-size:18px;padding:6px 8px}
#make .tools{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0}
#make .bgbtn{width:34px;height:34px;flex:none;border-radius:50%;padding:0;box-shadow:inset 0 0 0 2px rgba(255,255,255,.85)}
#make .bgbtn.on{box-shadow:0 0 0 2px #050706,0 0 0 4px #fff}
#make .fontpill{background:rgba(255,255,255,.16);color:#fff;border-radius:999px;padding:8px 12px 8px 14px;font-size:14px;min-width:0;flex:0 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
#make .fontpill i{font-style:normal;font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-size:11px;opacity:.7}
#make .fontpill.on{background:#fff;color:#0b0c0e}
#make .tb{width:36px;height:36px;flex:none;border-radius:50%;padding:0;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center;font-size:18px}
#make .tb.on{background:#fff;color:#0b0c0e}
#make .tb svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#make .inkbtn span{width:20px;height:20px;border-radius:50%;box-shadow:0 0 0 2px #fff}
#make .inkbtn.on span{box-shadow:0 0 0 2px #0b0c0e}
#make .canvas{position:relative;flex:1;min-height:0;display:grid;min-width:0}
#make .canvas .face{height:100%;aspect-ratio:auto}
/* One tray at a time over the foot of the card: everything of one kind laid out at once,
   the one in use marked, so choosing is a look and a tap rather than a walk round a loop. */
#make .tray{position:absolute;left:12px;right:12px;bottom:12px;max-height:60%;overflow-y:auto;overscroll-behavior:contain;z-index:3;color:#fff;
  padding:12px;background:rgba(0,0,0,.74);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:16px;
  animation:rise .2s cubic-bezier(.2,.7,.2,1);scrollbar-width:none}
#make .tray::-webkit-scrollbar{display:none}
#make .trow{display:flex;gap:8px;align-items:center;margin-bottom:12px}
#make .chip{background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:0 13px;height:34px;font-weight:800;line-height:1;display:grid;place-items:center}
#make .chip.on{background:#fff;color:#0b0c0e}
#make .chip.ic{width:40px;padding:0}
#make .chip svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
#make .sep{width:1px;height:22px;background:rgba(255,255,255,.2);margin:0 2px}
#make .grid{display:grid;gap:8px}
#make .fonts{grid-template-columns:repeat(2,1fr)}
#make .fonts button{background:rgba(255,255,255,.1);color:#fff;border-radius:12px;padding:12px 10px;font-size:21px;line-height:1.1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#make .fonts button.on{background:#fff;color:#0b0c0e}
#make .inks{grid-template-columns:repeat(6,1fr);justify-items:center;padding:4px 0}
#make .dot{width:38px;height:38px;border-radius:50%;padding:0;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
#make .dot.on{box-shadow:0 0 0 2.5px #0b0c0e,0 0 0 5px #fff}
#make .bgs{grid-template-columns:repeat(4,1fr);gap:10px}
#make .tile{aspect-ratio:3/4;border-radius:10px;padding:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
#make .tile.on{box-shadow:0 0 0 2.5px #0b0c0e,0 0 0 5px #fff}
#make .fxs{grid-template-columns:repeat(3,1fr)}
#make .fxs button{background:rgba(255,255,255,.1);color:#fff;border-radius:12px;padding:10px 6px 9px;font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:7px}
#make .fxs button.on{background:rgba(255,255,255,.3)}
#make .fxs .demo{font-family:Oswald,system-ui,sans-serif;font-weight:600;font-size:28px;line-height:1;padding:4px 10px;border-radius:6px}
#make .stks{grid-template-columns:repeat(7,1fr);gap:2px}
#make .stks button{background:none;padding:7px 0;font-size:26px;line-height:1}
#make .mbar.bottom{padding-bottom:calc(10px + env(safe-area-inset-bottom));min-width:0}
#make .who{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:800;color:#fff;min-width:0}
#make .go{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--mk);color:var(--onmk);
  font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:11px 16px;border-radius:999px}
#make .go svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#make .go:disabled{opacity:.6}


/* What happened while you were not looking. Shut, and one line tall: the streak is what
   the top of this screen is for. */
.act{margin:14px 18px 0;border:1px solid var(--line)}
.act summary{display:flex;align-items:center;gap:9px;padding:11px 13px;cursor:pointer;list-style:none;
  font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.act summary::-webkit-details-marker{display:none}
.act summary .dot{width:7px;height:7px;border-radius:50%;background:var(--mk);flex:none}
.act summary .n{margin-left:auto;color:var(--mkt);letter-spacing:.1em}
.act summary .chev{width:15px;height:15px;flex:none;stroke:var(--muted);fill:none;stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round;transition:transform .18s}
.act[open] summary .chev{transform:rotate(180deg)}
.act .e{display:flex;align-items:center;gap:10px;padding:9px 13px;border-top:1px solid var(--line);font-size:13px}
.act .e p{color:var(--muted);font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act .e p b{color:var(--text);font-weight:800}
.act .e .t{margin-left:auto;font-size:11px;color:var(--muted);font-weight:700;white-space:nowrap}
@media (prefers-reduced-motion:reduce){.act summary .chev{transition:none}}
/* cards */
.card{margin:14px 18px;border:1px solid var(--line);border-radius:0;padding:16px;background:var(--card)}
.card h2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h2 span{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
.q{margin-top:14px}
.q .t{display:flex;justify-content:space-between;font-weight:700;font-size:14px}
.q .t span{color:var(--muted)}
/* The same bar in a group card, so the two cannot say different things about one day. */
.tr{height:3px;border-radius:0;background:linear-gradient(90deg,#0b5a34,#2fd36f 55%,#48ec8b);margin-top:8px;overflow:hidden}
.tr i{display:block;height:100%;border-radius:0;margin-left:var(--w, 0);width:calc(100% - var(--w, 0));
  background:var(--line);transition:margin-left .4s,width .4s}
.ppl{display:flex;margin-top:14px;align-items:center}
.ppl .av{border:2px solid var(--card);margin-left:-8px}
.ppl .av:first-child{margin-left:0}
.ppl span{margin-left:10px}
.av{width:30px;height:30px;border-radius:50%;background:var(--teal);color:var(--onteal);display:grid;place-items:center;font-weight:800;font-size:12px;flex:none;text-transform:uppercase;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.todo{background:var(--todo);color:var(--text)}
.av.todo img{opacity:.45}
.av.sm{width:24px;height:24px;font-size:11px}
.av.lg{width:40px;height:40px;font-size:15px}
.av.xl{width:76px;height:76px;font-size:30px}
.chip{display:inline-block;padding:5px 10px;border-radius:0;border:1px solid var(--line);background:none;font-size:11.5px;font-weight:800;letter-spacing:.02em;white-space:nowrap}
.chip.ok{background:none;border-color:var(--mk);color:var(--mkt)}
.empty{text-align:center;padding:28px 16px}
.empty b{display:block;font-size:16px;margin-bottom:4px}
.check{display:flex;align-items:center;gap:9px;margin-top:14px;font-weight:700;font-size:14px}
.check input{width:19px;height:19px;margin:0;flex:none;accent-color:var(--mk)}
.check span{font-weight:700}
/* Big enough to be seen on the way past, and dashed while it is still a question — the
   answer to which is the difference between a challenge day counting and not. */
.chal{position:relative;display:flex;align-items:center;gap:13px;margin-top:16px;padding:14px;border-radius:0;cursor:pointer;
  border:2px dashed var(--mk);background:linear-gradient(180deg,var(--mkveil),transparent)}
/* Invisible but the size of the whole card, so the tap target is the card rather than a
   28px square, and it is still a real focusable checkbox underneath. */
.chal input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.chal input:focus-visible ~ .box{box-shadow:0 0 0 3px var(--mkring)}
.chal .box{flex:none;width:28px;height:28px;border-radius:0;border:2px solid var(--mk);background:var(--card);
  display:grid;place-items:center}
.chal .box::after{content:"";width:13px;height:7px;border-left:3px solid var(--onmk);border-bottom:3px solid var(--onmk);
  border-radius:1px;transform:rotate(-45deg) translate(1px,-2px);opacity:0;transition:opacity .12s}
.chal input:checked ~ .box{background:var(--mk);border-color:var(--mk)}
.chal input:checked ~ .box::after{opacity:1}
.chal .txt{font-weight:700;font-size:14px;line-height:1.3;min-width:0}
.chal .txt b{display:block;font-size:16px;letter-spacing:-.01em}
.chal .txt small{display:block;color:var(--muted);font-weight:600;font-size:13px;margin-top:1px}
/* Once answered it stops asking: solid rather than dashed, and the line underneath says
   what it now means instead of what to do. */
.chal:has(input:checked){border-style:solid;background:linear-gradient(180deg,var(--mkveil),transparent)}
.chal:has(input:checked) .txt small{visibility:hidden}
.chal:has(input:checked) .txt small::before{content:"Counts towards your challenge";visibility:visible;color:var(--mkt)}
.about{margin:12px 0 0;padding:12px 0 0 18px;border-top:1px solid var(--line);color:var(--muted);
  font-size:13px;font-weight:600;line-height:1.55}
.about li{padding-left:2px}
.nudge{border-color:var(--mk)}
.nudge b{font-family:Oswald,system-ui,sans-serif;font-size:15px}
.nudge p{margin-top:5px;font-size:13px;line-height:1.4}
.chalpick{margin-top:8px}
.chalpick[hidden]{display:none}
.warn{color:#e5484d;font-size:13px;font-weight:600}
.prog{display:block;height:3px;background:var(--line);border-radius:0;overflow:hidden;margin-top:10px}
.prog::after{content:"";display:block;height:100%;background:var(--mk);width:var(--w,0%);transition:width .25s}
.prog[hidden]{display:none}
.rank{flex:none;width:20px;text-align:center;font-family:Oswald,system-ui,sans-serif;font-weight:800;font-size:13px;color:var(--muted)}
.rank.top{color:var(--mkt)}
.list{padding:4px 16px}
.list .row{padding:10px 0;border-top:1px solid var(--line)}
.list .row:first-child{border-top:0}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px;text-align:center}
.stats div{background:none;border:1px solid var(--line);border-radius:0;padding:11px 4px}
.stats b{display:block;font-family:Oswald,system-ui,sans-serif;font-weight:600;font-size:22px;color:var(--text);font-variant-numeric:tabular-nums}
.stats div:first-child b{padding:.06em .04em .18em 0;margin-bottom:-.18em;
  background:linear-gradient(to top,var(--g1) 0,var(--g1) var(--fill),var(--g2) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.stats small{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
/* posts */
.post{padding:0;overflow:hidden}
.reel{position:relative;aspect-ratio:4/5;background:#000;color:#fff}
/* Only the proof itself. Written as ".reel img" this also caught the avatar in the
   overlay above it — absolutely positioned to fill that band, on top of the name and the
   username, which is what a stretched face across every post turned out to be. */
.reel .proof{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;display:block} /* ponytail: cover crops landscape clips; switch to contain if people film sideways */
.reel::after{content:"";position:absolute;left:0;right:0;bottom:0;height:30%;background:linear-gradient(to top,rgba(0,0,0,.45),transparent);pointer-events:none}
/* Who and when, on the card above the clip, the way every established feed does it. */
.post .head{display:flex;align-items:center;gap:10px;padding:12px 14px}
.post .head .av{width:34px;height:34px;font-size:14px}
/* The gap between ring and face eats into the band, so the padding has to cover both: 3px
   of ring, 1px of card showing through, which reads as a ring at 34px rather than a hair. */
.post .head .rg{padding:4px}
.post .head .rg .av{box-shadow:0 0 0 1px var(--card)}
.post .head .rg:active{transform:scale(.92)}
.post .head .who{font-weight:800;font-size:14.5px;line-height:1.2}
.post .head .when{font-size:12.5px;color:var(--muted);font-weight:600}
.post .head .more{margin-left:auto;background:none;color:var(--muted);line-height:0;padding:4px 6px}
.post .head .more svg{width:20px;height:20px;display:block;fill:currentColor}
.reel .badge{position:absolute;right:12px;top:12px;z-index:4;background:#2fd36f;color:#06230f;font-family:Oswald;font-weight:600;font-size:13px;padding:5px 10px;border-radius:0;text-transform:uppercase;letter-spacing:.02em}
/* The player is the clip and one glyph. Tap plays and the pause bars show for a moment
   before getting out of the way; tap again and the triangle is straight back. */
.reel .play{position:absolute;inset:0;display:grid;place-items:center;z-index:1;pointer-events:none}
.reel .play i{width:58px;height:58px;border-radius:50%;background:rgba(0,0,0,.35);border:1.5px solid rgba(255,255,255,.75);display:grid;place-items:center;backdrop-filter:blur(6px);transition:opacity .22s,transform .22s}
.reel .play i::after{content:"";border-left:17px solid #fff;border-top:10px solid transparent;border-bottom:10px solid transparent;margin-left:4px}
.reel.playing .play i{opacity:0;transform:scale(1.25)}
.reel.playing.flash .play i{opacity:1;transform:none}
.reel.playing .play i::after{border:0;width:16px;height:18px;margin:0;background:linear-gradient(to right,#fff 0 36%,transparent 36% 64%,#fff 64%)}
.reel .sound{position:absolute;right:12px;bottom:14px;z-index:2;width:30px;height:30px;border-radius:50%;padding:0;background:rgba(0,0,0,.45);display:grid;place-items:center;opacity:0;transition:opacity .2s}
.reel.started .sound{opacity:1}
.reel .sound svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.reel .sound .m{display:none}
.reel .sound.off .w{display:none}
.reel .sound.off .m{display:block}
/* The only sign of time: a line along the bottom edge. No scrubber, no numbers. */
.reel .prg{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(255,255,255,.25);z-index:2;opacity:0;transition:opacity .2s}
.reel.started .prg{opacity:1}
.reel .prg b{display:block;height:100%;width:0;background:#fff}
.post .cap{padding:8px 14px 0;font-size:14px;line-height:1.45;user-select:text;-webkit-user-select:text}
.post .cap b{font-weight:800;margin-right:6px}
/* What people left, drifting up the left side of the post. Bare emoji, no pill: each one
   bobs on its own slow cycle, offset in phase and nudged sideways so they read as a loose
   column of floating things rather than a stack. */
.reel .reacts{position:absolute;left:14px;bottom:18px;z-index:4;display:flex;flex-direction:column-reverse;
  flex-wrap:wrap-reverse;align-content:flex-start;align-items:flex-start;gap:0 6px;pointer-events:none;
  max-height:calc(100% - 118px);overflow:visible}
/* No overflow clip and no filter on these: over a playing video iOS paints a clipped, filtered
   layer as a faint darker box with an edge, and the bob carried the emoji into that edge. A
   text-shadow keeps them legible on a bright frame without a layer of their own. */
.reel .reacts button{background:none;border:0;padding:2px;font-size:26px;line-height:1;pointer-events:none;
  text-shadow:0 2px 6px rgba(0,0,0,.6);transform:translateX(var(--x,0px));
  animation:bob 3.4s ease-in-out infinite;animation-delay:calc(var(--i,0) * -.7s)}
/* Yours answer to a tap. The glyph is 26px and it is bobbing, so the thing you are
   aiming at is both small and moving: a tap that was dead on when it left your thumb can
   land where the emoji was rather than where it is. The hit area is extended past the
   glyph by more than the bob can carry it, which costs no layout and no paint. */
.reel .reacts button.mine{pointer-events:auto;cursor:pointer;position:relative}
.reel .reacts button.mine::after{content:"";position:absolute;inset:-11px -9px}
@keyframes bob{
  0%,100%{transform:translate(var(--x,0px),0) scale(1)}
  50%{transform:translate(calc(var(--x,0px) + 4px),-9px) scale(1.06)}
}
@media (prefers-reduced-motion:reduce){.reel .reacts button{animation:none}}
/* A long run leaves a mark. Small beside a name, three times the size in the dialog that
   explains it — one drawing, two sizes, so they cannot disagree. */
#metals{position:absolute;width:0;height:0;overflow:hidden}
.bdg{width:17px;height:17px;display:block;flex:none}
.bdg.big{width:58px;height:58px}
.bchip{background:none;padding:0 0 0 5px;display:inline-flex;vertical-align:-3px;border-radius:0}
.bchip:active{opacity:1;transform:scale(.86)}
.post .head .line{display:flex;align-items:center;gap:0;min-width:0}
/* Every one they have, on the profile, in the order they were earned. */
.bshelf{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.bshelf button{background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.bshelf .bdg{width:30px;height:30px}
.bshelf span{font-family:Oswald,system-ui,sans-serif;font-weight:600;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
/* The dialog: the mark, the number, and what the number means. */
.bwin{text-align:center;padding:4px 0 2px}
.bwin .bdg.big{margin:0 auto 14px}
.bwin .num{display:block;font-size:52px;line-height:.9;letter-spacing:-.02em;color:var(--mkt)}
.bwin .days{display:block;font-size:10.5px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.bwin h2{font-size:20px;margin-top:14px}
.bwin p{margin-top:8px;line-height:1.45}
.bwin .who{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--muted)}

/* ---- a profile, which is a page about somebody rather than a settings screen ---- */
.hdr h1.withgear{display:flex;align-items:center;justify-content:space-between}
.gear{background:none;padding:6px;color:var(--text);display:grid;place-items:center}
.gear svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pf{padding:16px 18px 0}
.pf .who{display:flex;gap:14px;align-items:flex-start}
.pf .nm{flex:1;min-width:0;padding-top:4px}
.pf .nm b{font-size:20px;font-weight:800;display:flex;align-items:center;line-height:1.2;overflow-wrap:anywhere}
.pf .nm span{color:var(--muted);font-weight:600;font-size:14px}
.bio{margin:14px 0 0;font-size:14.5px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;user-select:text;-webkit-user-select:text}
.pf .stats{margin-top:16px;border:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr)}
.pf .stats div{padding:11px 4px;text-align:center;border-right:1px solid var(--line);border-bottom:0}
.pf .stats div:last-child{border-right:0}
.pf .stats b{display:block;font-size:26px;line-height:1}
.pf .stats div:first-child b{color:var(--mkt)}
.pf .stats small{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.pf .bshelf{margin-top:16px}
.muted.pad,p.pad{padding:18px 0;font-size:13.5px;line-height:1.5}
/* The groups somebody is willing to say they are in, each with the run inside it. */
.gchips{display:flex;gap:7px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.gchip{background:none;border:1px solid var(--line);padding:6px 11px;display:flex;align-items:baseline;gap:6px;font-size:12.5px;font-weight:700;border-radius:0;white-space:normal;text-align:left}
.gchip em{font-style:normal;color:var(--muted);font-weight:600}
.ptabs{display:flex;margin-top:18px;border-top:1px solid var(--line)}
.ptabs span{flex:1;text-align:center;padding:11px 0 9px;border-bottom:2px solid var(--mk);font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
/* The grid. Square tiles, hairline gaps, the first frame and what the day was worth. */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:2px 0 0;margin:0 -18px}
.tile{position:relative;aspect-ratio:1;background:#0b0c0e;overflow:hidden;padding:0;border-radius:0}
.tile .proof{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;background:#0b0c0e}
.tile b{position:absolute;left:5px;bottom:4px;z-index:2;color:#fff;font-family:Oswald,system-ui,sans-serif;font-weight:600;
  font-size:11.5px;letter-spacing:.02em;text-shadow:0 1px 6px rgba(0,0,0,.85)}
/* The eye on a tile of yours that other people can see. Bottom right, opposite the number,
   so a grid of them reads as one column of figures and one column of marks. */
.tile .seen{position:absolute;right:4px;bottom:4px;z-index:2;width:15px;height:15px;display:block;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.7))}
.tile .seen svg{width:100%;height:100%;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pad.small{font-size:12.5px;line-height:1.45}
.pad.small svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;vertical-align:-2px}
.tile .pl{position:absolute;right:5px;top:5px;z-index:2;width:13px;height:13px;fill:#fff;opacity:.92;
  filter:drop-shadow(0 1px 3px rgba(0,0,0,.7))}
.tile:active{opacity:.75;transform:none}
/* A face with no story behind it still opens something, so it still gives under the thumb. */
.rg.none{background:none;box-shadow:none;padding:0}
.post .head .who{background:none;padding:0;border-radius:0;font-weight:800;font-size:14.5px;line-height:1.2;color:var(--text);display:block;text-align:left;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.post .head .who:active{opacity:.5}
/* One post on its own, because a tile can be from a group this account is not in. */
#one{position:fixed;inset:0;z-index:65;background:var(--bg);overflow-y:auto;animation:slidein .28s cubic-bezier(.32,.72,0,1);will-change:transform}
#one[hidden]{display:none}
@keyframes slidein{from{opacity:.4;transform:translateX(26px)}}
.onebar{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);
  padding:calc(8px + env(safe-area-inset-top)) 8px 8px}
.onebar .backx{margin:0 0 0 6px}           /* the bar already has the padding the screen version needs */
.onewrap{max-width:600px;margin:0 auto;padding-bottom:calc(30px + env(safe-area-inset-bottom))}
/* ---- talking to each other ----
   The icon top right of the feed, where every app that has one puts it. */
.hdr .top .chatbtn{position:relative;background:none;padding:4px;color:var(--text);line-height:0}
.hdr .top .chatbtn svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linejoin:round}
.hdr .top .chatbtn i{position:absolute;right:-3px;top:-3px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;
  background:var(--mk);color:var(--onmk);font-style:normal;font-size:10.5px;line-height:17px;text-align:center}
/* The list. One line each, and the ones with something waiting read as waiting. */
.crow{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:11px 14px;background:none;
  color:var(--text);border-bottom:1px solid var(--line);border-radius:0}
/* gav, not gr: gr is the growing middle of the row, and an avatar given flex:1 is an
   ellipse with a letter in it. */
/* A group's picture, where a person's would be. The mark colour rather than ink, so the two
   are told apart at a glance in a list that holds both. */
.av.gav{background:var(--mk);color:var(--onmk)}
/* The picture beside the name, on the card in the list and at the top of the group. */
.ghead{display:flex;align-items:center;gap:12px}
.ghead h2{flex:1;min-width:0}
.ghead.big{gap:14px;margin-bottom:12px}
.ghead.big b{display:block;font-size:19px;font-weight:800;line-height:1.2}
.ghead.big span{font-size:13px}
.crow .gr{flex:1;min-width:0}
.crow b{display:block;font-size:14.5px;font-weight:800}
.crow .gr > span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow.un .gr > span{color:var(--text);font-weight:600}
.crow .rt{flex:none;text-align:right}
.crow .rt em{display:block;font-style:normal;font-size:11.5px;color:var(--muted);margin-bottom:5px}
.crow .rt i{display:inline-block;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--mk);
  color:var(--onmk);font-style:normal;font-size:12px;line-height:20px;text-align:center}
/* One conversation. */
/* Padded past the notch like every other header: the status bar is translucent and the page
   runs under it, so a bar at top:0 with 12px of padding puts the name and the way back
   under the clock. Sticky, so it is there however far up the conversation you have read. */
.cbar{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--line);
  flex:none;background:var(--bg)}
.cbar .backx{margin:0}

.cbar .nm{min-width:0}
.cbar .nm b{display:block;font-size:15.5px;font-weight:800}
.cbar .nm span{font-size:11.5px;color:var(--muted)}
/* A conversation is read from the bottom, so a short one sits at the bottom rather than
   floating at the top of an empty screen. */
/* The one thing on this screen that scrolls. A conversation is a column the height of the
   screen — the bar, the lines, the box — and only the lines move, which is how every chat
   is built and the reason none of it needs to be sticky or fixed: nothing here has to hold
   still against a page that is moving, because the page does not move. That matters most on
   the way out — a sticky bar stops sticking the moment its screen is transformed or lifted
   into the ghost, and jumps to wherever it sits in the flow. margin-top:auto on the first
   line keeps a short conversation at the bottom without justify-content:flex-end, which
   would make the top of a long one unreachable. */
.msgs{padding:14px 12px 12px;display:flex;flex-direction:column;gap:3px;flex:1;min-height:0;
  overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.msgs > :first-child{margin-top:auto}
.cday{align-self:center;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.cwho{font-size:11.5px;font-weight:800;color:var(--muted);margin:12px 0 3px 6px;align-self:flex-start}
.m{position:relative;max-width:78%;display:flex;align-items:flex-end;gap:4px}
.m.them{align-self:flex-start}
.m.me{align-self:flex-end;flex-direction:row-reverse}
.m .say{display:block;padding:9px 13px;font-size:15px;line-height:1.4;text-align:left;border-radius:16px;
  white-space:pre-wrap;overflow-wrap:anywhere}
.m.them .say{background:var(--soft);color:var(--text);border-bottom-left-radius:4px}
.m.me .say{background:var(--mk);color:var(--onmk);border-bottom-right-radius:4px}
.m.pending{opacity:.55}
.m .drop{background:none;color:var(--muted);font-size:12px;padding:4px;opacity:0;flex:none}
.m:hover .drop{opacity:1}
/* Reactions hang off the bottom corner, the way every chat does them. */
.m .mrx{position:absolute;bottom:-10px;display:flex;gap:3px;z-index:2}
.m.them .mrx{left:10px}
.m.me .mrx{right:10px}
.m .mrx button{display:flex;align-items:center;gap:2px;background:var(--card);border:1px solid var(--line);
  border-radius:999px;padding:1px 6px 2px;font-size:12.5px;line-height:1.3;color:var(--text)}
.m .mrx button.mine{border-color:var(--mk)}
.m .mrx button b{font-family:Oswald,system-ui,sans-serif;font-weight:600;font-size:11px;color:var(--muted)}
/* Wider than the bubble it hangs off, and allowed to be: a tray clipped to a short message
   is four answers and a cut edge. Everything behind the + scrolls sideways in place. */
.m .reactpick.all{max-width:min(86vw,320px);overflow-x:auto;overscroll-behavior-x:contain;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
.m .reactpick.all::-webkit-scrollbar{display:none}
.m .reactpick .more{font-size:17px;font-weight:800;color:var(--muted);min-width:26px}
.m .reactpick{position:absolute;bottom:100%;margin-bottom:6px;z-index:6;display:flex;gap:2px;background:var(--sheet);
  border:1px solid var(--line);border-radius:999px;padding:4px 6px;box-shadow:0 10px 26px -8px rgba(0,0,0,.35)}
.m.them .reactpick{left:0}
.m.me .reactpick{right:0}
.m .reactpick button{background:none;padding:3px 4px;font-size:21px;line-height:1}
/* The composer sits over the screen rather than at the end of it, so it is where your
   thumb already is however far up the conversation you have read. */
/* Follows the viewport the way the tab bar does, and rides the keyboard up on --kb. One
   expression, with nothing in it that flips on focus alone: a box that moves the moment a
   field is blurred moves out from under the finger that is pressing Send, and a press and
   a release on two different places is not a click. */
/* In the flow at the foot of the column rather than pinned over it. The column is the
   height of the screen less the keyboard, so the box sits above the keyboard because the
   column ends there, not because anything worked out where the keyboard is. */
.csend{flex:none;margin:8px 12px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:8px;padding:8px;
  background:var(--card);border:1px solid var(--line)}
.csend .emo{width:34px;height:34px;background:var(--soft);display:grid;place-items:center;flex:none;padding:0}
.csend .emo svg{width:19px;height:19px;fill:none;stroke:var(--muted);stroke-width:1.9}
.csend input{flex:1;min-width:0;padding:9px 12px;border:1px solid var(--line);background:var(--card);color:var(--text);
  font:inherit;font-size:16px;border-radius:0}
.csend button.primary{background:none;color:var(--mkt);font-weight:800;font-size:15px;padding:6px 6px;flex:none}
.cemoji{flex:none;margin:0 12px}
main.chatting{padding:0;min-height:0;height:calc(100vh - var(--kb,0px));height:calc(100dvh - var(--kb,0px));
  display:flex;flex-direction:column;overflow:hidden}
/* The way into a group's own chat, on the group screen. */
.chatrow{display:flex;align-items:center;justify-content:center;gap:8px}
.chatrow svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linejoin:round}
.chatrow i{font-style:normal;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--mk);
  color:var(--onmk);font-size:11px;line-height:19px}
.list .row .msg{display:inline-flex;align-items:center;gap:5px;line-height:0}
.list .row .msg svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linejoin:round}
.list .row .msg i{font-style:normal;font-size:11px;line-height:1;color:var(--mkt)}
/* ---- questioning somebody's proof ----
   The flag is an outline until somebody uses it, and then it is filled: the post itself
   says a question has been asked about it rather than hiding that on a page of its own. */
.acts .flg svg{fill:none}
.acts .flg.on{color:var(--mkt)}
.acts .flg.on svg{fill:currentColor;stroke:currentColor}
/* A line across the bottom of the post saying where that question got to. Your own post
   carries no flag button and very much needs this. */
.fstrip{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:10px 14px;background:var(--soft);
  color:var(--text);border-top:1px solid var(--line);font-size:13px;line-height:1.35;border-radius:0}
.fstrip svg{width:17px;height:17px;flex:none;fill:currentColor;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}
.fstrip span{flex:1;min-width:0;font-weight:600}
.fstrip b{font-weight:800}
.fstrip em{font-style:normal;flex:none;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.fstrip.bad{background:#fdeef0;color:#8a1f30}
.fstrip.good{background:var(--mktint);color:var(--mkt)}
:root[data-theme=dark] .fstrip.bad{background:#2a1418;color:#ff8ea0}
/* The way in, in the feed, because it is a thing with a clock on it rather than a place
   to browse. Not there at all when nothing is running, which is most days. */
.fbar-chip{display:flex;align-items:center;gap:10px;width:calc(100% - 28px);margin:12px 14px 0;padding:12px 13px;
  background:var(--text);color:var(--bg);text-align:left;font-size:13.5px;font-weight:700;border-radius:0}
.fbar-chip svg{width:19px;height:19px;flex:none;fill:currentColor;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}
.fbar-chip span{flex:1;min-width:0}
.fbar-chip em{font-style:normal;flex:none;font-family:Oswald,system-ui,sans-serif;font-weight:600;font-size:13.5px;
  font-variant-numeric:tabular-nums;color:var(--g2)}
.fbar-chip.mine{background:#8a1f30;color:#fff}
.fbar-chip.mine em{color:#ffc9d2}
/* The screen. A bar with the clock in it, because how long is left is the whole question. */
/* The clock is the whole point of this screen, so the bar it is on stays put while the rest
   scrolls — the same as a conversation keeps its name and its way back. */
.fbar{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--line)}
.fbar h2{margin:0;font-size:17px;font-weight:800}
.fbar .backx{margin:0}
.fbar .clock{margin-left:auto;display:flex;align-items:center;gap:6px;background:var(--text);color:var(--bg);padding:6px 10px}
.fbar .clock svg{width:15px;height:15px;stroke:var(--g2);fill:none;stroke-width:2.2;stroke-linecap:round}
.fbar .clock b{font-size:14px;font-variant-numeric:tabular-nums}
.fbar .shut{margin-left:auto;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.verdict{padding:24px 18px 20px;background:var(--text);color:var(--bg)}
.verdict .sec{margin:0 0 6px;color:var(--muted)}
.verdict b{display:block;font-family:Oswald,system-ui,sans-serif;font-weight:600;font-size:38px;line-height:1.05;
  letter-spacing:-.01em;text-transform:uppercase;margin-bottom:8px}
.verdict p{font-size:14px;line-height:1.5;opacity:.72}
.verdict.bad{background:#8a1f30;color:#fff}
/* On this one screen the clip is evidence rather than the thing you came to watch, so it
   is capped: the reason and the two answers have to be reachable without hunting for them,
   and a 4:5 card plus a verdict is already more than a phone shows at once. */
.fbar ~ .post .reel,.verdict + .post .reel{aspect-ratio:auto;height:min(42vh,340px)}
.why{padding:14px;border-bottom:1px solid var(--line)}
.why .head{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.why .head b{font-size:13.5px;font-weight:800}
.why .head span{font-size:12px;color:var(--muted)}
.why p{font-size:15px;line-height:1.5}
.ask{padding:16px 14px 8px}
.ask b{display:block;font-size:16px;font-weight:800;margin-bottom:3px}
.ask span{font-size:13px;color:var(--muted)}
.votes{display:flex;gap:10px;padding:12px 14px 14px}
.votes button{flex:1;padding:15px 8px;font-size:14.5px;font-weight:800;background:var(--soft);color:var(--text);
  display:flex;flex-direction:column;align-items:center;gap:7px;line-height:1.2;border-radius:0}
.votes button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linejoin:round}
.votes button.on{background:var(--mk);color:var(--onmk)}
.tally{padding:0 14px calc(28px + env(safe-area-inset-bottom))}
.tally .track{height:6px;background:var(--line);overflow:hidden}
.tally .track i{display:block;height:100%;background:var(--mk)}
.tally .rows{padding:4px 0}
.tally .rw{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line)}
.tally .rw:last-child{border-bottom:0}
.tally .rw b{font-size:14px;font-weight:700;flex:1;min-width:0}
.tally .rw em{font-style:normal;font-size:12.5px;font-weight:800;color:var(--mkt);flex:none}
.tally .rw em.no{color:var(--muted)}
.fine{font-size:12px;line-height:1.45;margin-top:10px}
/* The list, when more than one is running. */
.flist{padding:2px 0}
.frow{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:10px 14px;background:none;
  color:var(--text);border-bottom:1px solid var(--line);border-radius:0}
.frow .th{width:44px;height:55px;flex:none;background:#0b0c0e;overflow:hidden;display:block}
.frow .th img,.frow .th video{width:100%;height:100%;object-fit:cover;display:block}
.frow .gr{flex:1;min-width:0}
.frow b{display:block;font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow em{display:block;font-style:normal;font-size:12.5px;color:var(--muted);margin-top:2px}
.frow .tag{flex:none;font-size:11.5px;font-weight:800;padding:5px 8px;background:var(--soft);color:var(--muted)}
.frow .tag.live{color:var(--text);font-variant-numeric:tabular-nums}
.frow .tag.bad{background:#fdeef0;color:#8a1f30}
.frow .tag.good{background:var(--mktint);color:var(--mkt)}
/* The chip naming the post in the sheet that asks why. */
.fchip{display:flex;align-items:center;gap:9px;margin:16px 0 14px;padding:9px 10px;background:var(--soft)}
.fchip b{display:block;font-size:13px;font-weight:800}
.fchip em{font-style:normal;font-size:12px;color:var(--muted)}
#dlg textarea{width:100%;padding:12px;border:1px solid var(--line);background:var(--card);color:var(--text);
  font:inherit;font-size:16px;resize:none;border-radius:0}
/* ---- settings ---- */
.sec{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 18px 7px}
/* A switch on its own does not say what it switches, so the list stays either way. */
.pushabout{padding:12px 18px 2px}
.pushabout .muted{font-size:12.5px;line-height:1.45}
.pushabout .about{margin:8px 0;padding:0 0 0 18px;border-top:0}
.legal{padding:0 18px 34px;max-width:42rem;text-align:left}
.legal h3{font-size:15px;margin:22px 0 2px}
.legal p,.legal li{color:var(--muted);font-weight:600;font-size:13.5px;line-height:1.55;margin:8px 0}
.legal ul{margin:8px 0;padding:0 0 0 18px}
.legal b{color:var(--text)}
.legal a{color:var(--mkt)}
.legal .stamp{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin:0}
.legallinks{text-align:center;margin-top:16px}
.legallinks button{background:none;color:var(--muted);font-weight:800;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;padding:4px 7px}
.agree{text-align:left;margin-top:18px;align-items:flex-start}
.agree span{font-weight:600;font-size:13px;line-height:1.45;color:var(--muted)}
.list{border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.li{display:flex;align-items:center;gap:12px;width:100%;padding:14px 18px;background:none;border-radius:0;
  border-bottom:1px solid var(--line);text-align:left;font:inherit;color:var(--text);white-space:normal}
.li:last-child{border-bottom:0}
.li svg{width:20px;height:20px;fill:none;stroke:var(--muted);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-size:14.5px;font-weight:700}
.li .t em{font-style:normal;display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin-top:1px;overflow-wrap:anywhere}
.li .go{color:var(--muted);font-size:17px;flex:none}
.li.danger{color:#d1344f}
.li.danger svg{stroke:#d1344f}
.sw{width:42px;height:25px;border-radius:999px;background:var(--todo);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:2.5px;left:2.5px;width:20px;height:20px;border-radius:50%;background:#fff;
  transition:transform .22s cubic-bezier(.2,.8,.2,1);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw.on{background:var(--mk)}
.sw.on::after{transform:translateX(17px)}
/* The one new line on the post form reads as a choice, not fine print. */
.chk{display:flex;gap:11px;align-items:flex-start;padding:13px;border:1px solid var(--line)}
.chk .t b{display:block;font-size:14px;font-weight:800;color:var(--text)}
.chk .t em{font-style:normal;display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin-top:2px;line-height:1.4}

/* What you do about a post, under the clip and directly above what people said. */
.acts{position:relative;display:flex;align-items:center;gap:18px;padding:10px 14px 2px}
.acts button{background:none;padding:0;display:flex;align-items:center;gap:6px;color:var(--text);font-size:13.5px;font-weight:800}
.acts svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.acts .lk.on{color:#ff3b5c}
.acts .lk.on svg{fill:#ff3b5c;stroke:#ff3b5c;animation:heart .35s cubic-bezier(.2,.8,.2,1)}
@keyframes heart{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.acts .cc{margin-left:auto;font-size:13px;font-weight:700;color:var(--muted)}
/* Over the row it was opened from, not over the clip. */
.reactpick{position:absolute;left:8px;bottom:calc(100% - 6px);z-index:5;display:flex;gap:2px;padding:6px;
  background:var(--card);border:1px solid var(--line);box-shadow:0 10px 26px -12px rgba(11,12,14,.5)}
.reactpick button{background:none;padding:5px 7px;font-size:22px;line-height:1}
.reactpick button:active{background:var(--soft)}
/* The replies, and a box that is always ready. */
.cmts{padding:6px 14px 12px}
.clist .c.pending{animation:rise .22s cubic-bezier(.2,.7,.2,1)}
.clist{padding:2px 0 6px}
.clist .c{align-items:flex-start;gap:9px}
.clist .c b{display:block;font-size:13px}
.clist .c span{display:block;color:var(--text);font-weight:500;font-size:14px}
.emoji{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;padding:8px 0 0}
.emoji[hidden]{display:none}
.emoji button{background:none;padding:6px 0;font-size:21px;line-height:1}
.emoji button:active{background:var(--soft)}
/* A clip that cannot be played looks exactly like one that is merely slow: a black
   rectangle with a play button that does nothing. This says which it is. */
.reel .bust{position:absolute;inset:0;z-index:3;display:none;flex-direction:column;gap:12px;
  align-items:center;justify-content:center;padding:24px;text-align:center;background:rgba(0,0,0,.72)}
.reel.bust .bust{display:flex}
.reel.bust .play,.reel.bust .proof{display:none}
.reel .bust p{font-size:14px;font-weight:700;line-height:1.4}
.reel .bust button{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.5);padding:8px 16px}
.c{display:flex;gap:8px;padding:7px 0;font-size:14px;align-items:flex-start}
.c b{font-weight:800;flex:none}
.c span{color:var(--muted);flex:1;font-weight:500}
.c .x{background:none;padding:0 4px;color:var(--muted);font-weight:600;font-size:13px}
/* A heart on a reply, the same gesture as the one on the post, at the size of a reply. */
.c .clk{background:none;padding:2px 3px;flex:none;display:flex;align-items:center;gap:3px;color:var(--muted);align-self:flex-start}
.c .clk svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.c .clk i{font-style:normal;font-size:11.5px;font-weight:800;font-variant-numeric:tabular-nums}
.c .clk.on{color:#ff3b5c}
.c .clk.on svg{fill:#ff3b5c;stroke:#ff3b5c;animation:heart .35s cubic-bezier(.2,.8,.2,1)}
.c .clk:active{opacity:1;transform:scale(.85)}
/* Arrived here from a notification: say which reply it was, then stop saying it. */
.clist .c.found{background:var(--mktint);box-shadow:0 0 0 6px var(--mktint);animation:foundit 2.2s ease-out}
@keyframes foundit{0%,55%{background:var(--mkveil);box-shadow:0 0 0 6px var(--mkveil)}}
.cin{display:flex;gap:8px;margin-top:4px;align-items:center}
.cin input{padding:10px 12px}          /* 16px, like every field: smaller and iOS zooms in */
.cin button{padding:0 14px}
/* A word, not a button. The box around it was doing nothing the word was not already
   doing, and the padding is what keeps the tap target the size of a thumb without it. */
.cin button.primary{background:none;color:var(--mkt);padding:9px 6px;font-size:17px;line-height:1.3}
.cin button.primary:active{opacity:.55;transform:none}
.cin .emo{background:var(--soft);padding:0;width:38px;height:38px;flex:none;display:grid;place-items:center;border-radius:0}
.cin .emo svg{width:21px;height:21px;fill:none;stroke:var(--muted);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
/* bubble bar */
/* iOS keeps a fixed element pinned to the layout viewport, which is not what is on
   screen: while the URL bar collapses or a keyboard comes up the two differ, and the bar
   slides around on its own. --vvb is the gap between them, kept up to date from
   visualViewport, so the bar stays put against the bottom edge people can actually see. */
/* Moving between screens. Both layers are position:fixed, so a screen sliding a whole
   width sideways can never widen the page or move where the document is scrolled to. The
   ghost is a still photograph of a screen — its innerHTML copied into a fixed box, pulled
   up by however far the real one was scrolled, so it shows the slice that was on screen.
   Nothing in it is live for the third of a second it exists. */
#ghost,#dim{position:fixed;inset:0;pointer-events:none}
#ghost[hidden],#dim[hidden]{display:none}
#ghost{overflow:hidden;background:var(--bg);will-change:transform}
#ghost .inner{position:absolute;left:0;right:0;max-width:600px;margin:0 auto}
#dim{background:#06100b;opacity:0;will-change:opacity}
/* Promoted to its own layer for the length of the move rather than on the first frame of
   it, which is the hitch at the start of a drag: the browser deciding, mid-gesture, that a
   screen it was painting in place now needs compositing. */
:root.moving #app{position:relative;will-change:transform}
:root.moving,:root.moving body{overflow-x:clip}
/* And from the finger going down, before it has moved at all: a layer made on the first
   frame of a drag is a hitch on the first frame of a drag. Cleared when the finger lifts. */
:root.grabbing #app,:root.grabbing #one{will-change:transform}
/* Sideways belongs to the app, so a drag back to the feed is not eaten as a page gesture.
   The one strip that scrolls sideways of its own accord keeps that. */
#app{touch-action:pan-y}
.stories{touch-action:pan-x}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom) + var(--vvb, 0px));width:min(92vw,400px);background:var(--barbg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:999px;display:grid;grid-template-columns:1fr 1fr auto 1fr 1fr;align-items:center;padding:6px;box-shadow:0 12px 30px -10px rgba(0,0,0,.35);z-index:6}
/* Put away for a conversation, on the same curve and over the same time as the screen that
   is arriving. Popping out of existence over a screen still sliding in read as a fault. */
.bar{transition:opacity .34s cubic-bezier(.32,.72,0,1),transform .34s cubic-bezier(.32,.72,0,1)}
.bar.away{opacity:0;transform:translate(-50%,28px);pointer-events:none}
.bar button{background:none;padding:7px 0 5px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:700;color:var(--muted);border-radius:999px}
.bar button{transition:color .2s,transform .12s cubic-bezier(.2,.7,.2,1)}
.bar button.on{color:var(--text);background:none}
/* One underline for the whole bar, so it slides to the tab you chose rather than
   blinking out under one and in under the next. */
.bar .ind{position:absolute;bottom:5px;width:22px;height:2px;background:var(--mk);left:var(--x,0px);opacity:var(--o,0);
  transition:left .28s cubic-bezier(.32,.72,0,1),opacity .2s}
:root[data-theme=dark] .bar button.on{color:var(--text)}
.bar button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bar .add{width:50px;height:50px;border-radius:50%;background:var(--mk);color:var(--onmk);font-size:28px;font-weight:800;display:grid;place-items:center;margin:0 6px;padding:0;line-height:1;box-shadow:0 8px 20px -8px rgba(11,12,14,.4)}
.bar .add svg{width:26px;height:26px;stroke:var(--onmk);stroke-width:2.5}
.bar .add:disabled{opacity:.4}
.bar[hidden]{display:none}
/* A keyboard is up. No app puts its tab bar on top of one, and here it would sit over
   the box being typed into. */
:root.keys .bar{display:none}
dialog{background:var(--sheet);color:var(--text);border:0;border-radius:24px 24px 0 0;width:100%;max-width:100%;
  margin:auto 0 var(--kb, 0px);max-height:calc(100dvh - var(--kb, 0px) - 24px);overflow:auto;
  padding:20px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.2)}
dialog::backdrop{background:rgba(18,33,43,.5);backdrop-filter:blur(2px)}
/* A sheet comes up from the bottom and goes back the way it came; a grab handle says so. */
#dlg::before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:var(--line);margin:-6px auto 14px}
#dlg[open]{animation:sheet .42s cubic-bezier(.32,.72,0,1)}
#dlg[open]::backdrop{animation:fade .3s}
#dlg.out{animation:sheetout .24s cubic-bezier(.4,0,1,1) forwards}
#dlg.out::backdrop{animation:fadeout .24s forwards}
@keyframes sheet{from{transform:translateY(100%)}}
@keyframes sheetout{to{transform:translateY(100%)}}
@media(min-width:640px){
  #dlg[open]{animation:popin .26s cubic-bezier(.2,.8,.2,1)}
  #dlg.out{animation:popout .18s ease-in forwards}
  #dlg::before{display:none}
}
@keyframes popout{to{opacity:0;transform:scale(.96)}}
@keyframes fade{from{opacity:0}}
@keyframes fadeout{to{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@keyframes popin{from{opacity:0;transform:scale(.82) translateY(6px)}}
/* Up and out from the corner it belongs to, rather than appearing. Long enough to be a
   movement and short enough that the answer is never waiting on it. */
.reactpick{animation:popin .19s cubic-bezier(.2,.9,.25,1);transform-origin:left bottom}
.m.me .reactpick{transform-origin:right bottom}
.reactpick button{transition:transform .12s cubic-bezier(.2,.8,.2,1)}
.reactpick button:active{transform:scale(1.35)}
.emoji:not([hidden]){animation:rise .18s cubic-bezier(.2,.7,.2,1)}
#story:not([hidden]),#make:not([hidden]){animation:fade .2s}
#story:not([hidden]) .pane{animation:popin .24s cubic-bezier(.2,.8,.2,1)}
#party:not([hidden]){animation:fade .2s}
#party:not([hidden]) .card{animation:spring .5s cubic-bezier(.2,.8,.2,1)}
@keyframes spring{0%{opacity:0;transform:scale(.8)}60%{opacity:1;transform:scale(1.03)}100%{transform:none}}
#err:not([hidden]){animation:rise .22s cubic-bezier(.2,.7,.2,1)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0s!important;transition-duration:0s!important}}
dialog h2{font-size:20px;margin-bottom:2px}
@media(min-width:640px){dialog{border-radius:24px;width:min(92vw,460px);margin:auto}}
/* welcome + auth */
.welcome{min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--text);border-top:6px solid var(--mk);display:flex;flex-direction:column;padding:calc(28px + env(safe-area-inset-top)) 24px calc(28px + env(safe-area-inset-bottom))}
.welcome .mark svg{width:60px;height:60px}
.welcome h1{font-family:Oswald,system-ui,sans-serif;margin:auto 0 0;font-size:46px;font-weight:600;letter-spacing:0;line-height:.98;text-transform:uppercase;text-wrap:balance}
.welcome p{color:var(--muted);font-weight:600;font-size:17px;line-height:1.45;margin:16px 0 26px;max-width:32ch}
.welcome .primary{width:100%;padding:16px;border-radius:0;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.welcome .ghost{color:var(--muted);align-self:center;margin-top:10px;font-weight:800;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.auth{max-width:400px;margin:8vh auto 0;padding:env(safe-area-inset-top) 18px 0;text-align:center}
.auth .word{display:inline-flex;align-items:center;gap:10px;font-family:Oswald,system-ui,sans-serif;font-weight:600;font-size:32px;letter-spacing:.08em;text-transform:uppercase;color:var(--text)}
.auth .word svg{width:44px;height:44px;border-radius:11px}
.auth h2{font-size:22px;margin:18px 0 4px}
.auth p{color:var(--muted);font-weight:600;margin:0 0 18px}
.auth .card{margin:0;text-align:left}
.auth .card .primary{width:100%;margin-top:18px;padding:13px}
.auth .switch{margin-top:14px;color:var(--muted);font-weight:600}
.auth .switch button{padding:0 4px;background:none;color:var(--mkt)}
.back{margin:12px 18px 0}
/* The old one was a muted text link in the corner and people did not find it. This is a
   button shaped like a button, with the arrow pointing the way it goes. */
.backx{margin:12px 0 0 14px;width:38px;height:38px;padding:0;border-radius:50%;display:grid;place-items:center;
  background:var(--sheet);color:var(--text);border:1px solid var(--line);box-shadow:0 2px 10px -2px rgba(11,12,14,.22)}
/* On its own at the top of a screen — a profile, the chats, the flags — it is the first thing
   under the notch, and the notch is not a place a button can be pressed. */
#app > .backx{margin-top:calc(12px + env(safe-area-inset-top))}
.backx svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.backx:active{transform:scale(.93)}
/* recording in the app */
#cam{position:fixed;inset:0;width:100%;max-width:100%;height:100%;max-height:100%;margin:0;padding:0;
  border:0;border-radius:0;background:#000;box-shadow:none;display:flex;flex-direction:column;overflow:hidden}
#cam:not([open]){display:none}
#cam::backdrop{background:#000}
#campre{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
/* The front camera is shown mirrored, the way every phone camera shows it — you are
   looking at yourself, not at a picture of yourself. What is recorded is not mirrored. */
#campre.mirror{transform:scaleX(-1)}
.camtop{position:relative;z-index:2;display:flex;align-items:center;gap:10px;
  padding:calc(12px + env(safe-area-inset-top)) 16px 0}
.camtop button{background:rgba(0,0,0,.45);color:#fff;border-radius:999px;width:38px;height:38px;padding:0;font-size:17px;
  display:grid;place-items:center;flex:none}
.camtop button svg{width:19px;height:19px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.camtop button.on{background:var(--mk)}
.camtop button.on svg{stroke:var(--onmk)}
/* display:grid above, and display on an SVG path, both beat the plain hidden attribute,
   so a control meant to be absent sits there looking live. Said outright instead. */
.camtop button[hidden],#micoff[hidden]{display:none}
.camtop .rec{flex:1;text-align:center;color:#fff;font-weight:800;font-family:Oswald,system-ui,sans-serif;font-size:15px;
  text-shadow:0 1px 6px rgba(0,0,0,.6)}
.camtop .rec b{display:inline-block;width:9px;height:9px;border-radius:50%;background:#ff3b30;margin-right:7px;
  vertical-align:middle;animation:blink 1.1s steps(2,end) infinite}
@keyframes blink{50%{opacity:0}}
.camtop .rec small{font-weight:700;opacity:.65;font-size:13px}
/* Timer, shutter, flip — the shutter dead centre whatever sits beside it. */
.cambot{position:relative;z-index:2;margin-top:auto;display:grid;grid-template-columns:1fr auto 1fr;
  align-items:center;justify-items:center;gap:10px;padding:0 20px calc(28px + env(safe-area-inset-bottom))}
.shutter{width:74px;height:74px;border-radius:50%;padding:0;background:rgba(255,255,255,.25);
  border:4px solid #fff;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.shutter.on{background:var(--mk);border-radius:18px;width:58px;height:58px}
.shutter[disabled]{opacity:.45}
.camaux{width:54px;height:54px;border-radius:50%;padding:0;background:rgba(0,0,0,.45);color:#fff;
  display:grid;place-items:center;font-weight:800;font-size:13px;border:1px solid rgba(255,255,255,.25)}
.camaux svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.camaux.on{background:var(--mk);border-color:transparent;color:var(--onmk)}
.camaux.on svg{stroke:var(--onmk)}
.camaux[hidden]{display:none}
.camaux[disabled]{opacity:.35}
/* Pick the days. Seven of anything on a phone wants to be a row of taps, not a menu. */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.days label{display:block;position:relative}
.days input{position:absolute;opacity:0;width:100%;height:100%;margin:0;left:0;top:0}
.days span{display:grid;place-items:center;height:40px;border-radius:0;border:1px solid var(--line);
  background:var(--card);font-weight:800;font-size:13px;color:var(--muted)}
.days input:checked + span{background:var(--teal);border-color:var(--teal);color:var(--onteal)}
#gdays[hidden]{display:none}
/* Which of the two the shutter takes. Sits where a phone camera puts it: just above it. */
.cammode{position:absolute;left:0;right:0;bottom:calc(112px + env(safe-area-inset-bottom));z-index:2;
  display:flex;justify-content:center;gap:6px}
.cammode button{background:rgba(0,0,0,.45);color:rgba(255,255,255,.7);border-radius:999px;padding:7px 16px;font-size:13px;font-weight:800}
.cammode button.on{background:#fff;color:#111}
.cammode[hidden]{display:none}
.camrev img{flex:1;min-height:0;width:100%;object-fit:contain;background:#000}
.camrev img[hidden],.camrev video[hidden]{display:none}
.shutter.pic{background:#fff}
/* cropping a profile picture */
#crop{position:fixed;inset:0;width:100%;max-width:100%;height:100%;max-height:100%;margin:0;border:0;border-radius:0;
  background:#0b0c0e;color:#fff;box-shadow:none;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:18px;padding:calc(16px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));overflow:hidden}
#crop:not([open]){display:none}
#crop::backdrop{background:#000}
.crophow{color:#fff;opacity:.6;font-size:13px;font-weight:700;text-align:center;margin:0;max-width:28ch}
.cropbox{position:relative;width:min(78vw,320px);aspect-ratio:1;overflow:hidden;flex:none;touch-action:none;cursor:grab}
.cropbox img{position:absolute;left:50%;top:50%;transform-origin:0 0;max-width:none;user-select:none;-webkit-user-drag:none}
