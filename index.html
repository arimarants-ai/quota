// Canvas rather than a heap of divs: it is a few hundred moving things for two seconds and
// then nothing at all.
function confetti(cv) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const dpr = Math.min(2, devicePixelRatio || 1), W = cv.offsetWidth, H = cv.offsetHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  const g = cv.getContext('2d'); g.scale(dpr, dpr);
  const cols = ['#0b5a34', '#12934f', '#1db061', '#2fd36f', '#48ec8b', '#0b0c0e'];
  const bits = Array.from({length: 140}, () => ({
    x: Math.random() * W, y: -20 - Math.random() * H * .6,
    w: 5 + Math.random() * 6, h: 8 + Math.random() * 8,
    vy: 2 + Math.random() * 3.4, vx: -1.2 + Math.random() * 2.4,
    a: Math.random() * 6.3, va: -.18 + Math.random() * .36,
    c: cols[(Math.random() * cols.length) | 0],
  }));
  const t0 = performance.now();
  (function frame(t) {
    const life = t - t0;
    if (life > 3200 || $('#party').hidden) return g.clearRect(0, 0, W, H);
    g.clearRect(0, 0, W, H);
    g.globalAlpha = life > 2200 ? Math.max(0, 1 - (life - 2200) / 1000) : 1;
    for (const b of bits) {
      b.x += b.vx; b.y += b.vy; b.a += b.va; b.vy += .045;
      g.save(); g.translate(b.x, b.y); g.rotate(b.a);
      g.fillStyle = b.c; g.fillRect(-b.w / 2, -b.h / 2, b.w, b.h); g.restore();
    }
    requestAnimationFrame(frame);
  })(t0);
}

// An ordinary spinning wheel, drawn as an SVG so the labels stay crisp and sit along the
// slices. Four colours in rotation, all dark enough to take white text in either theme.
const SLICE = ['#0B0C0E', '#0E6B3C', '#3A4147', '#157F52'];

  // A label runs along its slice, so the room it has is the radius minus the hub, not the
  // width of the wheel. Sizing off that is what keeps long ones inside the rim.
  const size = n > 12 ? 8 : n > 8 ? 9 : 11, room = R - HUB - 10;
  const fits = Math.max(6, Math.floor(room / (size * 0.58)));
  const slices = segs.map((seg, i) => {
    const a0 = i * 360 / n - 90, a1 = (i + 1) * 360 / n - 90;
    const [x0, y0] = pt(a0, R), [x1, y1] = pt(a1, R);
    const d = n === 1 ? `M ${C - R} ${C} a ${R} ${R} 0 1 1 ${R * 2} 0 a ${R} ${R} 0 1 1 ${-R * 2} 0`
      : `M ${C} ${C} L ${x0} ${y0} A ${R} ${R} 0 ${360 / n > 180 ? 1 : 0} 1 ${x1} ${y1} Z`;
    // Labels run along their slice, hub outwards, the way they do on a real wheel. There is
    // no orientation that stays upright: the labels turn with the wheel, so anything picked
    // to look right standing still is upside down once it has spun.
    const a = mid(i), [tx, ty] = pt(a, (HUB + R) / 2);
    const turn = a;
    const text = String(seg);
    const short = text.length > fits ? text.slice(0, fits - 1).trimEnd() + '…' : text;
    return `<path d="${d}" fill="${sliceColour(i, n)}"/>
      <text x="${tx}" y="${ty}" transform="rotate(${turn} ${tx} ${ty})" text-anchor="middle" dominant-baseline="central"
        font-size="${size}" font-weight="800" fill="#fff">${esc(short)}</text>`;
  }).join('');
  return `<svg viewBox="0 0 224 224" class="wheel-face" aria-hidden="true">${slices}
    <circle cx="${C}" cy="${C}" r="${R}" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="3"/>
    <circle cx="${C}" cy="${C}" r="${HUB}" fill="#fff"/></svg>`;
}

// Where the wheel has to stop for slice i to sit under the pointer at the top, plus a few
// whole turns so it looks like a spin rather than a jump.
const restAngle = (i, n, turns = 5) => turns * 360 - ((i + 0.5) * 360 / n);

function wheelBox(segs, id) {
  return `<div class="wheelbox"><div class="pointer"></div>
    <div class="wheel-spin" id="${id}">${wheelSvg(segs)}</div></div>`;
}

async function goSpin(wid, gid) {
  const stage = $('#spinstage');
  if (!stage) return;
  stage.querySelector('button').disabled = true;
  stage.querySelector('button').textContent = 'Spinning…';
  let sp;
  try { sp = await q(sb.rpc('spin', {p_wheel: wid, p_day: today()})); }
  catch (e) { const b = stage.querySelector('button'); if (b) { b.disabled = false; b.textContent = 'Spin'; } return; }
  S.spins = [...S.spins.filter(x => x.id !== sp.id), sp];
  await reveal(sp, gid);
}

// Deciding before the wheel turns is the point: sitting out afterwards would be a way to
// walk away from a result you did not like, and the database refuses it anyway.
async function sitOut(wid, gid) {
  const w = S.wheels.find(x => x.id === wid);
  if (!confirm(`Sit out ${w.name} until ${dayLabel(cycleStart(w, cycleOf(w) + 1))}?\n\nYou can post without spinning it, and nothing counts against you this time. Change your mind and you can still spin it before the cycle is up.`)) return;
  const stage = $('#spinstage');
  if (stage) stage.querySelectorAll('button').forEach(b => b.disabled = true);
  try { await q(sb.rpc('sit_out', {p_wheel: wid, p_day: today()})); }
  catch (e) { if (stage) stage.querySelectorAll('button').forEach(b => b.disabled = false); return; }
  dlg(); await load();
  const g = S.groups.find(x => x.id === gid);
  if (g && dueIn(g).length) return spinDlg(gid);
  openGroup(gid);
}

const wait = ms => new Promise(r => setTimeout(r, ms));

// Reveal the stages one after another: what the challenge is, then how long it runs for.
async function reveal(sp, gid) {
  const stage = $('#spinstage');
  if (!stage) return;
  const results = [...sp.results].sort((a, b) => a.seq - b.seq);
  stage.innerHTML = results.map((r, i) => `<div class="stage${i ? ' later' : ''}" id="st${i}">
    ${r.label ? `<p class="muted stagelabel">${esc(r.label)}</p>` : ''}
    ${wheelBox(r.segs, `sw${i}`)}
    <p class="landed" id="lt${i}"></p></div>`).join('');
  for (let i = 0; i < results.length; i++) {
    const r = results[i], el = $(`#st${i}`), face = $(`#sw${i}`);
    el.classList.remove('later');
    await wait(60);
    face.style.transform = `rotate(${restAngle(r.i, r.segs.length)}deg)`;
    await wait(4200);
    $(`#lt${i}`).textContent = r.kind === 'days' ? daysLine(+r.value) : String(r.value);
    $(`#lt${i}`).classList.add('in');
    await wait(700);
  }
  stage.insertAdjacentHTML('beforeend',
    `<div class="row" style="margin-top:18px"><button class="primary grow" onclick="afterSpin(${gid})">Got it</button></div>`);
}

const daysLine = n => n === 0 ? 'No days — you got off' : n === 1 ? 'On 1 day' : `On ${n} days`;

async function afterSpin(gid) {
  dlg();
  await load();
  // More than one wheel can be due at once; keep going until the group is clear.
  if (dueIn(S.groups.find(x => x.id === gid)).length) return spinDlg(gid);
  openGroup(gid);
}

// ---- recovery codes
// Two things to know about functions.invoke here.
// 1. supabase-js 2.49.4 builds its functions client from the headers fixed at
//    createClient time, which carry the anon key, and never rewrites them when the
//    user signs in. Without passing the token by hand, 'issue' always comes back
//    "Sign in first." even for a signed-in user.
// 2. It collapses every non-2xx into a generic error, so dig out the real message.
async function callRecovery(action, body = {}) {
  const {data: {session}} = await sb.auth.getSession();
  const headers = session ? {Authorization: `Bearer ${session.access_token}`} : undefined;
  const {data, error} = await sb.functions.invoke('recovery', {body: {action, ...body}, headers});
  if (!error) return data;
  let msg = 'Could not reach the server. Check your connection and try again.';
  try { const j = await error.context.json(); if (j && j.error) msg = j.error; } catch (e) {}
  throw new Error(msg);
}
// The one moment the codes exist in readable form. Nothing stores them after this.
function codesDlg(codes, isNew) {
  dlg(`<h2>${isNew ? 'Save your recovery codes' : 'Your new recovery codes'}</h2>
    <p class="muted">These are the only way back into your account if you forget your password. Save them somewhere safe now \u2014 you will not be shown them again.</p>
    <div class="card" style="margin-top:12px"><div class="row wrap" style="gap:8px;font-family:ui-monospace,monospace;font-size:15px">${codes.map(c => `<span class="chip">${esc(c)}</span>`).join('')}</div></div>
    <div class="row" style="margin-top:18px"><button type="button" onclick="copyCodes(${JSON.stringify(JSON.stringify(codes)).replace(/"/g, '&quot;')},this)">Copy all</button><button type="button" class="primary grow" onclick="dlg()">I've saved them</button></div>`);
}
function copyCodes(json, btn) {
  navigator.clipboard.writeText(JSON.parse(json).join('\n')).then(() => { btn.textContent = 'Copied'; }).catch(() => { btn.textContent = 'Copy failed'; });
}

}
async function resetPassword(f) {
  const username = f.username.value.trim().toLowerCase().replace(/^@/, '');
  const code = f.code.value.trim(), password = f.password.value;
  working(f, '\u2026');
  try {
    const {remaining} = await callRecovery('redeem', {username, code, password});
    // Sign straight in rather than making them type the new password again.
    const {error} = await sb.auth.signInWithPassword({email: emailFor(username), password});
    if (error) { S.auth = 'login'; alert('Password changed. Log in with your new password.'); }
    else { S.tab = 'feed'; await load(); alert(`Password changed. ${remaining} recovery ${remaining === 1 ? 'code' : 'codes'} left.`); }
  } catch (e) { alert(e.message); } finally { render(); }
}

async function saveWheel(f, gid, id) {
  const fd = new FormData(f), w = id && S.wheels.find(x => x.id === id);
  const segments = fd.get('segments').split('\n').map(x => x.trim()).filter(Boolean).filter(x => x !== BORROW);
  if (fd.get('borrow')) segments.push(BORROW);
  if (segments.length < 2) return alert('Put at least two things on the wheel.');
  if (segments.length > 24) return alert('That is more than 24 slices — the labels stop being readable.');
  // A disabled input sends nothing, so a wheel that has been spun keeps what it had.
  const every = w && !fd.get('every') ? w.every_days : +fd.get('every');
  const starts = w && !fd.get('starts') ? w.starts_on : fd.get('starts');
  const stages = [{kind: 'challenge', label: 'Your challenge', segments}];
  if (fd.get('usedays')) {
    const days = fd.get('days').split(',').map(x => x.trim()).filter(Boolean);
    if (days.some(d => !/^\d+$/.test(d))) return alert('The day wheel takes whole numbers only.');
    if (days.length < 2) return alert('Put at least two numbers on the day wheel.');
    if (days.some(d => +d > every)) return alert(`A wheel spun every ${plural(every, 'day')} cannot ask for more than ${every}.`);
    stages.push({kind: 'days', label: 'On how many days', segments: days});
  }
  working(f, 'Saving…');
  try {
    await q(sb.rpc('save_wheel', {p_id: id || null, p_group: gid, p_name: fd.get('name').trim(),
      p_every: every, p_starts: starts, p_hour: +fd.get('hour'), p_breaks: !!fd.get('breaks'), p_stages: stages}));
  } catch (e) { return working(f, 'Save'), f.querySelectorAll('button').forEach(b => b.disabled = false); }
  dlg(); await load(); openGroup(gid);
}

async function delWheel(id) {
  const w = S.wheels.find(x => x.id === id);

  await q(sb.from('wheels').delete().eq('id', id));
  dlg(); await load();
}

// ---- actions
function vidPick(input) {
  const f = input.files[0], el = $('#vsize');
  recorded = null;                         // a chosen file replaces anything just recorded
  if (!f) return el.textContent = '';
  // A clip over the cap is no longer necessarily a clip that gets turned away: anything
  // big can be re-encoded to 720p first, and it is the result that has to fit. Whether it
  // is worth doing depends on how long the clip runs, which is not known until it is read.
  const pic = /^image\//.test(f.type) || IMAGE.test(f.name || '');
  const shrinks = pic ? f.size >= PHOTO_OVER : (!!mp4Type() && f.size >= COMPRESS_OVER);
  const over = f.size > MAX_MB * 1048576;
  el.className = over && !shrinks ? 'warn' : 'muted';
  el.textContent = over && !shrinks ? `${mb(f.size)} MB is too big. Trim the clip, or record at 720p (iPhone: Settings → Camera → Record Video).`
    : pic ? `${mb(f.size)} MB${shrinks ? ' · scaled down before it uploads' : ''}`
    : shrinks ? `${mb(f.size)} MB · shrunk to 720p first if that is quicker than sending it` : `${mb(f.size)} MB`;
}
const working = (f, label) => { f.querySelectorAll('button').forEach(b => b.disabled = true); const b = f.querySelector('button.primary'); if (b) b.textContent = label; };
// Switching tabs is instant, the way it is in every app on the phone. Going into a group
// is a push, so it comes in from the right; coming back, from the left.
function go(tab) { const back = !!S.open; S.tab = tab; S.open = null; render(); scrollTo(0, 0); if (back) slide(-1); load(); if (tab === 'profile') refreshPush().then(render); }
const slide = dir => { if (matchMedia('(prefers-reduced-motion: reduce)').matches || !$('#app').animate) return;
  $('#app').animate([{opacity: .4, transform: `translateX(${dir * 28}px)`}, {opacity: 1, transform: 'none'}], {duration: 280, easing: 'cubic-bezier(.32,.72,0,1)'}); };
function openGroup(id) { S.open = id; S.tab = 'groups'; render(); scrollTo(0, 0); slide(1); }
async function auth(f, mode) {
  const username = f.username.value.trim().toLowerCase(), password = f.password.value;
  working(f, '…');
  let fresh = null;
  try {
    if (mode === 'signup') {
      if (await q(sb.from('profiles').select('id').eq('username', username).maybeSingle())) return alert('That username is taken');
      const {data, error} = await sb.auth.signUp({email: emailFor(username), password, options: {data: {username}}});
      if (error) return alert(error.message);
      if (!data.session) return alert('Account created but email confirmation is still on. In Supabase: Authentication → Providers → Email → turn off "Confirm email", then log in.');
      // Issue recovery codes now: there is no reset email, so this is the only way back
      // in later. A failure here is not fatal — the profile has a button for it.
      try { fresh = (await callRecovery('issue')).codes; }
      catch (e) { alert(`Account created, but recovery codes could not be issued: ${e.message} You can get a set from your profile.`); }
    } else {
      const {error} = await sb.auth.signInWithPassword({email: emailFor(username), password});
      // Only a 400 means the credentials were genuinely wrong. Reporting every failure
      // — offline, rate limited, project paused — as a bad password sends people hunting
      // for the wrong problem.
      if (error) return alert(error.status === 400 ? 'Wrong username or password' : `Could not log in: ${error.message}`);
    }
    S.tab = 'feed'; await load();
  } finally { render(); if (fresh) codesDlg(fresh, true); }
}
async function logout() { try { await sb.auth.signOut({scope: 'local'}); } catch (e) {} S.me = null; S.open = null; S.tab = 'feed'; S.auth = 'welcome'; render(); scrollTo(0, 0); } // local scope: clears this device even if the server call fails
// ---- finding somebody to add
// Typing a username into a box and pressing Invite meant guessing: a name with a letter
// out of place looked exactly like a name that was not there, and with more than a
// handful of people nobody can be expected to spell them from memory. So the box searches
// and the invite goes to somebody the search actually found.
let fTimer = null, fSeq = 0;
function findPeople(v) {
  S.fq = v;
  clearTimeout(fTimer);
  const term = v.trim().replace(/^@/, '');
  if (term.length < 2) { S.frows = []; S.fbusy = false; S.ferr = ''; return paintPeople(); }
  S.fbusy = true; S.ferr = '';
  paintPeople();
  fTimer = setTimeout(() => runSearch(term), 250);   // a request per keystroke is nobody's friend
}

async function runSearch(term) {
  const seq = ++fSeq;
  // Only what PostgREST's or() can carry: a comma or a bracket in the box would otherwise
  // be read as more filters rather than as part of the name.
  const safe = term.toLowerCase().replace(/[^a-z0-9_. -]/g, '');
  if (!safe) { S.frows = []; S.fbusy = false; return paintPeople(); }
  let rows = [];
  try {
    const {data, error} = await sb.from('profiles').select('id,username,display_name,avatar_path')
      .or(`username.ilike.${safe}%,display_name.ilike.%${safe}%`).limit(10);
    if (error) throw error;
    rows = data || [];
  } catch (e) {
    if (seq !== fSeq) return;
    S.fbusy = false; S.ferr = plainly(e.message);
    return paintPeople();
  }
  if (seq !== fSeq) return;              // a later keystroke has already gone out
  // Remembered, so the list can show a name and a picture for somebody not otherwise known.
  rows.forEach(r => { S.profiles[r.id] = {...(S.profiles[r.id] || {}), ...r}; });
  S.frows = rows; S.fbusy = false; S.ferr = '';
  paintPeople();
}

// Where somebody already stands, so the button says the true thing.
function standing(id) {
  const m = me();
  if (id === m.id) return 'you';
  if (S.friends.includes(id)) return 'friends';
  if (S.invites.some(i => i.type === 'friend' && i.from === m.id && i.to === id)) return 'sent';
  if (S.invites.some(i => i.type === 'friend' && i.from === id && i.to === m.id)) return 'asked';
  return 'none';
}

function peopleList() {
  const term = (S.fq || '').trim().replace(/^@/, '');
  if (term.length < 2) return '';
  if (S.ferr) return `<p class="warn" style="margin-top:12px">${esc(S.ferr)}</p>`;
  if (S.fbusy) return `<p class="muted" style="margin-top:12px">Searching…</p>`;
  if (!(S.frows || []).length) return `<p class="muted" style="margin-top:12px">Nobody goes by that.</p>`;
  return `<div class="list" style="margin-top:10px">` + S.frows.map(u => {
    const st = standing(u.id);
    const right = st === 'you' ? `<span class="muted">You</span>`
      : st === 'friends' ? `<span class="muted">Friends</span>`
      : st === 'sent' ? `<span class="muted">Requested</span>`
      : st === 'asked' ? `<span class="muted">Asked you</span>`
      : `<button class="small primary" onclick="inviteFriend('${u.id}')">Add</button>`;
    return `<div class="row">${av(u, 'lg')}<div class="grow"><b>${esc(name(u))}</b><div class="muted">@${esc(u.username)}</div></div>${right}</div>`;
  }).join('') + `</div>`;
}

// Painted on its own rather than through render(), which replaces the whole screen and
// would take the caret out of the box being typed into.
function paintPeople() { const el = $('#fsr'); if (el) el.innerHTML = peopleList(); }

async function inviteFriend(id) {
  if (standing(id) !== 'none') return;
  await q(sb.from('invites').insert({type: 'friend', from_user: me().id, to_user: id}));
  await load();
  paintPeople();
}
async function accept(id) { await q(sb.rpc('accept_invite', {invite_id: id})); load(); }
async function decline(id) { await q(sb.from('invites').delete().eq('id', id)); load(); }
async function unfriend(id) { if (!confirm(`Remove ${name(user(id))} from your friends?`)) return; const [a, b] = [me().id, id].sort(); await q(sb.from('friendships').delete().eq('a', a).eq('b', b)); load(); }
async function leaveGroup(gid) { const g = S.groups.find(x => x.id === gid); if (!confirm(`Leave ${g.name}? Your posts stay, but you won't see the group anymore.`)) return; await q(sb.from('group_members').delete().eq('group_id', gid).eq('user_id', me().id)); load(); }
async function inviteToGroup(gid, uid) { await q(sb.from('invites').insert({type: 'group', from_user: me().id, to_user: uid, group_id: gid})); dlg(); load(); }
async function saveGroup(f, id) {
  const fd = new FormData(f), metrics = fd.getAll('metric'), targets = fd.getAll('target');
  const gname = fd.get('name').trim(), goal = fd.get('goal').trim();
  const quotas = metrics.map((m, i) => ({metric: m.trim(), target: +targets[i]})).filter(qq => qq.metric && qq.target > 0);
  if (!quotas.length) return alert('Add at least one metric');
  working(f, 'Saving…');
  // All seven, or none picked at all, is stored as all seven rather than as nothing: it
  // reads the same and leaves no row where "no days" could be mistaken for an empty group.
  const picked = fd.get('somedays') ? fd.getAll('day').map(Number).sort() : [];
  const active_days = picked.length ? picked : [...ALLDAYS];
  const gid = id ? (await q(sb.from('groups').update({name: gname, goal, quotas, active_days}).eq('id', id)), id)
                 : await q(sb.rpc('create_group', {p_name: gname, p_goal: goal, p_quotas: quotas}));
  // create_group keeps the signature it always had, so an app that has not been updated
  // yet still works; the days follow in their own write.
  if (!id && active_days.length < 7) await q(sb.from('groups').update({active_days}).eq('id', gid));
  dlg(); await load(); openGroup(gid);
}
async function saveProfile(f) {
  const fd = new FormData(f), photo = fd.get('photo'), display_name = fd.get('display_name').trim() || null, patch = {display_name};
  working(f, 'Saving…');
  try {
    if (photo && photo.size) {
      if (photo.size > 5 * 1024 * 1024) throw alert('Picture must be under 5 MB');
      patch.avatar_path = `${me().id}/${Date.now()}.${(photo.name.split('.').pop() || 'jpg').toLowerCase()}`; // new file name each time so browsers don't show a cached old picture
      await q(sb.storage.from('avatars').upload(patch.avatar_path, photo, {contentType: photo.type || 'image/jpeg'}));
      if (me().avatar_path) sb.storage.from('avatars').remove([me().avatar_path]);
    }
    const {error} = await sb.from('profiles').update(patch).eq('id', me().id);
    if (error) throw alert(error.message.includes('column') ? 'Profile editing needs the v3 block of schema.sql. Run it in Supabase, then try again.' : error.message);
  } catch (e) { return working(f, 'Save'), f.querySelectorAll('button').forEach(b => b.disabled = false); }
  dlg(); load();
}
// ---- recording in the app
// Handing off to the phone's own camera (a plain file input) is what made this unreliable:
// iOS puts its camera sheet over the app and is free to throw the app out of memory while
// it is up, which is the recording that vanishes and the screen that goes dark. Recording
// inside the page keeps the app alive and in charge, and lets us ask for 720p in the first
// place — so there is nothing to re-encode afterwards, which is the other half of the wait.
const REC_MAX = 120;                       // seconds; 50 MB at this bitrate is about 160
const STORY_SECS = 10;                     // a story is a moment, not a clip
let camFor = 'post';                       // what the camera was opened for
const recMax = () => camFor === 'story' ? STORY_SECS : REC_MAX;
const TIMERS = [0, 3, 10];                 // the count-in options, in the order the button cycles
let camStream = null, camRec = null, camChunks = [], camTimer = null, camWake = null, camStart = 0;
let camCount = null;                       // the count-in, so closing can cancel it
let camTimerIdx = 0, camMuted = false, camMode = 'video';
let camTake = null;                        // the clip being reviewed, and its object URL
let recorded = null;                       // what the camera produced, used in place of a picked file

const camSupported = () => !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && typeof MediaRecorder !== 'undefined');
const camTrack = () => camStream && camStream.getVideoTracks()[0];
const recording = () => !!camRec && camRec.state === 'recording';
// Which way the camera points, remembered: somebody filming themselves doing pushups wants
// the front one every time, and picking it again on every post is the sort of small
// stupidity that makes a camera feel like not a camera.
const facing = () => { try { return localStorage.getItem('quota.facing') === 'user' ? 'user' : 'environment'; } catch (e) { return 'environment'; } };
const setFacing = f => { try { localStorage.setItem('quota.facing', f); } catch (e) {} };

// iOS asks for the camera itself, and there is no way to answer on somebody's behalf or
// to stop it asking. What can be done is explain what is about to happen, once, so the
// prompt is expected rather than a surprise — and say where to change the answer later.
const CAMTOLD = 'quota.camtold';
function camExplained() {
  try {
    if (localStorage.getItem(CAMTOLD)) return true;
    localStorage.setItem(CAMTOLD, '1');
  } catch (e) { return true; }        // no storage: do not nag on every open
  return false;
}

async function openCam() {
  if (!camSupported()) return alert('This browser cannot record video. Use "Choose a file" instead.');
  if (!camExplained()) {
    alert('Quota is about to ask for your camera.\n\nAllow it once and your phone remembers — you can change it later in Settings \u2192 Quota.');
  }
  const box = $('#cam'), why = $('#camwhy');
  why.hidden = true;
  showRev(false);
  if (!box.open) box.showModal();          // the top layer, above the submit sheet
  await startCam(facing());
}

// Opening the camera, and re-opening it pointing the other way, are the same job.
async function startCam(want) {
  const box = $('#cam'), why = $('#camwhy');
  // Asking for the camera takes a moment, and on a phone it can wait on a permission
  // prompt. A shutter that looks ready but does nothing is what "you press record and it
  // just doesn't record" was: it stays dead and dimmed until there is a stream behind it.
  $('#camgo').disabled = true;
  $('#camgo').classList.remove('on');
  $('#camflip').disabled = true;
  $('#camtime').textContent = 'Starting…';
  if (camStream) stopTracks();             // flipping: let the old one go before asking for the other
  try {
    // 720p from the camera we want. Every part of this is a preference, not a demand: a
    // phone that cannot manage it gives what it has rather than refusing outright — and
    // facingMode in particular is ignored outright by desktop browsers.
    camStream = await navigator.mediaDevices.getUserMedia({
      video: {facingMode: {ideal: want}, width: {ideal: 1280}, height: {ideal: 720}, frameRate: {ideal: 30}},
      audio: true,
    });
  } catch (e) {
    why.textContent = e && e.name === 'NotAllowedError'
      ? 'Camera access was refused. Allow it in your browser settings, or use "Choose a file".'
      : `The camera could not be opened: ${e.message || e}`;
    why.hidden = false;
    $('#camtime').textContent = '';
    return;
  }
  // Closed again while the camera was still opening: let go of it rather than leaving the
  // light on behind a dialog nobody can see.
  if (!box.open) return stopCam();
  setFacing(want);
  camStream.getAudioTracks().forEach(t => t.enabled = !camMuted);
  const v = $('#campre');
  v.srcObject = camStream;
  v.muted = true;                          // or the preview howls through the mic
  v.classList.toggle('mirror', want === 'user');
  await v.play().catch(() => {});
  $('#camtime').textContent = '';
  $('#camgo').disabled = false;
  paintCam();
  await camOptions();
}

// What this particular camera can do. Zoom and a light are real on some Android phones and
// simply absent on iOS, so they are offered where they exist and not mentioned where they
// do not, rather than shown as buttons that do nothing.
async function camOptions() {
  const t = camTrack(), caps = t && t.getCapabilities ? (t.getCapabilities() || {}) : {};
  const zoom = $('#camzoom'), zr = $('#camzoomr');
  if (caps.zoom && caps.zoom.max > caps.zoom.min) {
    zr.min = caps.zoom.min; zr.max = caps.zoom.max; zr.step = caps.zoom.step || 0.1;
    zr.value = (t.getSettings() || {}).zoom || caps.zoom.min;
    zoom.hidden = false;
  } else zoom.hidden = true;
  $('#camtorch').hidden = !caps.torch;
  $('#camtorch').classList.remove('on');
  // A laptop with one camera has nothing to flip to, and a button that swaps a camera for
  // itself is worse than no button.
  let many = false;
  try {
    const ds = await navigator.mediaDevices.enumerateDevices();
    many = ds.filter(d => d.kind === 'videoinput').length > 1;
  } catch (e) { many = true; }             // cannot tell: offer it rather than hide it
  $('#camflip').hidden = !many;
  $('#camflip').disabled = recording();
}

async function flipCam() {
  if (recording() || camCount) return;     // mid-take the recorder is bound to this stream
  await startCam(facing() === 'user' ? 'environment' : 'user');
}

function toggleMic() {
  camMuted = !camMuted;
  if (camStream) camStream.getAudioTracks().forEach(t => t.enabled = !camMuted);
  paintCam();
}

function cycleTimer() {
  if (recording() || camCount) return;
  camTimerIdx = (camTimerIdx + 1) % TIMERS.length;
  paintCam();
}

async function setZoom(v) {
  const t = camTrack();
  if (t && t.applyConstraints) await t.applyConstraints({advanced: [{zoom: +v}]}).catch(() => {});
}

async function toggleTorch() {
  const t = camTrack();
  if (!t || !t.applyConstraints) return;
  const on = !((t.getSettings() || {}).torch);
  try { await t.applyConstraints({advanced: [{torch: on}]}); $('#camtorch').classList.toggle('on', on); }
  catch (e) { $('#camtorch').hidden = true; }
}

// One place that decides what every control looks like, so a flip or a stop cannot leave
// one of them saying something that is no longer true.
function setMode(m) {
  if (recording() || camCount) return;
  camMode = m;
  paintCam();
}

function paintCam() {
  const rec = recording(), busy = rec || !!camCount, pic = camMode === 'photo';
  $('#cammic').classList.toggle('on', camMuted);
  // An SVG path is not an HTMLElement, so it has no .hidden — assigning one silently
  // makes up a property and leaves the attribute exactly where it was.
  $('#micoff').toggleAttribute('hidden', !camMuted);
  $('#camtimer').textContent = TIMERS[camTimerIdx] ? `${TIMERS[camTimerIdx]}s` : 'Off';
  $('#camtimer').classList.toggle('on', !!TIMERS[camTimerIdx]);
  $('#camtimer').disabled = busy;
  $('#camflip').disabled = busy;
  $('#camgo').classList.toggle('on', rec);
  $('#camgo').classList.toggle('pic', pic && !rec);
  $('#modevid').classList.toggle('on', !pic);
  $('#modepic').classList.toggle('on', pic);
  $('#cammode').hidden = busy;             // mid-take there is nothing to switch to
  $('#cammic').hidden = pic;               // a picture has no sound to cut
  $('#camx').hidden = false;
}

function closeCam() {
  cancelCount();
  // Mid-recording: stop the recorder and leave the rest to finishRec, which takes it from
  // there. Cutting the camera off here would drop the end of the clip.
  if (recording()) { try { return camRec.stop(); } catch (e) {} }
  stopCam();
  $('#cam').close();
}

function stopTracks() {
  if (camStream) camStream.getTracks().forEach(t => t.stop());   // or the camera light stays on
  camStream = null;
  const v = $('#campre');
  if (v) v.srcObject = null;
}

function stopCam() {
  clearInterval(camTimer); camTimer = null;
  stopTracks();
  const go = $('#camgo');
  if (go) { go.disabled = true; go.classList.remove('on'); }
  releaseWake();
}

// The screen going to sleep mid-recording is the other thing people saw. Not every browser
// has this, and it is not worth failing over.
async function holdWake() {
  try { camWake = await navigator.wakeLock.request('screen'); } catch (e) { camWake = null; }
}
function releaseWake() { try { if (camWake) camWake.release(); } catch (e) {} camWake = null; }

function cancelCount() {
  if (camCount) clearInterval(camCount);
  camCount = null;
  $('#camcount').hidden = true;
}

// The shutter: stop if running, count in if a timer is set, otherwise go now — and what
// "go" means is whichever of the two the camera is set to.
function shutter() {
  if (!camStream) return;
  if (recording()) return camRec.stop();
  if (camCount) return cancelCount(), paintCam();     // a second tap during the count-in calls it off
  const go = camMode === 'photo' ? takePhoto : startRec;
  const secs = TIMERS[camTimerIdx];
  if (!secs) return go();
  let left = secs;
  const tick = () => { $('#camcount').textContent = left; $('#camcount').hidden = false; };
  tick();
  camCount = setInterval(() => {
    if (--left > 0) return tick();
    cancelCount();
    go();
  }, 1000);
  paintCam();                              // only once camCount is set, or nothing reads as busy
}

function startRec() {
  if (!camStream) return;
  const type = mp4Type() || (MediaRecorder.isTypeSupported('video/webm') ? 'video/webm' : '');
  try {
    camRec = type ? new MediaRecorder(camStream, {mimeType: type, videoBitsPerSecond: VIDEO_BPS})
                  : new MediaRecorder(camStream);
  } catch (e) { return alert(`Could not start recording: ${e.message || e}`); }

  camChunks = [];
  camRec.ondataavailable = e => e.data && e.data.size && camChunks.push(e.data);
  camRec.onstop = finishRec;
  camRec.start(1000);                      // a chunk a second, so a long clip is not one lump
  camStart = Date.now();
  holdWake();
  paintCam();
  camTimer = setInterval(() => {
    const secs = Math.round((Date.now() - camStart) / 1000);
    // A red dot and how long is left, because a clip that stops on its own at two minutes
    // with no warning is the same surprise as one that never recorded.
    $('#camtime').innerHTML = `<b></b>${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}` +
      ` <small>/ ${Math.floor(recMax() / 60)}:${String(recMax() % 60).padStart(2, '0')}</small>`;
    if (secs >= recMax() && recording()) camRec.stop();
  }, 250);
}

// iOS can put the app away mid-recording. Stopping on the way out keeps what was filmed
// as a usable clip, instead of losing the lot with the page.
addEventListener('pagehide', () => {
  if (recording()) { try { camRec.stop(); } catch (e) {} }
});

function showRev(on) {
  $('#camrev').hidden = !on;
  $('#camx').hidden = on;                  // in review there are two clear answers, and ✕ is neither
  if (on) return;
  const pl = $('#camplay'), im = $('#camshot');
  if (pl) { try { pl.pause(); } catch (e) {} pl.removeAttribute('src'); pl.load(); }
  if (im) im.removeAttribute('src');
  if (camTake) { URL.revokeObjectURL(camTake); camTake = null; }
}

// A still off the same stream, at whatever the camera is giving us. The preview is
// mirrored for the front camera but what is drawn here is not, for the same reason a
// recording is not: the picture is of the world, not of the mirror.
async function takePhoto() {
  const v = $('#campre'), w = v.videoWidth, h = v.videoHeight;
  if (!w || !h) return alert('The camera is not ready yet.');
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  c.getContext('2d').drawImage(v, 0, 0, w, h);
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.9));
  if (!blob || blob.size < 1024) return alert('That did not come out. Try again.');
  stopCam();
  keepTake(blob, `shot.jpg`, 'image/jpeg');
}

function finishRec() {
  clearInterval(camTimer); camTimer = null;
  releaseWake();
  $('#camtime').textContent = '';
  const type = (camRec && camRec.mimeType || 'video/mp4').split(';')[0];
  const blob = new Blob(camChunks, {type});
  camChunks = [];
  stopCam();                               // reviewing does not need the camera on
  paintCam();
  if (blob.size < 1024) { $('#cam').close(); return alert('That recording came out empty. Try again, or use "Choose a file".'); }
  keepTake(blob, `clip.${type.includes('webm') ? 'webm' : 'mp4'}`, type);
}

// Committed straight away rather than on the way out of the review, so a phone that takes
// the app away mid-review does not take the take with it. Then handed back to look at:
// posting something you never saw is how a picture of the ceiling ends up in the feed.
function keepTake(blob, filename, type) {
  const pic = /^image\//.test(type);
  recorded = new File([blob], filename, {type});
  recorded.fromCamera = true;              // already the size we asked for: nothing to redo
  const el = $('#vsize');
  if (el) {
    // Every iPhone in the group has to be able to play this. A device with no H.264
    // recorder writes WebM, which they cannot, and the clip would post and then fail to
    // play for everyone else with nothing to explain it.
    const ok = pic || type.includes('mp4');
    el.className = ok ? 'muted' : 'warn';
    el.textContent = `${pic ? 'Photo' : 'Recorded'} · ${mb(recorded.size)} MB${ok ? '' : ' · this device records WebM, which iPhones cannot play. Choose a file instead if the group is on iPhones.'}`;
  }
  camTake = URL.createObjectURL(blob);
  const pl = $('#camplay'), im = $('#camshot'), w = $('#camrevw');
  pl.hidden = pic; im.hidden = !pic;
  w.textContent = `${mb(blob.size)} MB`;
  if (pic) {
    im.src = camTake;
  } else {
    pl.src = camTake;
    pl.load();
    // How long it runs, so "use this" is not a guess. The length only arrives with the
    // metadata, which is why it is filled in rather than written out here.
    pl.onloadedmetadata = () => {
      const d = Math.round(pl.duration);
      if (isFinite(d) && d > 0) w.textContent = `${Math.floor(d / 60)}:${String(d % 60).padStart(2, '0')} · ${mb(blob.size)} MB`;
    };
  }
  showRev(true);
  if (!pic) pl.play().catch(() => {});
}

function useTake() {
  showRev(false);
  $('#cam').close();
  // Opened from a story, so it goes back to the story rather than sitting in a form

// ---- shrinking a clip before it goes over the wire
// The camera writes far more than a 4:5 card on a phone screen needs: by Apple's own
// figures a minute of 1080p is about 65 MB and a minute of 4K about 170 MB, and all of
// it used to go up untouched. Re-encoding to 720p first turns a 20-second clip from tens
// of megabytes into two or three, which is both a much shorter upload and about ten times
// more videos inside the 1 GB the free plan gives us.
// Every failure path here returns the original file. A slow post beats a broken one.
const TARGET_H = 720, VIDEO_BPS = 2500000;
const COMPRESS_OVER = 6 * 1048576;   // below this the upload is quick anyway
const LONGEST = 150;                 // seconds: re-encoding runs at about real time

// H.264 in MP4 only. A WebM recorded on an Android phone will not play on the iPhones
// most of this group is using, and proof nobody can watch is worse than a slow upload.
const mp4Type = () => (typeof MediaRecorder === 'undefined' || !HTMLCanvasElement.prototype.captureStream) ? ''
  : ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4;codecs=avc1,mp4a.40.2', 'video/mp4;codecs=avc1', 'video/mp4']
      .find(t => MediaRecorder.isTypeSupported(t)) || '';

// Does this blob actually decode, and is it the length we expect? A file that fails here
// would be a post nobody can play, so it is thrown away in favour of the original.
function playable(blob, seconds) {
  return new Promise(res => {
    const v = document.createElement('video'), url = URL.createObjectURL(blob);
    const done = ok => { v.src = ''; URL.revokeObjectURL(url); res(ok); };
    v.preload = 'metadata';
    v.onloadedmetadata = () => done(v.videoWidth > 0 && (!isFinite(v.duration) || Math.abs(v.duration - seconds) < Math.max(1, seconds * 0.25)));
    v.onerror = () => done(false);
    setTimeout(() => done(false), 10000);
    v.src = url;
  });
}

// A photo off a modern phone is ten or twelve megapixels, and a 4:5 card on a screen wants
// a fraction of that. Redrawing it is quick — nothing like re-encoding a clip — so there
// is no reason to send the original.
const PHOTO_LONG = 1600, PHOTO_OVER = 400 * 1024;
async function shrinkPhoto(file) {
  if (file.fromCamera || file.size < PHOTO_OVER) return file;
  let url;
  try {
    url = URL.createObjectURL(file);
    const img = await new Promise((res, rej) => {
      const i = new Image();
      i.onload = () => res(i);
      i.onerror = () => rej(new Error('unreadable'));
      setTimeout(() => rej(new Error('timed out')), 15000);
      i.src = url;
    });
    const scale = Math.min(1, PHOTO_LONG / Math.max(img.naturalWidth, img.naturalHeight));
    if (scale === 1 && file.type === 'image/jpeg') return file;
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * scale);
    c.height = Math.round(img.naturalHeight * scale);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const out = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
    if (!out || out.size >= file.size) return file;          // no gain: not worth the risk
    return new File([out], file.name.replace(/\.[^.]*$/, '') + '.jpg', {type: 'image/jpeg'});
  } catch (e) {
    return file;
  } finally {
    if (url) URL.revokeObjectURL(url);
  }
}

async function shrink(file, onProgress) {
  if (/^image\//.test(file.type) || IMAGE.test(file.name || '')) return shrinkPhoto(file);
  const type = mp4Type();
  if (!type || file.size < COMPRESS_OVER) return file;
  // Recorded in the app, so it is already 720p at the bitrate we asked for. Re-encoding it
  // would cost the length of the clip and give back almost nothing.
  if (file.fromCamera) return file;
  const url = URL.createObjectURL(file), v = document.createElement('video');
  let ac, stop = false, handle;
  try {
    v.playsInline = true; v.preload = 'auto'; v.src = url;
    await new Promise((res, rej) => {
      v.onloadedmetadata = res;
      v.onerror = () => rej(new Error('unreadable'));
      setTimeout(() => rej(new Error('timed out')), 20000);
    });
    const secs = v.duration;
    if (!v.videoWidth || !isFinite(secs) || secs <= 0 || secs > LONGEST) return file;
    // Already at or under the size we would re-encode to, and not enormous: whatever is
    // left to save is not worth making somebody wait the length of their own clip for.
    if (v.videoHeight <= TARGET_H && file.size <= secs * VIDEO_BPS / 8 * 1.6) return file;
    // Re-encoding runs at about real time, so a 40-second clip costs 40 seconds before a
    // byte moves. That only pays for itself if the bytes it saves would have taken longer
    // than that to send. On a fast connection they would not, and the whole wait is the
    // app's own doing. Judged on what this phone's uploads have actually managed, and
    // only when the original is small enough to send at all.
    const rate = upRate();
    if (rate && file.size <= MAX_MB * 1048576 && (file.size - secs * VIDEO_BPS / 8) / rate < secs) return file;

    const scale = Math.min(1, TARGET_H / v.videoHeight);
    const c = document.createElement('canvas');
    c.width = Math.round(v.videoWidth * scale / 2) * 2;      // encoders want even dimensions
    c.height = Math.round(v.videoHeight * scale / 2) * 2;
    const g = c.getContext('2d'), stream = c.captureStream();

    // Pull the audio through WebAudio instead of the speakers, so re-encoding is silent.
    try {
      ac = new (self.AudioContext || self.webkitAudioContext)();
      await ac.resume();
      const dest = ac.createMediaStreamDestination();
      ac.createMediaElementSource(v).connect(dest);
      dest.stream.getAudioTracks().forEach(t => stream.addTrack(t));
    } catch (e) { /* no audio route: the picture still gets through */ }

    const rec = new MediaRecorder(stream, {mimeType: type, videoBitsPerSecond: VIDEO_BPS});
    const chunks = [], stopped = new Promise(res => { rec.onstop = res; });
    rec.ondataavailable = e => e.data.size && chunks.push(e.data);
    rec.start();

    const pump = () => {
      if (stop) return;
      g.drawImage(v, 0, 0, c.width, c.height);
      onProgress(Math.min(1, v.currentTime / secs));
      handle = v.requestVideoFrameCallback ? v.requestVideoFrameCallback(pump) : requestAnimationFrame(pump);
    };
    await v.play();
    pump();
    await Promise.race([
      new Promise(res => { v.onended = res; }),
      new Promise((_, rej) => setTimeout(() => rej(new Error('stalled')), (secs + 20) * 2500)),
    ]);
    stop = true;
    rec.stop();
    await stopped;

    const out = new Blob(chunks, {type: type.split(';')[0]});
    if (out.size < 1024 || out.size > file.size * 0.9) return file;   // no real gain: not worth the risk
    if (!await playable(out, secs)) return file;
    return new File([out], file.name.replace(/\.[^.]*$/, '') + '.mp4', {type: out.type});
  } catch (e) {
    return file;
  } finally {
    stop = true;
    if (handle && !v.requestVideoFrameCallback) cancelAnimationFrame(handle);
    try { v.pause(); } catch (e) {}
    v.src = ''; URL.revokeObjectURL(url);
    if (ac) ac.close().catch(() => {});
  }
}

// How fast this phone actually gets a video out, in bytes a second, blended over the
// uploads it has done. Whether re-encoding is worth the wait depends entirely on this,
// and nothing else in the browser will tell us: navigator.connection is Chrome-only and
// describes the link, not what Supabase gives us on it.
const upRate = () => { const n = +localStorage.getItem('quota.uprate'); return n > 0 ? n : 0; };
function noteRate(bytes, secs) {
  if (!(secs > 1) || !(bytes > 1048576)) return;         // too small or too quick to learn from
  const cur = bytes / secs, was = upRate();
  try { localStorage.setItem('quota.uprate', String(was ? was * 0.5 + cur * 0.5 : cur)); } catch (e) {}
}

// supabase-js sends the file through fetch, which cannot report upload progress, so a
// phone video sat on a motionless "Uploading…" for the whole transfer with no way to
// tell a slow connection from a stuck one. This is the same request its storage client
// builds — a multipart POST to the object endpoint — sent with XHR so it can be watched.
async function upload(bucket, path, file, onProgress) {
  const {data: {session}} = await sb.auth.getSession();
  // A file with no type of its own is stored as octet-stream, which iOS then refuses to
  // play. The camera always sets one; a file picked from somewhere else might not.
  const part = file.type ? file : new File([file], file.name || 'video.mp4', {type: 'video/mp4'});
  const body = new FormData();
  body.append('cacheControl', '3600');
  body.append('', part);
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest(), t0 = Date.now();
    xhr.open('POST', `${SUPABASE_URL}/storage/v1/object/${bucket}/${path}`);
    xhr.setRequestHeader('apikey', SUPABASE_KEY);
    if (session) xhr.setRequestHeader('Authorization', `Bearer ${session.access_token}`);
    xhr.setRequestHeader('x-upsert', 'false');
    xhr.upload.onprogress = e => {
      if (!e.lengthComputable) return;
      const secs = (Date.now() - t0) / 1000;
      onProgress(e.loaded, e.total, secs > 1 ? e.loaded / 1048576 / secs : 0);   // a rate before a second has passed is noise
    };
    xhr.onload = () => {
      if (xhr.status >= 200 && xhr.status < 300) { noteRate(part.size, (Date.now() - t0) / 1000); return resolve(); }
      let m = `The upload failed (${xhr.status}).`;
      try { const j = JSON.parse(xhr.responseText); m = j.message || j.error || m; } catch (err) {}
      reject(new Error(m));
    };
    xhr.onerror = () => reject(new Error('The upload was interrupted. Check your connection and try again.'));
    xhr.onabort = () => reject(new Error('The upload was cancelled.'));
    xhr.send(body);
  });
}

const mb = n => (n / 1048576).toFixed(1);

const tooBig = n => `That file is ${(n / 1048576).toFixed(0)} MB and the limit is ${MAX_MB} MB.\n\nTrim the clip, or record at 720p (iPhone: Settings → Camera → Record Video).`;

// ---- push notifications
// Public half of the VAPID pair; the private half lives in the notify edge function's secrets.
const VAPID_PUBLIC_KEY = 'BPaw2UJU9VQ17Onx8bqve-CpoYzsoE1mTs8CaEZB34dvyT76nszZdXf-7hJS2EEUJVj_2sIO5cfDZ8Wki8Lsdv4';

const pushOK = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;

async function refreshPush() {
  if (!pushOK()) { S.push = isIOS() && !isStandalone() ? 'install' : 'unsupported'; return; }
  if (Notification.permission === 'denied') { S.push = 'denied'; return; }
  const reg = await navigator.serviceWorker.ready;
  S.push = await reg.pushManager.getSubscription() ? 'on' : 'off';
}

async function enablePush() {
  try {
    const perm = await Notification.requestPermission(); // has to happen inside the tap
    if (perm !== 'granted') { S.push = perm === 'denied' ? 'denied' : 'off'; return render(); }
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: urlB64(VAPID_PUBLIC_KEY)});
    const k = sub.toJSON().keys;
    await q(sb.from('push_subscriptions').upsert({endpoint: sub.endpoint, user_id: me().id, p256dh: k.p256dh, auth: k.auth}));
    S.push = 'on';
    try { localStorage.setItem(PUSHASK, String(Date.now())); } catch (e) {}
  } catch (e) { alert('Could not turn on notifications: ' + e.message); await refreshPush(); }
  render();
}

    if (sub) { await q(sb.from('push_subscriptions').delete().eq('endpoint', sub.endpoint)); await sub.unsubscribe(); }

    {g: 1, u: 'a', d: daysAgo(4), m: 'pushups', n: 50}, {g: 1, u: 'b', d: Y, m: 'pushups', n: 60}, {g: 2, u: 'a', d: T, m: 'pushups', n: 7}];
  console.assert(done(g, 'a', 'pushups') === 50, 'sums only today, this user, this group');
  console.assert(streak(g, 'a') === 3, 'streak counts today + 2 previous days, gap at day 3');
  console.assert(streak(g, 'b') === 1, 'streak still alive if yesterday was hit and today is in progress');
  console.assert(best(g, 'a') === 3 && best(g, 'b') === 1, 'best streak');
  console.assert(streak(g, 'zzz') === 0, 'no posts, no streak');
  console.assert(name({username: 'sam'}) === 'sam' && name({username: 'sam', display_name: 'Sam D'}) === 'Sam D', 'display name falls back to username');
  console.log('self-check ok');
}
