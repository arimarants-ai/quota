<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Quota</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--line:#e6e8ec;--text:#141820;--muted:#6b7280;--soft:#f1f2f5;
  --a1:#ff5f3d;--a2:#ff2d78;--grad:linear-gradient(135deg,var(--a1),var(--a2));--ok:#16a34a;--okbg:#e6f7ec;--miss:#dc2626;--missbg:#fdecec;
  --hdr:rgba(255,255,255,.88);--ring:#fff;--r:18px;--shadow:0 1px 2px rgba(20,24,32,.04),0 8px 24px -12px rgba(20,24,32,.12)}
:root[data-theme=dark]{--bg:#0f1115;--card:#181b22;--line:#262a33;--text:#eef0f4;--muted:#8b93a3;--soft:#23272f;--okbg:#0f3d22;--ok:#4ade80;--missbg:#3f1414;--miss:#fca5a5;--hdr:rgba(24,27,34,.88);--ring:#181b22;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6)}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
main{max-width:600px;margin:0 auto;padding:12px 14px 96px}
h1{font-size:26px;letter-spacing:-.02em;margin:6px 0 12px}
h2{font-size:22px;letter-spacing:-.01em;margin:0 0 6px}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 0 10px}
p{margin:0 0 8px}
a{color:var(--a1)}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--muted);font-size:14px}
button{font:inherit;font-weight:600;border:0;border-radius:999px;padding:11px 18px;background:var(--soft);color:var(--text);cursor:pointer;white-space:nowrap;transition:transform .08s,filter .15s}
button:active{transform:scale(.97)}
button.primary{background:var(--grad);color:#fff;box-shadow:0 6px 16px -6px rgba(255,61,110,.6)}
button.small{padding:7px 13px;font-size:13px}
button.ghost{background:none;color:var(--muted);padding:6px 8px;font-weight:500}
button.theme{background:var(--soft);padding:6px 9px;font-size:16px;line-height:1}
input,select,textarea{font:inherit;width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--soft);color:var(--text);min-width:0;outline:none}
input:focus,select:focus{border-color:var(--a1);background:var(--card);box-shadow:0 0 0 3px rgba(255,95,61,.15)}
input[type=file]{padding:10px;font-size:14px}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:12px 0 6px}
header{position:sticky;top:0;z-index:5;background:var(--hdr);backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--line)}
header .in{max-width:600px;margin:0 auto;padding:12px 14px;display:flex;align-items:center;justify-content:space-between}
.logo{font-weight:800;font-size:22px;letter-spacing:-.03em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:var(--hdr);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav[hidden],header[hidden]{display:none}
nav button{flex:1;border-radius:0;background:none;padding:10px 0 8px;color:var(--muted);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--a1)}
video{width:100%;border-radius:14px;background:#000;max-height:70vh;margin-top:12px;display:block}
.bar{height:10px;background:var(--soft);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--grad);border-radius:6px;transition:width .4s}
.bar i.done{background:var(--ok)}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;text-transform:uppercase;font-size:16px}
.avatar.lg{width:56px;height:56px;font-size:22px}
.ring{padding:3px;border-radius:50%;background:var(--line)}
.ring.ok{background:var(--ok)}
.ring .avatar{border:2px solid var(--ring)}
.chip{display:inline-block;padding:4px 10px;border-radius:999px;background:var(--soft);font-size:12px;font-weight:600;white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)}
.chip.miss{background:var(--missbg);color:var(--miss)}
.chip.grad{background:var(--grad);color:#fff}
.people{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.people::-webkit-scrollbar{display:none}
.person{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;min-width:64px;text-align:center}
.post{padding:0;overflow:hidden}
.post .head{padding:12px 14px 0}
.post .body{padding:0 14px 14px}
.post video{border-radius:0;margin:12px 0 0}
.post .foot{padding:12px 14px 14px}
.empty{text-align:center;color:var(--muted);padding:32px 16px}
.empty .big{font-size:40px;margin-bottom:8px}
dialog{background:var(--card);color:var(--text);border:0;border-radius:24px 24px 0 0;width:100%;max-width:100%;margin:auto 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.15)}
dialog::backdrop{background:rgba(20,24,32,.45);backdrop-filter:blur(2px)}
dialog h2{margin-bottom:2px}
@media(min-width:640px){
  dialog{border-radius:24px;width:min(92vw,460px);margin:auto}
  nav{position:sticky;top:57px;bottom:auto;border-top:0;border-bottom:1px solid var(--line);max-width:100%}
  nav{justify-content:center}
  nav button{flex:0 0 200px;flex-direction:row;gap:8px;font-size:14px;padding:12px 0}
  main{padding-bottom:40px}
}
</style>
</head>
<body>
<header hidden><div class="in"><span class="logo">Quota</span><span id="who"></span></div></header>
<nav hidden>
<button data-tab="home"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Today</button>
<button data-tab="groups"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><circle cx="17" cy="9" r="2.5"/><path d="M3 19c0-3.3 2.7-5 6-5s6 1.7 6 5M15 15c2.8 0 5 1.3 5 4"/></svg>Groups</button>
<button data-tab="me"><svg viewBox="0 0 24 24"><circle cx="10" cy="8" r="3.5"/><path d="M4 19c0-3.3 2.7-5 6-5s6 1.7 6 5M19 8v6M16 11h6"/></svg>Friends</button>
</nav>
<main id="app"></main>
<dialog id="dlg"></dialog>
<script>
// ---- storage: IndexedDB. ponytail: single-device; swap these lines for Supabase/fetch() calls when a server exists.
// Version bump wipes the stores (throwaway local data) so the schema can change freely.
const DB = new Promise((res, rej) => {
  const r = indexedDB.open('quota', 2);
  r.onupgradeneeded = e => { const d = e.target.result; [...d.objectStoreNames].forEach(s => d.deleteObjectStore(s));
    ['users', 'groups', 'posts', 'invites'].forEach(s => d.createObjectStore(s, {keyPath: 'id', autoIncrement: true})); };
  r.onsuccess = e => res(e.target.result);
  r.onerror = () => rej(r.error);
});
const tx = async (s, mode, fn) => { const d = await DB; return new Promise((res, rej) => { const q = fn(d.transaction(s, mode).objectStore(s)); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); };
const all = s => tx(s, 'readonly', o => o.getAll());
const put = (s, v) => tx(s, 'readwrite', o => o.put(v));
const del = (s, id) => tx(s, 'readwrite', o => o.delete(id));
// ponytail: SHA-256 needs a secure context (localhost/https/file). Over plain http on LAN it falls back to the raw string. Real auth lives on the server.
const hash = async s => crypto.subtle ? [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)))].map(b => b.toString(16).padStart(2, '0')).join('') : s;

// ---- theme
const setTheme = t => { document.documentElement.dataset.theme = t; localStorage.theme = t; document.querySelector('meta[name=theme-color]').content = t === 'dark' ? '#181b22' : '#ffffff'; };
setTheme(localStorage.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
const toggleTheme = () => { setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'); render(); };
const themeBtn = () => `<button class="theme" onclick="toggleTheme()" title="Toggle light/dark">${document.documentElement.dataset.theme === 'dark' ? '☀️' : '🌙'}</button>`;

// ---- state
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S = {users: [], groups: [], posts: [], invites: [], tab: 'home', open: null};
const me = () => S.users.find(u => u.id === +localStorage.me);
const user = id => S.users.find(u => u.id === id) || {username: '?', friends: []};
const today = () => new Date().toDateString();
const done = (g, uid, metric, day = today()) => S.posts.filter(p => p.groupId === g.id && p.userId === uid && p.metric === metric && p.day === day).reduce((a, p) => a + p.amount, 0);
const hit = (g, uid) => g.quotas.every(q => done(g, uid, q.metric) >= q.target);
const myGroups = () => S.groups.filter(g => g.members.includes(me().id));
const hue = s => [...s].reduce((a, c) => a + c.charCodeAt(0), 0) * 47 % 360;
const avatar = (u, cls = '') => `<div class="avatar ${cls}" style="background:linear-gradient(135deg,hsl(${hue(u.username)} 80% 58%),hsl(${hue(u.username) + 40} 80% 52%))">${esc(u.username[0] || '?')}</div>`;
const quotaText = g => g.quotas.map(q => `${q.target} ${esc(q.metric)}`).join(' · ');
const time = ts => new Date(ts).toLocaleTimeString([], {hour: 'numeric', minute: '2-digit'});

async function load() {
  [S.users, S.groups, S.posts, S.invites] = await Promise.all([all('users'), all('groups'), all('posts'), all('invites')]);
  render();
}
function render() {
  const m = me();
  $('nav').hidden = $('header').hidden = !m;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === S.tab));
  if (!m) return $('#app').innerHTML = authView();
  $('#who').innerHTML = `<span class="row">${themeBtn()}<span class="row" style="cursor:pointer" onclick="S.open=null;S.tab='me';render()"><span class="muted">@${esc(m.username)}</span>${avatar(m)}</span></span>`;
  $('#app').innerHTML = S.open ? groupView(S.groups.find(g => g.id === S.open)) : {home: homeView, groups: groupsView, me: meView}[S.tab]();
}

// ---- views
function authView() {
  return `<div style="max-width:400px;margin:14vh auto 0;text-align:center"><div class="logo" style="font-size:44px">Quota</div><p class="muted" style="margin-bottom:20px">Daily goals with friends. Proof or it didn't happen.</p>
    <div class="card" style="text-align:left"><form onsubmit="event.preventDefault();auth(this,event)">
    <label>Username</label><input name="username" required autocomplete="username" autocapitalize="none" pattern="[a-zA-Z0-9_]{3,20}" title="3-20 letters, numbers or underscores" placeholder="yourname">
    <label>Password</label><input name="password" type="password" required autocomplete="current-password" minlength="4" placeholder="••••••••">
    <div class="row" style="margin-top:18px"><button class="primary grow" value="login">Log in</button><button class="grow" value="signup">Create account</button></div></form></div><div style="margin-top:14px">${themeBtn()}</div></div>`;
}
function homeView() {
  const gs = myGroups(), m = me();
  const head = `<h1>Today <span class="muted" style="font-weight:500;font-size:15px">${new Date().toLocaleDateString(undefined, {weekday: 'long', month: 'long', day: 'numeric'})}</span></h1>`;
  if (!gs.length) return head + `<div class="card empty"><div class="big">🏁</div><b>No groups yet</b><p class="muted">Make one under Groups or accept an invite.</p></div>`;
  return head + gs.map(g => `<div class="card"><div class="row between"><div><b style="font-size:17px">${esc(g.name)}</b><div class="muted">${g.members.filter(id => hit(g, id)).length}/${g.members.length} hit quota so far</div></div>${hit(g, m.id) ? `<span class="chip ok">✓ Done</span>` : `<button class="small" onclick="openGroup(${g.id})">Open</button>`}</div>
    ${quotaBars(g, m.id)}<button class="primary" style="width:100%;margin-top:14px" onclick="submitDlg(${g.id})">＋ Submit proof</button></div>`).join('');
}
function quotaBars(g, uid) {
  return g.quotas.map(q => { const d = done(g, uid, q.metric), ok = d >= q.target, pct = Math.min(100, d / q.target * 100);
    return `<div style="margin-top:12px"><div class="row between"><span style="font-weight:600">${esc(q.metric)}</span><span class="muted"><b style="color:${ok ? 'var(--ok)' : 'var(--text)'}">${d}</b> / ${q.target}</span></div><div class="bar"><i class="${ok ? 'done' : ''}" style="width:${pct}%"></i></div></div>`; }).join('');
}
function groupsView() {
  const mine = myGroups(), invites = S.invites.filter(i => i.type === 'group' && i.to === me().id && S.groups.some(g => g.id === i.groupId));
  return `<div class="row between"><h1>Groups</h1><button class="primary small" onclick="groupDlg()">＋ New group</button></div>`
    + (invites.length ? `<h3>Invites</h3>` + invites.map(i => { const g = S.groups.find(x => x.id === i.groupId); return `<div class="card"><div class="row">${avatar(user(i.from))}<div class="grow"><b>${esc(g.name)}</b><div class="muted">@${esc(user(i.from).username)} invited you · ${quotaText(g)}</div></div></div>
        <div class="row" style="margin-top:12px"><button class="small primary grow" onclick="accept(${i.id})">Accept</button><button class="small grow" onclick="decline(${i.id})">Decline</button></div></div>`; }).join('') : '')
    + `<h3>My groups</h3>` + (mine.length ? mine.map(gCard).join('') : `<div class="card empty"><div class="big">👥</div><b>No groups yet</b><p class="muted">Start one and invite your friends.</p></div>`);
}
function gCard(g) {
  const n = g.members.filter(id => hit(g, id)).length;
  return `<div class="card row" onclick="openGroup(${g.id})" style="cursor:pointer"><div class="grow"><b style="font-size:17px">${esc(g.name)}</b><div class="muted">${quotaText(g)}</div></div><span class="chip ${n === g.members.length ? 'ok' : ''}">${n}/${g.members.length} today</span></div>`;
}
function groupView(g) {
  if (!g || !g.members.includes(me().id)) { S.open = null; return groupsView(); }
  const pending = S.invites.filter(i => i.type === 'group' && i.groupId === g.id);
  return `<button class="ghost" onclick="S.open=null;render()">‹ Groups</button>
  <div class="card" style="margin-top:8px"><h2>${esc(g.name)}</h2>${g.goal ? `<p>🎯 ${esc(g.goal)}</p>` : ''}
    <div class="row wrap" style="margin-top:6px">${g.quotas.map(q => `<span class="chip">${q.target} ${esc(q.metric)} / day</span>`).join('')}</div>
    <div class="row" style="margin-top:14px"><button class="primary grow" onclick="submitDlg(${g.id})">＋ Submit proof</button><button onclick="inviteDlg(${g.id})">Invite</button><button onclick="groupDlg(S.groups.find(x=>x.id===${g.id}))">Edit</button></div></div>
  <h3>Today</h3>
  <div class="people">${g.members.map(uid => { const u = user(uid), ok = hit(g, uid); return `<div class="person"><div class="ring ${ok ? 'ok' : ''}">${avatar(u, 'lg')}</div><span>${uid === me().id ? 'You' : esc(u.username)}</span>
    <span class="muted" style="font-size:11px;font-weight:500">${g.quotas.map(q => `${done(g, uid, q.metric)}/${q.target}`).join(' · ')}</span></div>`; }).join('')}</div>
  ${pending.length ? `<p class="muted">Invited: ${pending.map(i => '@' + esc(user(i.to).username)).join(', ')}</p>` : ''}
  <h3>Proof</h3>${feed(g)}`;
}
function feed(g) {
  const ps = S.posts.filter(p => p.groupId === g.id).sort((a, b) => b.ts - a.ts);
  if (!ps.length) return `<div class="card empty"><div class="big">🎥</div><b>No proof yet</b><p class="muted">Be the first to post today.</p></div>`;
  let day = '';
  return ps.map(p => {
    const h = p.day !== day ? `<p class="muted" style="margin:14px 0 8px;font-weight:600">${p.day === today() ? 'Today' : p.day}</p>` : ''; day = p.day;
    const u = user(p.userId);
    return h + `<div class="card post"><div class="row head">${avatar(u)}<div class="grow"><b>@${esc(u.username)}</b><div class="muted">${time(p.ts)}</div></div><span class="chip grad">${p.amount} ${esc(p.metric)}</span></div>
      <video controls playsinline preload="metadata" src="${URL.createObjectURL(p.video)}"></video>
      <div class="foot row between"><span class="grow">${p.caption ? esc(p.caption) : '<span class="muted">No caption</span>'}</span>${p.userId === me().id ? `<button class="ghost small" onclick="delPost(${p.id})">Delete</button>` : ''}</div></div>`;
  }).join('');
}
function meView() {
  const m = me(), incoming = S.invites.filter(i => i.type === 'friend' && i.to === m.id), outgoing = S.invites.filter(i => i.type === 'friend' && i.from === m.id);
  const person = (id, extra = '') => `<div class="card row">${avatar(user(id))}<b class="grow">@${esc(user(id).username)}</b>${extra}</div>`;
  return `<h1>Friends</h1>
  <div class="card row">${avatar(m, 'lg')}<div class="grow"><b style="font-size:17px">@${esc(m.username)}</b><div class="muted">${m.friends.length} friend${m.friends.length !== 1 ? 's' : ''} · ${myGroups().length} group${myGroups().length !== 1 ? 's' : ''}</div></div><button class="small" onclick="logout()">Log out</button></div>
  <div class="card"><b>Add a friend</b><form onsubmit="event.preventDefault();sendFriend(this)" class="row" style="margin-top:10px"><input name="username" placeholder="@username" autocapitalize="none" required><button class="primary">Invite</button></form></div>
  ${incoming.length ? `<h3>Requests</h3>` + incoming.map(i => person(i.from, `<button class="small primary" onclick="accept(${i.id})">Accept</button><button class="small" onclick="decline(${i.id})">Decline</button>`)).join('') : ''}
  <h3>Your friends</h3>${m.friends.length ? m.friends.map(id => person(id)).join('') : `<div class="card empty"><div class="big">👋</div><b>No friends yet</b><p class="muted">Invite someone by their username.</p></div>`}
  ${outgoing.length ? `<h3>Sent</h3>` + outgoing.map(i => person(i.to, `<span class="muted">Pending</span><button class="ghost small" onclick="decline(${i.id})">Cancel</button>`)).join('') : ''}`;
}

// ---- dialogs
function dlg(html) { const d = $('#dlg'); if (!html) return d.close(); d.innerHTML = html; d.showModal(); }
function submitDlg(gid) {
  const g = S.groups.find(x => x.id === gid);
  dlg(`<h2>Submit proof</h2><p class="muted">${esc(g.name)}</p><form onsubmit="event.preventDefault();addPost(this,${gid})">
    <label>How many</label><div class="row"><input name="amount" type="number" min="1" inputmode="numeric" placeholder="20" required><select name="metric" style="width:45%;flex:none">${g.quotas.map(q => `<option>${esc(q.metric)}</option>`).join('')}</select></div>
    <label>Video proof</label><input name="video" type="file" accept="video/*" required>
    <label>Caption (optional)</label><input name="caption" placeholder="20 more in the bag">
    <div class="row" style="margin-top:18px"><button type="button" onclick="dlg()">Cancel</button><button class="primary grow">Post</button></div></form>`);
}
const quotaRow = (q = {metric: '', target: ''}) => `<div class="row" style="margin-top:8px"><input name="metric" placeholder="pushups" value="${esc(q.metric)}" required><input name="target" type="number" min="1" placeholder="100" value="${q.target}" required style="width:96px;flex:none"><button type="button" class="ghost" onclick="this.parentNode.remove()">✕</button></div>`;
function groupDlg(g = {name: '', goal: '', quotas: [{metric: 'pushups', target: 100}]}) {
  dlg(`<h2>${g.id ? 'Edit' : 'New'} group</h2><form onsubmit="event.preventDefault();saveGroup(this,${g.id || 0})">
    <label>Name</label><input name="name" value="${esc(g.name)}" required placeholder="Push crew">
    <label>Group goal</label><input name="goal" value="${esc(g.goal)}" placeholder="e.g. 100 pushups a day for 30 days">
    <label>Daily quota (per person)</label><div>${g.quotas.map(quotaRow).join('')}</div><button type="button" class="small" style="margin-top:8px" onclick="this.previousElementSibling.insertAdjacentHTML('beforeend',quotaRow())">+ add metric</button>
    ${g.id ? '' : `<p class="muted" style="margin-top:12px">You can invite friends once the group is created.</p>`}
    <div class="row" style="margin-top:18px"><button type="button" onclick="dlg()">Cancel</button><button class="primary grow">Save</button></div></form>`);
}
function inviteDlg(gid) {
  const g = S.groups.find(x => x.id === gid), pend = S.invites.filter(i => i.type === 'group' && i.groupId === gid).map(i => i.to);
  const list = me().friends.filter(id => !g.members.includes(id) && !pend.includes(id));
  dlg(`<h2>Invite to ${esc(g.name)}</h2>${list.length ? list.map(id => `<div class="row" style="margin:12px 0">${avatar(user(id))}<b class="grow">@${esc(user(id).username)}</b><button class="small primary" onclick="inviteToGroup(${gid},${id})">Invite</button></div>`).join('')
    : `<p class="muted">All your friends are in this group or already invited. Add more under Friends.</p>`}<button style="width:100%;margin-top:12px" onclick="dlg()">Close</button>`);
}

// ---- actions
async function auth(f, e) {
  const username = f.username.value.trim().toLowerCase(), pw = await hash(f.password.value);
  const u = S.users.find(x => x.username === username);
  if (e.submitter.value === 'signup') {
    if (u) return alert('That username is taken');
    localStorage.me = await put('users', {username, pw, friends: []});
  } else {
    if (!u || u.pw !== pw) return alert('Wrong username or password');
    localStorage.me = u.id;
  }
  S.tab = 'home'; load();
}
function logout() { localStorage.removeItem('me'); S.open = null; S.tab = 'home'; render(); }
async function sendFriend(f) {
  const name = f.username.value.trim().toLowerCase().replace(/^@/, ''), u = S.users.find(x => x.username === name), m = me();
  if (!u) return alert('No user with that username');
  if (u.id === m.id) return alert("That's you");
  if (m.friends.includes(u.id)) return alert('Already friends');
  if (S.invites.some(i => i.type === 'friend' && ((i.from === m.id && i.to === u.id) || (i.from === u.id && i.to === m.id)))) return alert('A request is already pending');
  await put('invites', {type: 'friend', from: m.id, to: u.id, ts: Date.now()}); f.reset(); load();
}
async function accept(id) {
  const i = S.invites.find(x => x.id === id);
  if (i.type === 'friend') { const a = user(i.from), b = user(i.to); a.friends.push(b.id); b.friends.push(a.id); await put('users', a); await put('users', b); }
  else { const g = S.groups.find(x => x.id === i.groupId); if (g && !g.members.includes(i.to)) { g.members.push(i.to); await put('groups', g); } }
  await del('invites', id); load();
}
async function decline(id) { await del('invites', id); load(); }
async function inviteToGroup(gid, uid) { await put('invites', {type: 'group', from: me().id, to: uid, groupId: gid, ts: Date.now()}); dlg(); load(); }
async function saveGroup(f, id) {
  const fd = new FormData(f), metrics = fd.getAll('metric'), targets = fd.getAll('target');
  const g = S.groups.find(x => x.id === id) || {createdBy: me().id, members: [me().id]};
  Object.assign(g, {name: fd.get('name').trim(), goal: fd.get('goal').trim(),
    quotas: metrics.map((m, i) => ({metric: m.trim(), target: +targets[i]})).filter(q => q.metric && q.target > 0)});
  if (!g.quotas.length) return alert('Add at least one metric');
  const gid = await put('groups', g); dlg(); await load(); openGroup(gid);
}
function openGroup(id) { S.open = id; S.tab = 'groups'; render(); scrollTo(0, 0); }
async function addPost(f, gid) {
  const fd = new FormData(f), video = fd.get('video');
  if (!video || !video.size) return alert('Attach a video');
  await put('posts', {groupId: gid, userId: me().id, metric: fd.get('metric'), amount: +fd.get('amount'), video, caption: fd.get('caption').trim(), day: today(), ts: Date.now()});
  dlg(); await load(); openGroup(gid);
}
async function delPost(id) { if (confirm('Delete this post?')) { await del('posts', id); load(); } }

document.querySelectorAll('nav button').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; S.open = null; render(); scrollTo(0, 0); });
load();
