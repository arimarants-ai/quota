// A comment can be liked, the same gesture as liking the post it sits under, and whoever
// wrote it is the one who hears about it.
const commentLikes = id => S.clikes.filter(l => l.c === id);
const iLikeComment = id => S.clikes.some(l => l.c === id && l.u === me().id);
async function toggleCommentLike(id) {
  const m = me(), had = iLikeComment(id);
  S.clikes = had ? S.clikes.filter(l => !(l.c === id && l.u === m.id)) : [...S.clikes, {c: id, u: m.id}];
  render();
  try {
    if (had) await q(sb.from('comment_likes').delete().eq('comment_id', id).eq('user_id', m.id));
    else await q(sb.from('comment_likes').insert({comment_id: id, user_id: m.id}));
  } catch (e) {
    S.clikes = had ? [...S.clikes, {c: id, u: m.id}] : S.clikes.filter(l => !(l.c === id && l.u === m.id));
    render();
  }
}
async function addComment(f, postId) {
  const body = f.body.value.trim(); if (!body) return;
  working(f, '…');
  // Emptied before the redraw, not after. render() carries half-typed replies across a
  // rebuild so a like somewhere else on the page cannot eat what you were in the middle
  // of writing — and a box still holding the comment it has just sent looks exactly like
  // one being carried across, so it was put straight back and the comment appeared to
  // have been typed twice.
  f.body.value = '';
  // Show it, and count it, before the round trip finishes — a count that only moves once
  // the server answers reads as a tap that did nothing. It carries no real id yet, so it
  // is marked pending and offers no delete until load() brings back the real row.
  const tmp = {id: -Date.now(), postId, userId: me().id, body, pending: true};
  S.comments = [...S.comments, tmp];
  render();
  try {
    await q(sb.from('comments').insert({post_id: postId, user_id: me().id, body}));
  } catch (e) {
    S.comments = S.comments.filter(c => c !== tmp);
    const back = document.querySelector(`#app .post[data-post="${postId}"] .cin input`);
    if (back) back.value = body;           // it did not send: give them back what they wrote
    render();
    throw e;
  }
  const y = scrollY; await load(); scrollTo(0, y);
}
async function delComment(id) {
  S.comments = S.comments.filter(c => c.id !== id); render();
  try {
    await q(sb.from('comments').delete().eq('id', id));
  } catch (e) { await load(); throw e; }
  const y = scrollY; await load(); scrollTo(0, y);
}

// An installed app comes back to the foreground constantly, and this refetches every
// table each time. Once every 15 seconds is plenty; load() itself collapses overlapping calls.
document.addEventListener('visibilitychange', () => {
  // A parked camera is for coming straight back to it. Put the app away and it goes out,
  // rather than sitting there with the light on.
  if (document.hidden && !$('#cam').open) dropCam();
  if (document.hidden || !me() || Date.now() - lastLoad < 15000) return;
  load();
});

// ---- installable app
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(e => console.warn('Service worker did not register:', e)));
function dismissA2HS() { $('#a2hs').hidden = true; try { localStorage.a2hs = '1'; } catch (e) {} }
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
function maybeShowA2HS() {
  const safari = !/CriOS|FxiOS|EdgiOS|OPiOS|Chrome/.test(navigator.userAgent); // only Safari can add to the home screen
  let dismissed = false; try { dismissed = localStorage.a2hs === '1'; } catch (e) {}
  if (isIOS() && safari && !isStandalone() && !dismissed) $('#a2hs').hidden = false;
}
setTimeout(maybeShowA2HS, 1200); // let the app paint first

// ---- push notifications
// Public half of the VAPID pair; the private half lives in the notify edge function's secrets.
const VAPID_PUBLIC_KEY = 'BPaw2UJU9VQ17Onx8bqve-CpoYzsoE1mTs8CaEZB34dvyT76nszZdXf-7hJS2EEUJVj_2sIO5cfDZ8Wki8Lsdv4';
const urlB64 = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/').padEnd(Math.ceil(s.length / 4) * 4, '=')), c => c.charCodeAt(0));
// iOS only exposes PushManager to home screen apps, so an iPhone in a Safari tab lands on 'install'.
const pushOK = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;

async function refreshPush() {
  if (!pushOK()) { S.push = isIOS() && !isStandalone() ? 'install' : 'unsupported'; return; }
  if (Notification.permission === 'denied') { S.push = 'denied'; return; }
  const reg = await navigator.serviceWorker.ready;
  S.push = await reg.pushManager.getSubscription() ? 'on' : 'off';
}

async function enablePush() {
  try {
    const perm = await Notification.requestPermission(); // has to happen inside the tap
    if (perm !== 'granted') { S.push = perm === 'denied' ? 'denied' : 'off'; return render(); }
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: urlB64(VAPID_PUBLIC_KEY)});
    const k = sub.toJSON().keys;
    await q(sb.from('push_subscriptions').upsert({endpoint: sub.endpoint, user_id: me().id, p256dh: k.p256dh, auth: k.auth}));
    S.push = 'on';
    try { localStorage.setItem(PUSHASK, String(Date.now())); } catch (e) {}
  } catch (e) { alert('Could not turn on notifications: ' + e.message); await refreshPush(); }
  render();
}

async function disablePush() {
  try {
    const sub = await (await navigator.serviceWorker.ready).pushManager.getSubscription();
    if (sub) { await q(sb.from('push_subscriptions').delete().eq('endpoint', sub.endpoint)); await sub.unsubscribe(); }
  } catch (e) { /* leaving the row behind is harmless: the sender prunes dead endpoints */ }
  S.push = 'off'; render();
}
// ---- what is happening while you are looking
// A tray of answers is put away by tapping anywhere that is not it, which is what tapping
// away from an open thing means everywhere else on a phone. Every opener stops its own
// click, so this can never close the tray that click just opened.
addEventListener('click', e => {
  if (e.target.closest('.reactpick')) return;
  document.querySelectorAll('.reactpick').forEach(x => x.remove());
});

// One channel for the whole app rather than one per screen: what you can see changes as you
// move about, and a subscription that has to be torn down and rebuilt on every navigation
// is a subscription that is sometimes missing.
//
// Nothing here patches S by hand off a payload. A row arriving is only a reason to ask, and
// load() already knows how to ask properly — an update that gets one table right and its
// neighbour wrong is worse than a round trip. Bursts are collapsed: ten people liking a post
// at once is one load.
//
// Realtime has to be switched on per table in the Supabase dashboard (Database →
// Replication). Where it is not, none of this fires and the app behaves exactly as it did
// before: the visibility refetch and, in a chat, refreshChat(). It is an improvement on
// top, never something the app needs to work.
const LIVE_TABLES = ['posts', 'comments', 'likes', 'reactions', 'stories', 'story_likes',
  'story_reactions', 'comment_likes', 'invites', 'group_members', 'friendships',
  'messages', 'message_reactions', 'flags', 'flag_votes'];
let live = null, liveTimer = null, liveOn = false;
function goLive() {
  if (live || !me() || typeof sb.channel !== 'function') return;
  try {
    const ch = sb.channel('quota-live');
    for (const table of LIVE_TABLES) {
      ch.on('postgres_changes', {event: '*', schema: 'public', table}, e => onLive(table, e));
    }
    ch.subscribe(status => { liveOn = status === 'SUBSCRIBED'; });
    live = ch;
  } catch (e) { live = null; }            // no realtime: the app is exactly as it was
}
function dropLive() {
  if (!live) return;
  try { sb.removeChannel(live); } catch (e) {}
  live = null; liveOn = false;
  clearTimeout(liveTimer); liveTimer = null;
}
const LIVE_WAIT = 600;                     // long enough to collect a burst, short enough to feel immediate
function onLive(table, e) {
  if (!me()) return;
  noteWorthSaying(table, e);
  clearTimeout(liveTimer);
  liveTimer = setTimeout(() => { liveTimer = null; load().then(sayWhatHappened); }, LIVE_WAIT);
}

// ---- saying what just happened, to somebody who is already here
// A push notification is for somebody who is not looking. This is the other half: a line
// down from the top for somebody who is, which is not a notification at all — it lives in
// the app and goes away on its own.
//
// Two things never earn one. Somebody in your group posting: the feed fills in underneath
// you and a banner would only say what you can already see. And anything in the chat that
// is open in front of you: you are reading it.
//
// Resolved after the load rather than off the payload. A row arriving names ids, and
// whether a comment is on your post, or who somebody is, is only knowable once the tables
// it points at have caught up.
let saidQueue = [];
function noteWorthSaying(table, e) {
  if (e.eventType === 'DELETE') return;
  saidQueue.push({table, ev: e.eventType, row: e.new || {}});
  if (saidQueue.length > 12) saidQueue = saidQueue.slice(-12);   // a burst is not a backlog
}

function bannerFor({table, ev, row}) {
  const m = me(), actor = row.user_id || row.by_user || row.from_user;
  if (actor === m.id) return null;         // nothing you did is news to you
  const by = u => ({who: user(u), name: name(user(u))});
  const post = id => postById(id);
  const mine = p => p && p.userId === m.id;

  if (table === 'posts') return null;      // the feed fills in underneath you

  if (table === 'comments') {
    const p = post(row.post_id);
    if (!mine(p)) return null;
    return {...by(actor), text: `commented on your proof: ${esc(row.body || '')}`, go: `#comment-${row.id}`};
  }
  if (table === 'likes') {
    const p = post(row.post_id);
    return mine(p) ? {...by(actor), text: 'liked your proof', go: `#post-${row.post_id}`} : null;
  }
  if (table === 'reactions') {
    const p = post(row.post_id);
    return mine(p) ? {...by(actor), text: `reacted ${row.emoji || ''}`.trim(), go: `#post-${row.post_id}`} : null;
  }
  if (table === 'comment_likes') {
    const c = S.comments.find(x => x.id === row.comment_id);
    return c && c.userId === m.id ? {...by(actor), text: 'liked your comment', go: `#comment-${row.comment_id}`} : null;
  }
  if (table === 'story_likes' || table === 'story_reactions') {
    const st = S.stories.find(x => x.id === row.story_id);
    if (!st || st.u !== m.id) return null;
    return {...by(actor), text: table === 'story_likes' ? 'liked your story'
      : `reacted ${row.emoji || ''} to your story`.trim(), go: `#story-${m.id}`};
  }
  if (table === 'messages') {
    const msg = S.msgs.find(x => x.id === row.id);
    if (!msg) return null;
    const key = keyOf(msg);
    if (S.chat === key) return null;       // you are reading it
    const where = key.startsWith('g:') ? S.groups.find(g => g.id === +key.slice(2)) : null;
    return {...by(actor), text: `${where ? `in ${where.name}: ` : ''}${esc(row.body || '')}`, go: `#chat-${key}`};
  }
  if (table === 'message_reactions') {
    const msg = S.msgs.find(x => x.id === row.message_id);
    if (!msg || msg.userId !== m.id) return null;
    if (S.chat === keyOf(msg)) return null;
    return {...by(actor), text: `reacted ${row.emoji || ''} to your message`.trim(), go: `#chat-${keyOf(msg)}`};
  }
  if (table === 'flags') {
    const p = post(row.post_id);
    if (!p) return null;
    if (S.flag === row.id) return null;
    if (ev === 'UPDATE') {
      if (!row.outcome) return null;
      const yours = mine(p);
      return {...by(p.userId), text: row.outcome === 'upheld'
        ? `${yours ? 'Your' : 'Their'} ${esc(effort(p))} needs redoing — the group decided`
        : `${yours ? 'Your' : 'Their'} ${esc(effort(p))} stands — the group decided`, go: `#flag-${row.id}`};
    }
    return {...by(actor), text: mine(p) ? `questioned your ${esc(effort(p))}`
      : `questioned ${esc(name(user(p.userId)))}'s ${esc(effort(p))}`, go: `#flag-${row.id}`};
  }
  if (table === 'invites') {
    if (row.to_user !== m.id) return null;
    const g = row.group_id && S.groups.find(x => x.id === row.group_id);
    return {...by(actor), text: row.type === 'group' && g ? `invited you to ${esc(g.name)}` : 'wants to be friends',
      go: row.type === 'group' ? '#groups' : '#friends'};
  }
  // Somebody said yes. friendships has no user_id on it, so who to name is whichever half
  // of the pair is not you.
  if (table === 'friendships') {
    if (row.a !== m.id && row.b !== m.id) return null;
    const them = row.a === m.id ? row.b : row.a;
    return {...by(them), text: 'accepted your friend request', go: '#friends'};
  }
  if (table === 'group_members') {
    const g = S.groups.find(x => x.id === row.group_id);
    if (!g || !g.members.includes(m.id) || row.user_id === m.id) return null;
    return {...by(row.user_id), text: `joined ${esc(g.name)}`, go: '#groups'};
  }
  return null;
}

// One at a time, from the top, gone on its own. Three is the most anybody reads before they
// stop being information and start being weather.
const DROP_MS = 4800, DROP_MAX = 3;
let drops = [], dropTimer = null;
function sayWhatHappened() {
  const q = saidQueue; saidQueue = [];
  if (!me() || document.hidden) return;
  const seen = new Set();
  for (const it of q) {
    let card = null;
    try { card = bannerFor(it); } catch (e) { card = null; }
    if (!card) continue;
    const key = `${card.who.id}|${card.text}`;
    if (seen.has(key)) continue;
    seen.add(key);
    drops.push(card);
  }
  if (drops.length > DROP_MAX) drops = drops.slice(-DROP_MAX);
  if (drops.length && !dropTimer) nextDrop();
}
function nextDrop() {
  const box = $('#drop'), card = drops.shift();
  clearTimeout(dropTimer); dropTimer = null;
  if (!card) { box.hidden = true; box.innerHTML = ''; return; }
  box.innerHTML = `<button type="button" class="dropcard" onclick="takeDrop('${esc(card.go)}')">
    ${av(card.who, '')}<span class="gr"><b>${esc(card.name)}</b><span>${card.text}</span></span></button>
    <button type="button" class="x" onclick="nextDrop()" aria-label="Dismiss">✕</button>`;
  box.hidden = false;
  dropTimer = setTimeout(nextDrop, DROP_MS);
}
function takeDrop(go) {
  drops = [];
  clearTimeout(dropTimer); dropTimer = null;
  $('#drop').hidden = true; $('#drop').innerHTML = '';
  goTarget(go);
}

// ---- boot
// The library keeps the session alive on its own timer and can end it without the app
// asking — a refresh that finally fails after the phone has been offline, or a sign-out
// in another tab. Without this the screen kept showing a signed-in app that no longer was.
sb.auth.onAuthStateChange((event, session) => {
  if (event === 'INITIAL_SESSION') return;              // the first load() below covers this
  if (!session) { S.me = null; S.open = null; S.auth = 'welcome'; S.booting = false; hideErr(); dropLive(); render(); }
  else if (!me()) load();                               // signed in, or a refresh recovered while we sat on the welcome screen
});

// Last resort, and it goes first so that it covers the boot below too. Whatever we
// failed to anticipate, say so rather than leave a page that has stopped responding.
// An inline onclick that throws never reaches the rejection catcher below: it is a plain
// error event, and until now it went nowhere. A tap that silently does nothing is the
// hardest bug to report, so it goes on the bar like everything else.
addEventListener('error', e => {
  if (!e.error || document.hidden || noise(e.error)) return;
  showErr(`Something went wrong: ${e.error.message || e.message}`, e.error.stack, true);
});
addEventListener('unhandledrejection', e => {
  if (e.reason?.shown || document.hidden || noise(e.reason)) return;   // q() already put it in front of them
  showErr(`Something went wrong: ${e.reason?.message || e.reason}`, e.reason?.stack, true);
});

// ---- behaving like an application rather than a page
// Safari honours user-scalable=no in an installed app and ignores it in a tab, and
// pinching is its own gesture either way. These are the two that are left.
addEventListener('gesturestart', e => e.preventDefault());
addEventListener('gesturechange', e => e.preventDefault());
addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, {passive: false});

// Where the bottom of the screen really is. A fixed element is pinned to the layout
// viewport, which during a URL-bar collapse or with a keyboard up is not what anyone is
// looking at — which is the tab bar wandering off on its own.
// Something is being typed into. Worth knowing separately from the viewport, because it
// is true the instant the field is tapped, while the viewport only catches up as the
// keyboard slides in — and reading it mid-animation is the bar visibly riding up the
// screen before it goes away.
const typing = () => {
  const el = document.activeElement;
  if (!el) return false;
  if (el.tagName === 'TEXTAREA') return true;
  return el.tagName === 'INPUT' && !/^(button|submit|reset|checkbox|radio|range|file|color|image)$/.test(el.type);
};
function fitBar() {
  const vv = self.visualViewport, root = document.documentElement;
  const keys = typing();
  const gap = vv ? Math.max(0, Math.round(innerHeight - vv.height - vv.offsetTop)) : 0;
  // One number, deliberately: a toolbar sliding away is tens of pixels and a keyboard is
  // hundreds, so above this the bar is put away and below it the bar follows. Two
  // thresholds would leave a band in between — exactly where a keyboard's opening frames
  // land — in which the bar rides a long way up the screen before vanishing.
  const KEYBOARD = 120;
  root.style.setProperty('--vvb', `${keys || gap > KEYBOARD || gap <= 4 ? 0 : gap}px`);
  // The bar is put away when a keyboard is up, but a bottom sheet has to climb over it:
  // a dialog is pinned to the layout viewport, which the keyboard does not shrink, so the
  // box being typed into ends up underneath it. This is the real height, not the offset.
  root.style.setProperty('--kb', `${gap > 4 ? gap : 0}px`);
  root.classList.toggle('keys', keys || gap > KEYBOARD);
}
if (self.visualViewport) {
  visualViewport.addEventListener('resize', fitBar);
  visualViewport.addEventListener('scroll', fitBar);
}
addEventListener('resize', fitBar);
addEventListener('orientationchange', fitBar);
addEventListener('focusin', fitBar);
// focusout lands before the focusin that follows it, so moving between two fields would
// flash the bar back for a frame. Let the focus settle first.
addEventListener('focusout', () => setTimeout(fitBar, 0));
fitBar();

// A notification is worth tapping only if it arrives somewhere. The service worker sends
// the app to /#post-<id>; this is the other half, run once the feed has something in it.
// A notification is worth tapping only if it arrives somewhere. The service worker sends
// the app to /#post-<id> and the like; this is the other half, run once the feed has
// something in it. A banner from the top asks for the same journeys, so the dispatch is a
// function of a target rather than of the address bar, and both go through it.
function goToHash() {
  const h = location.hash;
  if (!h) return;
  history.replaceState(null, '', location.pathname);
  goTarget(h);
}
// Out of whatever is open first, then in, so the way back out lands where it should.
function clearTo(tab = 'feed') {
  S.tab = tab; S.open = S.who = S.flag = S.flagFrom = S.chat = null; S.settings = false;
  backY.length = 0;
  closePost(); closeStory();
  render();
}
function goTarget(hash) {
  const m = /^#post-(\d+)$/.exec(hash || '');
  if (m) {
    const id = +m[1];
    if (!S.posts.some(p => p.id === id)) return;
    clearTo();
    const el = document.querySelector(`[data-post="${id}"]`);
    if (el) el.scrollIntoView({block: 'start'});
    return;
  }
  // A notification about a comment lands on the comment, not near it: the post is opened,
  // the reply is scrolled to and marked for a second so the eye finds it among twenty.
  const cm = /^#comment-(\d+)$/.exec(hash || '');
  if (cm) {
    const cid = +cm[1], c = S.comments.find(x => x.id === cid);
    if (!c || !S.posts.some(p => p.id === c.postId)) return;
    clearTo();
    const el = document.querySelector(`[data-cmt="${cid}"]`);
    if (el) {
      el.scrollIntoView({block: 'center'});
      el.classList.add('found');
      setTimeout(() => el.classList.remove('found'), 2200);
    }
    return;
  }
  const sm = /^#story-([0-9a-f-]+)$/i.exec(hash || '');
  if (sm) {
    if (storiesOf(sm[1]).length) { clearTo(); openStory(sm[1]); }
    return;
  }
  // A message lands in the conversation it belongs to, scrolled to the end of it, which is
  // where the thing you were told about is.
  const ch = /^#chat-((?:g:\d+|u:[\w-]+))$/i.exec(hash || '');
  if (ch) {
    const key = ch[1];
    // Whether it names a real conversation, rather than whether it is shaped like one. A
    // key that looks right and points at nobody opens an empty chat with "?" at the top of
    // it, which is worse than doing nothing.
    const real = S.noChat ? false : key.startsWith('g:')
      ? myGroups().some(g => g.id === +key.slice(2))
      : key.slice(2) !== me().id
        && (S.friends.includes(key.slice(2)) || S.msgs.some(x => keyOf(x) === key));
    if (!real) return;
    clearTo();
    openChat(key);
    return;
  }
  // A flag lands on the flag, which is the only place its clock, its reason and its vote
  // all are. Straight there, not near it.
  const fm = /^#flag-(\d+)$/.exec(hash || '');
  if (fm) {
    const id = +fm[1];
    if (!S.flags.some(f => f.id === id)) return;
    clearTo();
    openFlag(id);
    return;
  }
  if (hash === '#friends' || hash === '#groups') go(hash.slice(1));
}
addEventListener('hashchange', goToHash);

// Nothing here is allowed to leave the page blank. Paint first, then fill it in.
render();
load();

// ---- self-check: open index.html#test and look at the console
if (location.hash === '#test') {
  const g = {id: 1, quotas: [{metric: 'pushups', target: 50}]}, T = today(), Y = daysAgo(1);
  S.totals = [{g: 1, u: 'a', d: T, m: 'pushups', n: 20}, {g: 1, u: 'a', d: T, m: 'pushups', n: 30}, {g: 1, u: 'a', d: Y, m: 'pushups', n: 50}, {g: 1, u: 'a', d: daysAgo(2), m: 'pushups', n: 50},
    {g: 1, u: 'a', d: daysAgo(4), m: 'pushups', n: 50}, {g: 1, u: 'b', d: Y, m: 'pushups', n: 60}, {g: 2, u: 'a', d: T, m: 'pushups', n: 7}];
  console.assert(done(g, 'a', 'pushups') === 50, 'sums only today, this user, this group');
  console.assert(streak(g, 'a') === 3, 'streak counts today + 2 previous days, gap at day 3');
  console.assert(streak(g, 'b') === 1, 'streak still alive if yesterday was hit and today is in progress');
  console.assert(best(g, 'a') === 3 && best(g, 'b') === 1, 'best streak');
  console.assert(streak(g, 'zzz') === 0, 'no posts, no streak');
  console.assert(name({username: 'sam'}) === 'sam' && name({username: 'sam', display_name: 'Sam D'}) === 'Sam D', 'display name falls back to username');
  console.log('self-check ok');
}
</script>
