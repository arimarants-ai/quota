<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f4c5c">
<title>Quota</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 132 132%22%3E%3Crect width=%22132%22 height=%22132%22 rx=%2230%22 fill=%22%230F4C5C%22/%3E%3Ccircle cx=%2266%22 cy=%2266%22 r=%2246%22 fill=%22none%22 stroke=%22rgba(255,255,255,.16)%22 stroke-width=%2218%22/%3E%3Ccircle cx=%2266%22 cy=%2266%22 r=%2246%22 fill=%22none%22 stroke=%22%23F4813A%22 stroke-width=%2218%22 stroke-linecap=%22round%22 stroke-dasharray=%22216 289%22 transform=%22rotate(-90 66 66)%22/%3E%3Crect x=%2286%22 y=%2286%22 width=%2222%22 height=%2234%22 rx=%2211%22 fill=%22%23F4813A%22 transform=%22rotate(-45 97 103)%22/%3E%3C/svg%3E">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Quota">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Unbounded:wght@800&display=swap">
<style>
:root{--bg:#fff;--card:#fff;--line:#e3ebee;--text:#12212b;--muted:#5e7580;--soft:#eef3f5;--teal:#0f4c5c;--teal2:#a9d3dc;--acc:#ff8a3d;--ok:#0f4c5c;--okbg:#e2eff2;--todo:#cfd9dd;--sheet:#fff;--barbg:rgba(255,255,255,.9)}
:root[data-theme=dark]{--bg:#0b0b0d;--card:#16161b;--line:#26262d;--text:#f2f2f5;--muted:#9a9aa6;--soft:#1f1f25;--okbg:#0f2a31;--todo:#2c2c34;--sheet:#16161b;--barbg:rgba(22,22,27,.92)}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 "Plus Jakarta Sans",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
main{max-width:600px;margin:0 auto;padding:0 0 120px;position:relative;min-height:100vh}
main.out{padding-bottom:0;min-height:0}
.num{font-family:Unbounded,system-ui,sans-serif;font-weight:800;font-variant-numeric:tabular-nums}
h2{margin:0;font-size:17px;font-weight:800}
h3{margin:22px 18px 8px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
p{margin:0}
button{font:inherit;font-weight:800;border:0;border-radius:12px;padding:11px 16px;background:var(--soft);color:var(--text);cursor:pointer;white-space:nowrap}
button:active{transform:scale(.97)}
button.primary{background:var(--acc);color:#fff}
button.teal{background:var(--teal);color:#fff}
button.small{padding:7px 12px;font-size:13px}
button.ghost{background:none;color:var(--muted);padding:6px 4px;font-weight:600}
button:disabled{opacity:.6}
input,select,textarea{font:inherit;width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);min-width:0;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(15,76,92,.15)}
textarea{resize:vertical;line-height:1.5}
.check input{width:19px}
input[type=file]{padding:10px;font-size:14px}
label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:12px 0 6px}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--muted);font-size:13px;font-weight:600}
/* header block */
.hdr{background:var(--teal);color:#fff;padding:calc(16px + env(safe-area-inset-top)) 20px 22px;border-radius:0 0 30px 30px}
.hdr .top{display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:800;font-size:20px;letter-spacing:-.02em;color:var(--acc);display:flex;align-items:center;gap:8px}
.logo svg{width:26px;height:26px}
.hdr .date{font-size:13px;color:var(--teal2);font-weight:600}
.hdr h1{margin:14px 0 0;font-size:28px;font-weight:800;letter-spacing:-.02em}
.hdr .big{display:flex;align-items:baseline;gap:10px;margin-top:14px}
.hdr .big b{font-size:72px;letter-spacing:-.05em;line-height:.9}
.hdr .big div{font-weight:700;font-size:15px;line-height:1.3}
.hdr .big div small{display:block;color:var(--teal2);font-weight:600;font-size:13px}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-top:16px}
.mini div{font-size:12px;font-weight:600;color:var(--teal2)}
.mini div b{color:#fff;font-weight:800}
.mini i{display:block;height:4px;background:rgba(255,255,255,.18);margin-top:6px;border-radius:2px;overflow:hidden}
.mini i::after{content:"";display:block;height:100%;background:var(--acc);width:var(--w)}
.mini i.done::after{background:#fff}
/* cards */
.card{margin:14px 18px;border:1px solid var(--line);border-radius:18px;padding:16px;background:var(--card)}
.card h2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h2 span{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
.q{margin-top:14px}
.q .t{display:flex;justify-content:space-between;font-weight:700;font-size:14px}
.q .t span{color:var(--muted)}
.tr{height:10px;border-radius:6px;background:var(--soft);margin-top:6px;overflow:hidden}
.tr i{display:block;height:100%;border-radius:6px;background:var(--acc);transition:width .4s}
.tr i.done{background:var(--ok)}
.ppl{display:flex;margin-top:14px;align-items:center}
.ppl .av{border:2px solid var(--card);margin-left:-8px}
.ppl .av:first-child{margin-left:0}
.ppl span{margin-left:10px}
.av{width:30px;height:30px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px;flex:none;text-transform:uppercase;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.todo{background:var(--todo);color:var(--text)}
.av.todo img{opacity:.45}
.av.lg{width:40px;height:40px;font-size:15px}
.av.xl{width:76px;height:76px;font-size:30px}
.chip{display:inline-block;padding:4px 10px;border-radius:999px;background:var(--soft);font-size:12px;font-weight:700;white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)}
.empty{text-align:center;padding:28px 16px}
.empty b{display:block;font-size:16px;margin-bottom:4px}
.check{display:flex;align-items:center;gap:9px;margin-top:14px;font-weight:700;font-size:14px}
.check input{width:19px;height:19px;margin:0;flex:none;accent-color:var(--acc)}
.check span{font-weight:700}
.chalpick{margin-top:8px}
.chalpick[hidden]{display:none}
.warn{color:#e5484d;font-size:13px;font-weight:600}
.prog{display:block;height:5px;background:var(--soft);border-radius:3px;overflow:hidden;margin-top:10px}
.prog::after{content:"";display:block;height:100%;background:var(--acc);width:var(--w,0%);transition:width .25s}
.prog[hidden]{display:none}
.rank{flex:none;width:20px;text-align:center;font-family:Unbounded,system-ui,sans-serif;font-weight:800;font-size:13px;color:var(--muted)}
.rank.top{color:var(--acc)}
.list{padding:4px 16px}
.list .row{padding:10px 0;border-top:1px solid var(--line)}
.list .row:first-child{border-top:0}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px;text-align:center}
.stats div{background:var(--soft);border-radius:12px;padding:10px 4px}
.stats b{display:block;font-size:20px;color:var(--teal)}
.stats small{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
/* posts */
.post{padding:0;overflow:hidden}
.reel{position:relative;aspect-ratio:4/5;background:#000;color:#fff}
.reel video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000} /* ponytail: cover crops landscape clips; switch to contain if people film sideways */
.reel::after{content:"";position:absolute;left:0;right:0;bottom:0;height:45%;background:linear-gradient(to top,rgba(0,0,0,.6),transparent);pointer-events:none}
.reel .ov{position:absolute;left:0;right:0;padding:14px;z-index:2;pointer-events:none}
.reel .ov.top{top:0;display:flex;align-items:center;gap:10px;background:linear-gradient(to bottom,rgba(0,0,0,.45),transparent)}
.reel .ov.bot{bottom:0;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.reel .av{background:#fff;color:var(--teal);width:34px;height:34px;font-size:14px}
.reel .who{font-weight:800;font-size:15px;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.reel .when{font-size:12px;color:#d6e4e8}
.reel .badge{margin-left:auto;background:var(--acc);color:#fff;font-family:Unbounded;font-weight:800;font-size:11px;padding:6px 10px;border-radius:8px;text-transform:uppercase}
.reel .cap{font-size:15px;font-weight:700;text-shadow:0 1px 8px rgba(0,0,0,.7)}
.reel .play{position:absolute;inset:0;display:grid;place-items:center;z-index:1;pointer-events:none}
.reel .play i{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.7);display:grid;place-items:center;backdrop-filter:blur(6px)}
.reel .play i::after{content:"";border-left:16px solid #fff;border-top:10px solid transparent;border-bottom:10px solid transparent;margin-left:4px}
.reel.playing .play{display:none}
/* The caption stays up while the video plays. The gradient behind it shrinks instead of
   going away, so the text still has something to sit on, and the extra bottom padding
   lifts it clear of the native controls rather than letting them sit on top of it. */
.reel.playing::after{height:26%}
.reel.playing .ov.bot{padding-bottom:54px}
.cmts{padding:10px 16px 14px}
.c{display:flex;gap:8px;padding:7px 0;font-size:14px;align-items:flex-start}
.c b{font-weight:800;flex:none}
.c span{color:var(--muted);flex:1;font-weight:500}
.c .x{background:none;padding:0 4px;color:var(--muted);font-weight:600;font-size:13px}
.cin{display:flex;gap:8px;margin-top:6px}
.cin input{padding:10px 12px;font-size:14px}
.cin button{padding:0 14px}
.postfoot{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
/* bubble bar */
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:min(92vw,400px);background:var(--barbg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:999px;display:grid;grid-template-columns:1fr 1fr auto 1fr 1fr;align-items:center;padding:6px;box-shadow:0 12px 30px -10px rgba(0,0,0,.35);z-index:6}
.bar button{background:none;padding:7px 0 5px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:700;color:var(--muted);border-radius:999px}
.bar button.on{color:var(--teal);background:var(--soft)}
:root[data-theme=dark] .bar button.on{color:#fff}
.bar button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bar .add{width:50px;height:50px;border-radius:50%;background:var(--acc);color:#fff;font-size:28px;font-weight:800;display:grid;place-items:center;margin:0 6px;padding:0;line-height:1;box-shadow:0 10px 24px -8px rgba(255,138,61,.9)}
.bar .add svg{width:26px;height:26px;stroke:#fff;stroke-width:2.5}
.bar .add:disabled{opacity:.4}
.bar[hidden]{display:none}
dialog{background:var(--sheet);color:var(--text);border:0;border-radius:24px 24px 0 0;width:100%;max-width:100%;margin:auto 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.2)}
dialog::backdrop{background:rgba(18,33,43,.5);backdrop-filter:blur(2px)}
dialog h2{font-size:20px;margin-bottom:2px}
@media(min-width:640px){dialog{border-radius:24px;width:min(92vw,460px);margin:auto}}
/* welcome + auth */
.welcome{min-height:100vh;min-height:100dvh;background:var(--teal);color:#fff;display:flex;flex-direction:column;padding:calc(28px + env(safe-area-inset-top)) 24px calc(28px + env(safe-area-inset-bottom))}
.welcome .mark svg{width:60px;height:60px}
.welcome h1{margin:auto 0 0;font-size:42px;font-weight:800;letter-spacing:-.03em;line-height:1.05;text-wrap:balance}
.welcome p{color:var(--teal2);font-weight:600;font-size:17px;line-height:1.45;margin:16px 0 26px;max-width:32ch}
.welcome .primary{width:100%;padding:16px;border-radius:999px;font-size:17px}
.welcome .ghost{color:var(--teal2);align-self:center;margin-top:10px;font-weight:600}
.auth{max-width:400px;margin:8vh auto 0;padding:env(safe-area-inset-top) 18px 0;text-align:center}
.auth .word{display:inline-flex;align-items:center;gap:10px;font-family:Unbounded,system-ui,sans-serif;font-weight:800;font-size:34px;letter-spacing:-.03em;color:var(--teal)}
.auth .word svg{width:44px;height:44px}
.auth h2{font-size:22px;margin:18px 0 4px}
.auth p{color:var(--muted);font-weight:600;margin:0 0 18px}
.auth .card{margin:0;text-align:left}
.auth .card .primary{width:100%;margin-top:18px;padding:13px}
.auth .switch{margin-top:14px;color:var(--muted);font-weight:600}
.auth .switch button{padding:0 4px;background:none;color:var(--teal)}
.back{margin:12px 18px 0}
/* recording in the app */
#cam{position:fixed;inset:0;width:100%;max-width:100%;height:100%;max-height:100%;margin:0;padding:0;
  border:0;border-radius:0;background:#000;box-shadow:none;display:flex;flex-direction:column;overflow:hidden}
#cam:not([open]){display:none}
#cam::backdrop{background:#000}
#campre{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.camtop{position:relative;z-index:2;display:flex;align-items:center;gap:12px;
  padding:calc(12px + env(safe-area-inset-top)) 16px 0}
.camtop button{background:rgba(0,0,0,.45);color:#fff;border-radius:999px;width:38px;height:38px;padding:0;font-size:17px}
.camtop span{color:#fff;font-weight:800;font-family:Unbounded,system-ui,sans-serif;font-size:15px;
  text-shadow:0 1px 6px rgba(0,0,0,.6)}
.cambot{position:relative;z-index:2;margin-top:auto;display:grid;place-items:center;
  padding:0 0 calc(28px + env(safe-area-inset-bottom))}
.shutter{width:74px;height:74px;border-radius:50%;padding:0;background:rgba(255,255,255,.25);
  border:4px solid #fff;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.shutter.on{background:var(--acc);border-radius:18px;width:58px;height:58px}
.shutter[disabled]{opacity:.45}
.camwhy{position:relative;z-index:2;margin:auto 22px;color:#fff;font-weight:700;text-align:center;line-height:1.4}
.camwhy[hidden]{display:none}

/* the wheel */
.wheelbox{position:relative;width:min(260px,72vw);margin:14px auto 0;aspect-ratio:1}
.wheel-face{width:100%;height:100%;display:block;filter:drop-shadow(0 10px 24px rgba(0,0,0,.22))}
/* 4.2s, slowing right down at the end, so it reads as a wheel losing momentum */
.wheel-spin{width:100%;height:100%;transition:transform 4.2s cubic-bezier(.15,.85,.15,1)}
.pointer{position:absolute;top:-3px;left:50%;translate:-50% 0;z-index:2;width:0;height:0;
  border-left:11px solid transparent;border-right:11px solid transparent;border-top:19px solid var(--text);
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.stage{transition:opacity .3s}
.stage.later{opacity:0;height:0;overflow:hidden}
.stagelabel{margin:18px 0 -4px;text-align:center;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.landed{text-align:center;font-family:Unbounded,system-ui,sans-serif;font-weight:800;font-size:19px;
  margin:14px 0 0;opacity:0;transform:translateY(6px);transition:opacity .35s,transform .35s}
.landed.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.wheel-spin{transition-duration:1.2s}}

/* a wheel as it appears in the group */
.wh{border:1px solid var(--line);border-radius:16px;padding:13px 14px;margin-top:10px}
.wh:first-of-type{margin-top:0}
.wh .top{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;padding:0;
  font:inherit;color:inherit;text-align:left;cursor:pointer}
.wh .top:active{transform:none;opacity:.6}
.wh .chev{width:16px;height:16px;flex:none;margin-left:-2px;stroke:var(--muted);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.wh b{font-size:15px}
.wh .when{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
.wh .got{font-weight:800;font-size:15px;margin-top:8px}
.wh .got.out{color:var(--muted);font-weight:700}
.wh .who{font-size:13px;font-weight:600;color:var(--muted);margin-top:2px}
.due{border-color:var(--acc);background:linear-gradient(180deg,rgba(244,129,58,.10),transparent)}
.spinday{border-color:var(--acc)}
.spinday b{font-family:Unbounded,system-ui,sans-serif;font-size:15px}
.spinday p{margin-top:4px}
.ticks{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tick{display:inline-block;padding:6px 9px;border-radius:9px;border:1px solid var(--line);background:var(--card);
  font-size:12px;font-weight:700;color:var(--muted)}
.tick.on{background:var(--okbg);border-color:var(--ok);color:var(--ok)}

/* the splash while the first load runs, and the banner when it fails */
.splash{display:flex;flex-direction:column;align-items:center;gap:18px;padding-top:28vh;color:var(--muted)}
.splash svg{width:64px;height:64px}
.splash i{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.splash i{animation-duration:2.4s}}
#err{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));max-width:576px;margin:0 auto;z-index:30;display:flex;gap:12px;align-items:center;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:0 12px 30px -10px rgba(0,0,0,.35);font-size:13px;font-weight:600;line-height:1.35}
#err[hidden]{display:none}
#err span{flex:1;min-width:0}
#err button{flex:none;background:var(--soft);color:var(--teal);padding:7px 12px;font-size:13px}
/* iOS Safari has no install prompt, so this explains Add to Home Screen once */
#a2hs{position:fixed;top:calc(10px + env(safe-area-inset-top));left:12px;right:12px;max-width:576px;margin:0 auto;z-index:20;display:flex;gap:12px;align-items:center;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:0 12px 30px -10px rgba(0,0,0,.35)}
#a2hs[hidden]{display:none}
#a2hs .share{width:26px;height:26px;flex:none;stroke:var(--acc);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#a2hs p{flex:1;min-width:0;font-size:13px;line-height:1.35}
#a2hs b{display:block;font-size:14px}
#a2hs span{color:var(--muted);font-weight:600}
#a2hs button{background:none;color:var(--muted);padding:4px 6px;font-size:15px;flex:none}
</style>
</head>
<body>
<main id="app"></main>
<nav class="bar" id="bar" hidden></nav>
<dialog id="dlg"></dialog>
<div id="err" hidden role="alert"><span></span><button onclick="load()">Retry</button></div>
<dialog id="cam">
  <video id="campre" playsinline muted autoplay></video>
  <div class="camtop"><button type="button" onclick="closeCam()" aria-label="Close">✕</button><span id="camtime"></span></div>
  <div class="cambot"><button type="button" id="camgo" class="shutter" onclick="toggleRec()" aria-label="Record" disabled></button></div>
  <p id="camwhy" class="camwhy" hidden></p>
</dialog>
<div id="a2hs" hidden>
  <svg class="share" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v11M12 3l-4 4M12 3l4 4"/><path d="M6 12v7a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-7"/></svg>
  <p><b>Add Quota to your home screen</b><span>Tap the Share button, then “Add to Home Screen”.</span></p>
  <button onclick="dismissA2HS()" aria-label="Dismiss">✕</button>
</div>
<script src="/vendor/supabase-js-2.49.4/supabase.js"></script>
<script>
// Everything below depends on that one file. Off a CDN it could fail to arrive — an
// installed app often opens before the phone has a connection — and the page then sat
// blank with nothing on it at all. It is served from this origin and precached now, so
// this should not happen, but a white screen is the worst possible way to find out.
if (typeof supabase === 'undefined') {
  document.getElementById('app').innerHTML = '<div class="auth"><h2>Quota could not start</h2><p>Part of the app did not load.</p><button class="primary" onclick="location.reload()">Try again</button></div>';

const hit = (g, uid, day = today()) => g.quotas.every(qq => done(g, uid, qq.metric, day) >= qq.target);
// streak: consecutive hit days ending today (or yesterday, since today may still be in progress)
const hitDays = (g, uid) => new Set([...new Set(S.totals.filter(t => t.g === g.id && t.u === uid).map(t => t.d))].filter(d => hit(g, uid, d)));
// A wheel set to break the streak does it on the day its cycle closes, not on the day it
// was spun: you had the whole cycle to finish, so the day it runs out is the day it counts
// against you. A cycle still running is never judged, and neither is one that ends today.
function brokeStreak(g, uid, day) {
  return wheelsOf(g).some(w => {
    if (!w.breaks_streak || day >= today()) return false;
    const c = cycleOf(w, day);
    if (c < 0 || cycleEnd(w, c) !== day) return false;

    return !sp || (!satOut(sp) && !challengeDone(g, sp));

}
// The days that count towards a streak: quota hit, and no challenge left unfinished.
// hit() itself stays about the quota alone, so the chips and the completion rate keep
// meaning what they say.
const goodDays = (g, uid) => { const d = hitDays(g, uid); for (const x of [...d]) if (brokeStreak(g, uid, x)) d.delete(x); return d; };
const streak = (g, uid) => { const days = goodDays(g, uid); let n = 0, i = days.has(today()) ? 0 : 1; while (days.has(daysAgo(i))) { n++; i++; } return n; };
const best = (g, uid) => { const days = [...goodDays(g, uid)].sort(); let b = 0, n = 0, prev = null; for (const d of days) { n = prev && (Date.parse(d) - Date.parse(prev)) === 864e5 ? n + 1 : 1; b = Math.max(b, n); prev = d; } return b; };
// ---- wheels
// Cycles are counted in whole days from the anchor, so everyone in the group is always on
// the same one. Date strings are parsed as UTC on both sides, so a clock change in the
// middle of a cycle cannot shift the count by a day.
const dayNo = d => Math.round(Date.parse(d) / 864e5);
const fromDayNo = n => new Date(n * 864e5).toISOString().slice(0, 10);
const cycleOf = (w, d = today()) => Math.floor((dayNo(d) - dayNo(w.starts_on)) / w.every_days);
const cycleStart = (w, c = cycleOf(w)) => fromDayNo(dayNo(w.starts_on) + c * w.every_days);
const cycleEnd = (w, c = cycleOf(w)) => fromDayNo(dayNo(w.starts_on) + (c + 1) * w.every_days - 1);
const running = w => w.active && today() >= w.starts_on;
const wheelsOf = g => S.wheels.filter(w => w.group_id === g.id && w.active).sort((a, b) => a.id - b.id);
const spinOf = (w, uid, c = cycleOf(w)) => S.spins.find(sp => sp.wheel_id === w.id && sp.user_id === uid && sp.cycle === c);
// What this person still owes in this group right now. The database enforces the same
// thing on insert; this is so the app can put the wheel in front of them first.
const dueIn = g => wheelsOf(g).filter(w => running(w) && !spinOf(w, me().id));
const anyDue = () => myGroups().filter(g => dueIn(g).length);

// Sitting a cycle out is a decision about it, so it counts as dealt with: no challenge to
// finish, nothing to fill in, and nothing held against you when the cycle closes.
const satOut = sp => !!sp && sp.sat_out;

// their own. Posts done without it neither help nor spoil the day — a day is either a
// full day of the challenge or it is not.
function challengeDays(g, sp) {

// How many days the challenge has to be done on. A wheel with a day wheel on it says so.

// How often someone actually hits the whole quota, over the last 30 days or since the
// group started if that is sooner. Today is left out: it is still in progress, and
// counting it would drag everyone down every morning.
function rate(g, uid) {
  const began = g.created_at ? Date.parse(g.created_at) : 0, days = [];
  for (let i = 1; i <= 30; i++) {
    const d = daysAgo(i);
    if (Date.parse(`${d}T23:59`) < began) break;
    days.push(d);
  }
  if (!days.length) return null;

  return {n, of: days.length, pct: Math.round(n / days.length * 100)};

async function fetchAll() {
  const {data: {session}} = await sb.auth.getSession();
  if (!session) { S.me = null; return; }
  const uid = session.user.id;
  const [fr, inv, gm, groups, posts, totals, wheels, stages, spins, ticks] = await Promise.all([
    q(sb.from('friendships').select('a,b')),
    q(sb.from('invites').select('*')),
    q(sb.from('group_members').select('*')),
    q(sb.from('groups').select('*')),
    q(sb.from('posts').select('*').order('created_at', {ascending: false}).limit(200)),
    q(sb.from('posts').select('group_id,user_id,day,metric,amount,spin_id,challenge')), // ponytail: whole history, aggregated client-side; move to a SQL view if it ever gets slow
    q(sb.from('wheels').select('*')),
    q(sb.from('wheel_stages').select('*').order('seq')),
    q(sb.from('spins').select('*')),
    q(sb.from('wheel_days').select('*')),
  ]);
  S.wheels = wheels.map(w => ({...w, stages: stages.filter(st => st.wheel_id === w.id)}));
  S.spins = spins; S.ticks = ticks;
  S.friends = fr.map(f => f.a === uid ? f.b : f.a);
  S.invites = inv.map(i => ({id: i.id, type: i.type, from: i.from_user, to: i.to_user, groupId: i.group_id}));
  S.groups = groups.map(g => ({...g, members: gm.filter(m => m.group_id === g.id).map(m => m.user_id)}));
  S.totals = totals.map(t => ({g: t.group_id, u: t.user_id, d: t.day, m: t.metric, n: t.amount, sp: t.spin_id, ch: t.challenge}));
  S.posts = posts.map(p => ({id: p.id, groupId: p.group_id, userId: p.user_id, metric: p.metric, amount: p.amount, caption: p.caption, path: p.video_path, day: p.day, ts: Date.parse(p.created_at), challenge: p.challenge, spinId: p.spin_id}));
  if (S.posts.length) { const urls = await q(sb.storage.from('proof').createSignedUrls(S.posts.map(p => p.path), 3600)); urls.forEach((u, i) => S.posts[i].url = u.signedUrl); }
  const {data: cm, error: ce} = S.posts.length ? await sb.from('comments').select('*').in('post_id', S.posts.map(p => p.id)).order('created_at') : {data: []};
  S.noComments = !!ce; S.comments = (cm || []).map(c => ({id: c.id, postId: c.post_id, userId: c.user_id, body: c.body}));
  const ids = [...new Set([uid, ...S.friends, ...S.invites.flatMap(i => [i.from, i.to]), ...gm.map(m => m.user_id), ...S.posts.map(p => p.userId), ...S.comments.map(c => c.userId)])];
  S.profiles = Object.fromEntries((await q(sb.from('profiles').select('*').in('id', ids))).map(p => [p.id, p]));
  S.me = S.profiles[uid];
  if (!S.me) { alert('Your profile was not created. Check that schema.sql ran without errors.'); await sb.auth.signOut(); }
  else keepTz();
}

// The spin-day reminder has to go out in the morning, and the server has no idea when
// that is for anyone. This is the only place that knows. Written once, and again if
// someone travels; a failure here costs a reminder at the wrong hour, nothing more.
async function keepTz() {
  let tz = '';
  try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) {}
  if (!tz || tz === S.me.tz) return;
  try { await sb.from('profiles').update({tz}).eq('id', S.me.id); S.me.tz = tz; } catch (e) {}
}

// ---- loading, and what to do when it fails
// render() used to run only at the end of a successful fetch, so anything that went
// wrong left an empty page behind: an alert saying "JWT expired" and then nothing.
// Now every path ends in a render, and the page paints before the first fetch even starts.
const showErr = msg => { const e = $('#err'); e.querySelector('span').textContent = msg; e.hidden = false; };
const hideErr = () => { $('#err').hidden = true; };
// An access token that went stale while the app was closed is the ordinary case for an
// installed app: it can sit suspended for days. Worth one forced refresh before giving up.
const authErr = e => e && (e.status === 401 || e.code === 'PGRST301' || /jwt|token|not authenticated|unauthorized/i.test(e.message || ''));

let inFlight = null, lastLoad = 0;
function load() { return inFlight || (inFlight = runLoad().finally(() => { inFlight = null; lastLoad = Date.now(); })); }

async function runLoad() {
  quiet++;
  try {
    try { await fetchAll(); }
    catch (e) {
      if (!authErr(e)) throw e;
      const {data, error} = await sb.auth.refreshSession();
      if (error || !data.session) { S.me = null; S.open = null; S.auth = 'welcome'; hideErr(); return; } // signed out for real, not just stale
      await fetchAll();
    }
    hideErr();
  } catch (e) {
    showErr(navigator.onLine ? `Could not load: ${e.message || 'something went wrong'}` : 'You are offline. Showing what was already here.');
  } finally {
    quiet--; S.booting = false; render();
  }

// One wheel inside a group: what you owe or what you got, then what everyone else got.
// Seeing each other's result is the whole point, so it is not tucked away anywhere.
function wheelCard(g, w) {
  const m = me(), c = cycleOf(w), mine = spinOf(w, m.id, c), soon = !running(w);
  const others = g.members.filter(id => id !== m.id).map(id => ({id, sp: spinOf(w, id, c)}));
  const head = `<button class="top" onclick="wheelInfoDlg(${w.id})" title="See what is on this wheel">
      <b>${esc(w.name)}</b><span class="when">${soon ? `starts ${dayLabel(w.starts_on)}`
    : `every ${plural(w.every_days, 'day')} · next ${dayLabel(cycleStart(w, c + 1))}`}</span>
      <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>`
    + (w.breaks_streak ? `<div class="who">Not finishing this breaks your streak.</div>` : '');
  const yours = soon ? '' : !mine
    ? `<div class="row" style="margin-top:10px"><button class="primary grow" onclick="spinDlg(${g.id})">Spin the wheel</button></div>`
    : satOut(mine)
    ? `<div class="got out">Sitting this one out</div><div class="who">Back on ${dayLabel(cycleStart(w, c + 1))}.</div>`
    : mustBorrow(mine) && !mine.challenge_override
    ? `<div class="got">${esc(BORROW)}</div><div class="who">Pick whose you are doing before it can count.</div>
       <div class="row" style="margin-top:10px"><button class="primary grow" onclick="borrowDlg(${mine.id})">Choose whose</button></div>`
    : `<div class="got">${esc(effChallenge(mine))}${mine.challenge_override ? ` <span class="muted" style="font-weight:600">(borrowed)</span>` : ''}</div>${trackRow(g, w, mine)}`;
  const rest = others.length ? `<div class="who">${others.map(o => `${esc(name(user(o.id)))}: ${!o.sp ? 'not spun yet'
    : satOut(o.sp) ? 'sitting out'
    : mustBorrow(o.sp) && !o.sp.challenge_override ? 'picking whose to do'
    : esc(effChallenge(o.sp)) + (challengeDone(g, o.sp) ? ' ✓' : '')}`).join('<br>')}</div>` : '';
  return `<div class="wh${!soon && !mine ? ' due' : ''}">${head}${yours}${rest}</div>`;
}

// How the cycle is going. Nothing to tick any more: a day fills when that day's quota has
// been met with the challenge, which is what posting with the box ticked records.
function trackRow(g, w, sp) {
  const need = requiredDays(w, sp);
  if (!need) return `<div class="who">Nothing to do this time.</div>`;
  const filled = challengeDays(g, sp), days = cycleDays(w, sp.cycle);
  const label = `${filled.length} of ${plural(need, 'day')} done`;
  return `<div class="who">${challengeDone(g, sp) ? `Done — ${label}` : label}</div>
    <div class="ticks">${days.map(d => `<span class="tick${filled.includes(d) ? ' on' : ''}">${
      d === today() ? 'Today' : dayLabel(d).replace(/,.*$/, '')}</span>`).join('')}</div>`;
}

function spinPrompt() {
  const waiting = anyDue();
  if (!waiting.length) return '';
  return waiting.map(g => `<div class="card spinday">
    <b>Today is wheel spin day</b>
    <p class="muted">${esc(dueIn(g).map(w => w.name).join(' and '))} in ${esc(g.name)}. Spin before you post.</p>
    <div class="row" style="margin-top:12px"><button class="primary grow" onclick="spinDlg(${g.id})">Spin the wheel</button></div>
  </div>`).join('');
}

// What everyone owes and what they landed on, for the group page.
// Landing on the borrow slice means choosing whose challenge to take. Only what somebody
// else actually got is on offer, and the database checks the same thing.
function borrowDlg(spinId) {
  const sp = S.spins.find(x => x.id === spinId);
  const w = sp && S.wheels.find(x => x.id === sp.wheel_id);
  if (!w) return;
  const g = S.groups.find(x => x.id === w.group_id);
  const opts = borrowable(g, w, sp);
  dlg(`<h2>Whose are you doing?</h2>
    <p class="muted">The wheel sent you to somebody else's. Pick one, and it is yours until ${dayLabel(cycleStart(w, sp.cycle + 1))}.</p>
    ${opts.length ? `<div class="list card" style="margin:14px 0 0">${opts.map(t => `<div class="row"><b class="grow">${esc(t)}</b>
      <button class="primary small" onclick="takeChallenge(${sp.id},${JSON.stringify(JSON.stringify(t)).replace(/"/g, '&quot;')})">Take it</button></div>`).join('')}</div>`

// ---- the wheel
// An ordinary spinning wheel, drawn as an SVG so the labels stay crisp and sit along the
// slices. Four colours in rotation, all dark enough to take white text in either theme.
const SLICE = ['#0F4C5C', '#F4813A', '#2E7D8A', '#B85C1E'];
const sliceColour = (i, n) => SLICE[(i === n - 1 && (n % SLICE.length) === 1 ? i + 1 : i) % SLICE.length];

function wheelSvg(segs) {
  const n = segs.length, R = 104, C = 112, HUB = 17, mid = i => (i + 0.5) * 360 / n - 90;
  const pt = (a, r) => [C + r * Math.cos(a * Math.PI / 180), C + r * Math.sin(a * Math.PI / 180)];
  // A label runs along its slice, so the room it has is the radius minus the hub, not the
  // width of the wheel. Sizing off that is what keeps long ones inside the rim.
  const size = n > 12 ? 8 : n > 8 ? 9 : 11, room = R - HUB - 10;
  const fits = Math.max(6, Math.floor(room / (size * 0.58)));
  const slices = segs.map((seg, i) => {
    const a0 = i * 360 / n - 90, a1 = (i + 1) * 360 / n - 90;
    const [x0, y0] = pt(a0, R), [x1, y1] = pt(a1, R);
    const d = n === 1 ? `M ${C - R} ${C} a ${R} ${R} 0 1 1 ${R * 2} 0 a ${R} ${R} 0 1 1 ${-R * 2} 0`
      : `M ${C} ${C} L ${x0} ${y0} A ${R} ${R} 0 ${360 / n > 180 ? 1 : 0} 1 ${x1} ${y1} Z`;
    // Labels run along their slice, hub outwards, the way they do on a real wheel. There is
    // no orientation that stays upright: the labels turn with the wheel, so anything picked
    // to look right standing still is upside down once it has spun.
    const a = mid(i), [tx, ty] = pt(a, (HUB + R) / 2);
    const turn = a;
    const text = String(seg);
    const short = text.length > fits ? text.slice(0, fits - 1).trimEnd() + '…' : text;
    return `<path d="${d}" fill="${sliceColour(i, n)}"/>
      <text x="${tx}" y="${ty}" transform="rotate(${turn} ${tx} ${ty})" text-anchor="middle" dominant-baseline="central"
        font-size="${size}" font-weight="800" fill="#fff">${esc(short)}</text>`;
  }).join('');
  return `<svg viewBox="0 0 224 224" class="wheel-face" aria-hidden="true">${slices}
    <circle cx="${C}" cy="${C}" r="${R}" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="3"/>
    <circle cx="${C}" cy="${C}" r="${HUB}" fill="#fff"/></svg>`;
}

// Where the wheel has to stop for slice i to sit under the pointer at the top, plus a few
// whole turns so it looks like a spin rather than a jump.
const restAngle = (i, n, turns = 5) => turns * 360 - ((i + 0.5) * 360 / n);

function wheelBox(segs, id) {
  return `<div class="wheelbox"><div class="pointer"></div>
    <div class="wheel-spin" id="${id}">${wheelSvg(segs)}</div></div>`;
}

// ---- spinning
// The result is decided and stored by the database before any of this runs. Everything
// here is the reveal: the wheel is turned to an answer that already exists, so closing
// the app mid-spin loses nothing and changes nothing.
async function spinDlg(gid) {
  const g = S.groups.find(x => x.id === gid), due = dueIn(g);
  if (!due.length) return;
  const w = due[0];
  dlg(`<h2>${esc(w.name)}</h2><p class="muted">Everyone in ${esc(g.name)} spins this. Your result is up for the group to see.</p>
    <div id="spinstage"></div>`);
  const stage = $('#spinstage');
  stage.innerHTML = `<div class="wheelbox"><div class="pointer"></div><div class="wheel-spin">${wheelSvg(w.stages[0] ? w.stages[0].segments : ['…', '…'])}</div></div>
    <div class="row" style="margin-top:18px"><button class="primary grow" onclick="goSpin(${w.id},${gid})">Spin</button></div>
    <div class="row" style="margin-top:6px"><button class="ghost grow" onclick="sitOut(${w.id},${gid})">Sit this one out</button></div>
    <p class="muted" style="text-align:center;margin-top:2px;font-size:12px">You can post without it this time. It comes back ${dayLabel(cycleStart(w, cycleOf(w) + 1))}.</p>`;
}

async function goSpin(wid, gid) {
  const stage = $('#spinstage');
  if (!stage) return;
  stage.querySelector('button').disabled = true;
  stage.querySelector('button').textContent = 'Spinning…';
  let sp;
  try { sp = await q(sb.rpc('spin', {p_wheel: wid, p_day: today()})); }
  catch (e) { const b = stage.querySelector('button'); if (b) { b.disabled = false; b.textContent = 'Spin'; } return; }
  S.spins = [...S.spins.filter(x => x.id !== sp.id), sp];
  await reveal(sp, gid);
}

// Deciding before the wheel turns is the point: sitting out afterwards would be a way to
// walk away from a result you did not like, and the database refuses it anyway.
async function sitOut(wid, gid) {
  const w = S.wheels.find(x => x.id === wid);
  if (!confirm(`Sit out ${w.name} until ${dayLabel(cycleStart(w, cycleOf(w) + 1))}?\n\nYou can post without spinning it, and nothing counts against you this time. Change your mind and you can still spin it before the cycle is up.`)) return;
  const stage = $('#spinstage');
  if (stage) stage.querySelectorAll('button').forEach(b => b.disabled = true);
  try { await q(sb.rpc('sit_out', {p_wheel: wid, p_day: today()})); }
  catch (e) { if (stage) stage.querySelectorAll('button').forEach(b => b.disabled = false); return; }
  dlg(); await load();
  const g = S.groups.find(x => x.id === gid);
  if (g && dueIn(g).length) return spinDlg(gid);
  openGroup(gid);
}

const wait = ms => new Promise(r => setTimeout(r, ms));

// Reveal the stages one after another: what the challenge is, then how long it runs for.
async function reveal(sp, gid) {
  const stage = $('#spinstage');
  if (!stage) return;
  const results = [...sp.results].sort((a, b) => a.seq - b.seq);
  stage.innerHTML = results.map((r, i) => `<div class="stage${i ? ' later' : ''}" id="st${i}">
    ${r.label ? `<p class="muted stagelabel">${esc(r.label)}</p>` : ''}
    ${wheelBox(r.segs, `sw${i}`)}
    <p class="landed" id="lt${i}"></p></div>`).join('');
  for (let i = 0; i < results.length; i++) {
    const r = results[i], el = $(`#st${i}`), face = $(`#sw${i}`);
    el.classList.remove('later');
    await wait(60);
    face.style.transform = `rotate(${restAngle(r.i, r.segs.length)}deg)`;
    await wait(4200);
    $(`#lt${i}`).textContent = r.kind === 'days' ? daysLine(+r.value) : String(r.value);
    $(`#lt${i}`).classList.add('in');
    await wait(700);
  }

// ---- recovery codes
// Two things to know about functions.invoke here.
// 1. supabase-js 2.49.4 builds its functions client from the headers fixed at
//    createClient time, which carry the anon key, and never rewrites them when the
//    user signs in. Without passing the token by hand, 'issue' always comes back
//    "Sign in first." even for a signed-in user.
// 2. It collapses every non-2xx into a generic error, so dig out the real message.
async function callRecovery(action, body = {}) {
  const {data: {session}} = await sb.auth.getSession();
  const headers = session ? {Authorization: `Bearer ${session.access_token}`} : undefined;
  const {data, error} = await sb.functions.invoke('recovery', {body: {action, ...body}, headers});
  if (!error) return data;
  let msg = 'Could not reach the server. Check your connection and try again.';
  try { const j = await error.context.json(); if (j && j.error) msg = j.error; } catch (e) {}
  throw new Error(msg);
}

    <div class="card" style="margin-top:12px"><div class="row wrap" style="gap:8px;font-family:ui-monospace,monospace;font-size:15px">${codes.map(c => `<span class="chip">${esc(c)}</span>`).join('')}</div></div>

async function saveWheel(f, gid, id) {
  const fd = new FormData(f), w = id && S.wheels.find(x => x.id === id);
  const segments = fd.get('segments').split('\n').map(x => x.trim()).filter(Boolean).filter(x => x !== BORROW);
  if (fd.get('borrow')) segments.push(BORROW);
  if (segments.length < 2) return alert('Put at least two things on the wheel.');
  if (segments.length > 24) return alert('That is more than 24 slices — the labels stop being readable.');
  // A disabled input sends nothing, so a wheel that has been spun keeps what it had.
  const every = w && !fd.get('every') ? w.every_days : +fd.get('every');
  const starts = w && !fd.get('starts') ? w.starts_on : fd.get('starts');
  const stages = [{kind: 'challenge', label: 'Your challenge', segments}];
  if (fd.get('usedays')) {
    const days = fd.get('days').split(',').map(x => x.trim()).filter(Boolean);
    if (days.some(d => !/^\d+$/.test(d))) return alert('The day wheel takes whole numbers only.');
    if (days.length < 2) return alert('Put at least two numbers on the day wheel.');
    if (days.some(d => +d > every)) return alert(`A wheel spun every ${plural(every, 'day')} cannot ask for more than ${every}.`);
    stages.push({kind: 'days', label: 'On how many days', segments: days});
  }
  working(f, 'Saving…');
  try {
    await q(sb.rpc('save_wheel', {p_id: id || null, p_group: gid, p_name: fd.get('name').trim(),
      p_every: every, p_starts: starts, p_hour: +fd.get('hour'), p_breaks: !!fd.get('breaks'), p_stages: stages}));
  } catch (e) { return working(f, 'Save'), f.querySelectorAll('button').forEach(b => b.disabled = false); }
  dlg(); await load(); openGroup(gid);
}

// ---- recording in the app
// Handing off to the phone's own camera (a plain file input) is what made this unreliable:
// iOS puts its camera sheet over the app and is free to throw the app out of memory while
// it is up, which is the recording that vanishes and the screen that goes dark. Recording
// inside the page keeps the app alive and in charge, and lets us ask for 720p in the first
// place — so there is nothing to re-encode afterwards, which is the other half of the wait.
const REC_MAX = 120;                       // seconds; 50 MB at this bitrate is about 160
let camStream = null, camRec = null, camChunks = [], camTimer = null, camWake = null, camStart = 0;
let recorded = null;                       // what the camera produced, used in place of a picked file

const camSupported = () => !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && typeof MediaRecorder !== 'undefined');

async function openCam() {
  if (!camSupported()) return alert('This browser cannot record video. Use "Choose a file" instead.');
  const box = $('#cam'), why = $('#camwhy');
  why.hidden = true;
  if (!box.open) box.showModal();          // the top layer, above the submit sheet
  // Asking for the camera takes a moment, and on a phone it can wait on a permission
  // prompt. A shutter that looks ready but does nothing is what "you press record and it
  // just doesn't record" was: it stays dead and dimmed until there is a stream behind it.
  $('#camgo').disabled = true;
  $('#camgo').classList.remove('on');
  $('#camtime').textContent = 'Starting…';
  try {
    // Ask for the back camera at 720p. Every part of this is a preference, not a demand:
    // a phone that cannot manage it gives what it has rather than refusing outright.
    camStream = await navigator.mediaDevices.getUserMedia({
      video: {facingMode: {ideal: 'environment'}, width: {ideal: 1280}, height: {ideal: 720}, frameRate: {ideal: 30}},
      audio: true,
    });
  } catch (e) {
    why.textContent = e && e.name === 'NotAllowedError'
      ? 'Camera access was refused. Allow it in your browser settings, or use "Choose a file".'
      : `The camera could not be opened: ${e.message || e}`;
    why.hidden = false;
    $('#camtime').textContent = '';
    return;
  }
  // Closed again while the camera was still opening: let go of it rather than leaving the
  // light on behind a dialog nobody can see.
  if (!box.open) return stopCam();
  const v = $('#campre');
  v.srcObject = camStream;
  v.muted = true;                          // or the preview howls through the mic
  await v.play().catch(() => {});
  $('#camtime').textContent = '';
  $('#camgo').disabled = false;
}

function closeCam() {
  // Mid-recording: stop the recorder and leave the rest to finishRec, which closes up once
  // the last chunk is in. Cutting the camera off here would drop the end of the clip.
  if (camRec && camRec.state === 'recording') { try { return camRec.stop(); } catch (e) {} }
  stopCam();
  $('#cam').close();
}

function stopCam() {
  clearInterval(camTimer); camTimer = null;
  if (camStream) camStream.getTracks().forEach(t => t.stop());   // or the camera light stays on
  camStream = null;
  const v = $('#campre');
  if (v) v.srcObject = null;
  const go = $('#camgo');
  if (go) { go.disabled = true; go.classList.remove('on'); }
  releaseWake();
}

// The screen going to sleep mid-recording is the other thing people saw. Not every browser
// has this, and it is not worth failing over.
async function holdWake() {
  try { camWake = await navigator.wakeLock.request('screen'); } catch (e) { camWake = null; }
}
function releaseWake() { try { if (camWake) camWake.release(); } catch (e) {} camWake = null; }

async function toggleRec() {
  if (!camStream) return;
  if (camRec && camRec.state === 'recording') return camRec.stop();

  const type = mp4Type() || (MediaRecorder.isTypeSupported('video/webm') ? 'video/webm' : '');
  try {
    camRec = type ? new MediaRecorder(camStream, {mimeType: type, videoBitsPerSecond: VIDEO_BPS})
                  : new MediaRecorder(camStream);
  } catch (e) { return alert(`Could not start recording: ${e.message || e}`); }

  camChunks = [];
  camRec.ondataavailable = e => e.data && e.data.size && camChunks.push(e.data);
  camRec.onstop = finishRec;
  camRec.start(1000);                      // a chunk a second, so a long clip is not one lump
  camStart = Date.now();
  holdWake();
  $('#camgo').classList.add('on');
  camTimer = setInterval(() => {
    const secs = Math.round((Date.now() - camStart) / 1000);
    $('#camtime').textContent = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`;
    if (secs >= REC_MAX && camRec.state === 'recording') camRec.stop();
  }, 250);
}

// iOS can put the app away mid-recording. Stopping on the way out keeps what was filmed
// as a usable clip, instead of losing the lot with the page.
addEventListener('pagehide', () => {
  if (camRec && camRec.state === 'recording') { try { camRec.stop(); } catch (e) {} }
});

function finishRec() {
  clearInterval(camTimer); camTimer = null;
  releaseWake();
  $('#camgo').classList.remove('on');
  const type = (camRec && camRec.mimeType || 'video/mp4').split(';')[0];
  const blob = new Blob(camChunks, {type});
  camChunks = [];
  stopCam();
  $('#cam').close();
  if (blob.size < 1024) return alert('That recording came out empty. Try again, or use "Choose a file".');
  // Recorded here, so it is already 720p at the bitrate we asked for: nothing to re-encode.
  recorded = new File([blob], `clip.${type.includes('webm') ? 'webm' : 'mp4'}`, {type});
  recorded.fromCamera = true;
  const el = $('#vsize');
  if (el) { el.className = 'muted'; el.textContent = `Recorded · ${mb(recorded.size)} MB`; }
}

// ---- shrinking a clip before it goes over the wire
// The camera writes far more than a 4:5 card on a phone screen needs: by Apple's own
// figures a minute of 1080p is about 65 MB and a minute of 4K about 170 MB, and all of
// it used to go up untouched. Re-encoding to 720p first turns a 20-second clip from tens
// of megabytes into two or three, which is both a much shorter upload and about ten times
// more videos inside the 1 GB the free plan gives us.
// Every failure path here returns the original file. A slow post beats a broken one.
const TARGET_H = 720, VIDEO_BPS = 2500000;
const COMPRESS_OVER = 6 * 1048576;   // below this the upload is quick anyway
const LONGEST = 150;                 // seconds: re-encoding runs at about real time

// H.264 in MP4 only. A WebM recorded on an Android phone will not play on the iPhones
// most of this group is using, and proof nobody can watch is worse than a slow upload.
const mp4Type = () => (typeof MediaRecorder === 'undefined' || !HTMLCanvasElement.prototype.captureStream) ? ''
  : ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4;codecs=avc1,mp4a.40.2', 'video/mp4;codecs=avc1', 'video/mp4']
      .find(t => MediaRecorder.isTypeSupported(t)) || '';

// Does this blob actually decode, and is it the length we expect? A file that fails here
// would be a post nobody can play, so it is thrown away in favour of the original.
function playable(blob, seconds) {
  return new Promise(res => {
    const v = document.createElement('video'), url = URL.createObjectURL(blob);
    const done = ok => { v.src = ''; URL.revokeObjectURL(url); res(ok); };
    v.preload = 'metadata';
    v.onloadedmetadata = () => done(v.videoWidth > 0 && (!isFinite(v.duration) || Math.abs(v.duration - seconds) < Math.max(1, seconds * 0.25)));
    v.onerror = () => done(false);
    setTimeout(() => done(false), 10000);
    v.src = url;
  });
}

async function shrink(file, onProgress) {
  const type = mp4Type();
  if (!type || file.size < COMPRESS_OVER) return file;
  // Recorded in the app, so it is already 720p at the bitrate we asked for. Re-encoding it
  // would cost the length of the clip and give back almost nothing.
  if (file.fromCamera) return file;
  const url = URL.createObjectURL(file), v = document.createElement('video');
  let ac, stop = false, handle;
  try {
    v.playsInline = true; v.preload = 'auto'; v.src = url;
    await new Promise((res, rej) => {
      v.onloadedmetadata = res;
      v.onerror = () => rej(new Error('unreadable'));
      setTimeout(() => rej(new Error('timed out')), 20000);
    });
    const secs = v.duration;
    if (!v.videoWidth || !isFinite(secs) || secs <= 0 || secs > LONGEST) return file;
    // Already at or under the size we would re-encode to, and not enormous: whatever is
    // left to save is not worth making somebody wait the length of their own clip for.
    if (v.videoHeight <= TARGET_H && file.size <= secs * VIDEO_BPS / 8 * 1.6) return file;

    const scale = Math.min(1, TARGET_H / v.videoHeight);
    const c = document.createElement('canvas');
    c.width = Math.round(v.videoWidth * scale / 2) * 2;      // encoders want even dimensions
    c.height = Math.round(v.videoHeight * scale / 2) * 2;
    const g = c.getContext('2d'), stream = c.captureStream();

    // Pull the audio through WebAudio instead of the speakers, so re-encoding is silent.
    try {
      ac = new (self.AudioContext || self.webkitAudioContext)();
      await ac.resume();
      const dest = ac.createMediaStreamDestination();
      ac.createMediaElementSource(v).connect(dest);
      dest.stream.getAudioTracks().forEach(t => stream.addTrack(t));
    } catch (e) { /* no audio route: the picture still gets through */ }

    const rec = new MediaRecorder(stream, {mimeType: type, videoBitsPerSecond: VIDEO_BPS});
    const chunks = [], stopped = new Promise(res => { rec.onstop = res; });
    rec.ondataavailable = e => e.data.size && chunks.push(e.data);
    rec.start();

    const pump = () => {
      if (stop) return;
      g.drawImage(v, 0, 0, c.width, c.height);
      onProgress(Math.min(1, v.currentTime / secs));
      handle = v.requestVideoFrameCallback ? v.requestVideoFrameCallback(pump) : requestAnimationFrame(pump);
    };
    await v.play();
    pump();
    await Promise.race([
      new Promise(res => { v.onended = res; }),
      new Promise((_, rej) => setTimeout(() => rej(new Error('stalled')), (secs + 20) * 2500)),
    ]);
    stop = true;
    rec.stop();
    await stopped;

    const out = new Blob(chunks, {type: type.split(';')[0]});
    if (out.size < 1024 || out.size > file.size * 0.9) return file;   // no real gain: not worth the risk
    if (!await playable(out, secs)) return file;
    return new File([out], file.name.replace(/\.[^.]*$/, '') + '.mp4', {type: out.type});
  } catch (e) {
    return file;
  } finally {
    stop = true;
    if (handle && !v.requestVideoFrameCallback) cancelAnimationFrame(handle);
    try { v.pause(); } catch (e) {}
    v.src = ''; URL.revokeObjectURL(url);
    if (ac) ac.close().catch(() => {});
  }
}

// supabase-js sends the file through fetch, which cannot report upload progress, so a
// phone video sat on a motionless "Uploading…" for the whole transfer with no way to
// tell a slow connection from a stuck one. This is the same request its storage client
// builds — a multipart POST to the object endpoint — sent with XHR so it can be watched.
async function upload(bucket, path, file, onProgress) {
  const {data: {session}} = await sb.auth.getSession();
  // A file with no type of its own is stored as octet-stream, which iOS then refuses to
  // play. The camera always sets one; a file picked from somewhere else might not.
  const part = file.type ? file : new File([file], file.name || 'video.mp4', {type: 'video/mp4'});
  const body = new FormData();
  body.append('cacheControl', '3600');
  body.append('', part);
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest(), t0 = Date.now();
    xhr.open('POST', `${SUPABASE_URL}/storage/v1/object/${bucket}/${path}`);
    xhr.setRequestHeader('apikey', SUPABASE_KEY);
    if (session) xhr.setRequestHeader('Authorization', `Bearer ${session.access_token}`);
    xhr.setRequestHeader('x-upsert', 'false');
    xhr.upload.onprogress = e => {
      if (!e.lengthComputable) return;
      const secs = (Date.now() - t0) / 1000;
      onProgress(e.loaded, e.total, secs > 1 ? e.loaded / 1048576 / secs : 0);   // a rate before a second has passed is noise
    };
    xhr.onload = () => {
      if (xhr.status >= 200 && xhr.status < 300) return resolve();
      let m = `The upload failed (${xhr.status}).`;
      try { const j = JSON.parse(xhr.responseText); m = j.message || j.error || m; } catch (err) {}
      reject(new Error(m));
    };
    xhr.onerror = () => reject(new Error('The upload was interrupted. Check your connection and try again.'));
    xhr.onabort = () => reject(new Error('The upload was cancelled.'));
    xhr.send(body);
  });
}

const mb = n => (n / 1048576).toFixed(1);

const tooBig = n => `That video is ${(n / 1048576).toFixed(0)} MB and the limit is ${MAX_MB} MB.\n\nTrim the clip, or record at 720p (iPhone: Settings → Camera → Record Video).`;

// One tick per challenge you are on. There is nothing to choose between here: whichever
// challenge is yours is the only one that fills your days, so a post either was done with
// it or was not. Swapping to somebody else's is done on the wheel, for the whole cycle.
function challengeBlock(g) {
  const mine = myChallenges(g);
  if (!mine.length) return '';
  return mine.map(sp => `<label class="check"><input type="checkbox" name="chal" value="${sp.id}|${esc(effChallenge(sp))}" checked>
    <span>I did this with my challenge: <b>${esc(effChallenge(sp))}</b></span></label>`).join('');
}

async function addPost(f, gid) {
  const fd = new FormData(f), picked = recorded || fd.get('video');
  if (!picked || !picked.size) return alert('Record a video, or choose one.');
  if (dueIn(S.groups.find(x => x.id === gid) || {id: gid}).length) return spinDlg(gid);
  const bar = $('#uprog'), size = $('#vsize');
  if (bar) { bar.hidden = false; bar.style.setProperty('--w', '0%'); }

  // Shrink first, then check the size. A clip the camera recorded too big for the bucket
  // usually fits comfortably once it is 720p, so this is checked against what will
  // actually be sent rather than what came off the camera.
  // Only shrink() knows whether there is anything to re-encode, and it says so by
  // reporting progress. Until it does, this is just reading the file.
  working(f, 'Preparing…');
  const video = await shrink(picked, p => {
    const pct = Math.round(p * 100);
    working(f, `Compressing… ${pct}%`);
    if (bar) bar.style.setProperty('--w', `${pct}%`);
  });
  if (video.size > MAX_MB * 1048576) { if (bar) bar.hidden = true; return working(f, 'Post'), f.querySelectorAll('button').forEach(b => b.disabled = false), alert(tooBig(video.size)); }
  if (size) { size.className = 'muted'; size.textContent = video === picked ? `${mb(video.size)} MB` : `${mb(picked.size)} MB → ${mb(video.size)} MB`; }

  working(f, 'Uploading…');
  if (bar) bar.style.setProperty('--w', '0%');
  const path = `${gid}/${me().id}/${Date.now()}.${(video.name.split('.').pop() || 'mp4').toLowerCase()}`;
  try {
    await upload('proof', path, video, (sent, total, rate) => {
      const pct = Math.round(sent / total * 100);
      working(f, `Uploading… ${pct}%`);
      if (bar) bar.style.setProperty('--w', `${pct}%`);
      if (size) { size.className = 'muted'; size.textContent = `${mb(sent)} of ${mb(total)} MB${rate ? ` · ${rate.toFixed(1)} MB/s` : ''}`; }
    });
    working(f, 'Posting…');
    const [spinId, chalText] = fd.get('chal') ? String(fd.get('chal')).split(/\|(.*)/s) : [];
    await q(sb.from('posts').insert({group_id: gid, user_id: me().id, metric: fd.get('metric'), amount: +fd.get('amount'),
      caption: fd.get('caption').trim(), video_path: path, day: today(),
      challenge: chalText || null, spin_id: spinId ? +spinId : null}));
  } catch (e) {
    if (bar) bar.hidden = true;
    if (!e.shown) alert(e.message);                        // q() already showed its own
    return working(f, 'Post'), f.querySelectorAll('button').forEach(b => b.disabled = false);
  }
  dlg(); await load(); if (S.open) openGroup(gid); else scrollTo(0, 0);
}
async function delPost(id) {
  if (!confirm('Delete this post?')) return;
  const p = S.posts.find(x => x.id === id);
  await q(sb.from('posts').delete().eq('id', id));
  await sb.storage.from('proof').remove([p.path]);
  load();
}
async function addComment(f, postId) {
  const body = f.body.value.trim(); if (!body) return;
  working(f, '…');
  await q(sb.from('comments').insert({post_id: postId, user_id: me().id, body}));
  const y = scrollY; await load(); scrollTo(0, y);
}
async function delComment(id) { await q(sb.from('comments').delete().eq('id', id)); const y = scrollY; await load(); scrollTo(0, y); }

// An installed app comes back to the foreground constantly, and this refetches every
// table each time. Once every 15 seconds is plenty; load() itself collapses overlapping calls.
document.addEventListener('visibilitychange', () => {
  if (document.hidden || !me() || Date.now() - lastLoad < 15000) return;
  load();
});

// ---- installable app
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(e => console.warn('Service worker did not register:', e)));
function dismissA2HS() { $('#a2hs').hidden = true; try { localStorage.a2hs = '1'; } catch (e) {} }
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
function maybeShowA2HS() {
  const safari = !/CriOS|FxiOS|EdgiOS|OPiOS|Chrome/.test(navigator.userAgent); // only Safari can add to the home screen
  let dismissed = false; try { dismissed = localStorage.a2hs === '1'; } catch (e) {}
  if (isIOS() && safari && !isStandalone() && !dismissed) $('#a2hs').hidden = false;
}
setTimeout(maybeShowA2HS, 1200); // let the app paint first

// ---- push notifications
// Public half of the VAPID pair; the private half lives in the notify edge function's secrets.
const VAPID_PUBLIC_KEY = 'BPaw2UJU9VQ17Onx8bqve-CpoYzsoE1mTs8CaEZB34dvyT76nszZdXf-7hJS2EEUJVj_2sIO5cfDZ8Wki8Lsdv4';
const urlB64 = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/').padEnd(Math.ceil(s.length / 4) * 4, '=')), c => c.charCodeAt(0));
// iOS only exposes PushManager to home screen apps, so an iPhone in a Safari tab lands on 'install'.
const pushOK = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;

async function refreshPush() {
  if (!pushOK()) { S.push = isIOS() && !isStandalone() ? 'install' : 'unsupported'; return; }
  if (Notification.permission === 'denied') { S.push = 'denied'; return; }
  const reg = await navigator.serviceWorker.ready;
  S.push = await reg.pushManager.getSubscription() ? 'on' : 'off';
}

async function enablePush() {
  try {
    const perm = await Notification.requestPermission(); // has to happen inside the tap
    if (perm !== 'granted') { S.push = perm === 'denied' ? 'denied' : 'off'; return render(); }
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: urlB64(VAPID_PUBLIC_KEY)});
    const k = sub.toJSON().keys;
    await q(sb.from('push_subscriptions').upsert({endpoint: sub.endpoint, user_id: me().id, p256dh: k.p256dh, auth: k.auth}));
    S.push = 'on';
  } catch (e) { alert('Could not turn on notifications: ' + e.message); await refreshPush(); }
  render();
}

async function disablePush() {
  try {
    const sub = await (await navigator.serviceWorker.ready).pushManager.getSubscription();
    if (sub) { await q(sb.from('push_subscriptions').delete().eq('endpoint', sub.endpoint)); await sub.unsubscribe(); }
  } catch (e) { /* leaving the row behind is harmless: the sender prunes dead endpoints */ }
  S.push = 'off'; render();
}
// ---- boot
// The library keeps the session alive on its own timer and can end it without the app
// asking — a refresh that finally fails after the phone has been offline, or a sign-out
// in another tab. Without this the screen kept showing a signed-in app that no longer was.
sb.auth.onAuthStateChange((event, session) => {
  if (event === 'INITIAL_SESSION') return;              // the first load() below covers this
  if (!session) { S.me = null; S.open = null; S.auth = 'welcome'; S.booting = false; hideErr(); render(); }
  else if (!me()) load();                               // signed in, or a refresh recovered while we sat on the welcome screen
});

// Last resort, and it goes first so that it covers the boot below too. Whatever we
// failed to anticipate, say so rather than leave a page that has stopped responding.
addEventListener('unhandledrejection', e => {
  if (e.reason?.shown || document.hidden) return;       // q() already put it in front of them
  showErr(`Something went wrong: ${e.reason?.message || e.reason}`);
});

// Nothing here is allowed to leave the page blank. Paint first, then fill it in.
render();
load();

// ---- self-check: open index.html#test and look at the console
if (location.hash === '#test') {
  const g = {id: 1, quotas: [{metric: 'pushups', target: 50}]}, T = today(), Y = daysAgo(1);
  S.totals = [{g: 1, u: 'a', d: T, m: 'pushups', n: 20}, {g: 1, u: 'a', d: T, m: 'pushups', n: 30}, {g: 1, u: 'a', d: Y, m: 'pushups', n: 50}, {g: 1, u: 'a', d: daysAgo(2), m: 'pushups', n: 50},
    {g: 1, u: 'a', d: daysAgo(4), m: 'pushups', n: 50}, {g: 1, u: 'b', d: Y, m: 'pushups', n: 60}, {g: 2, u: 'a', d: T, m: 'pushups', n: 7}];
  console.assert(done(g, 'a', 'pushups') === 50, 'sums only today, this user, this group');
  console.assert(streak(g, 'a') === 3, 'streak counts today + 2 previous days, gap at day 3');
  console.assert(streak(g, 'b') === 1, 'streak still alive if yesterday was hit and today is in progress');
  console.assert(best(g, 'a') === 3 && best(g, 'b') === 1, 'best streak');
  console.assert(streak(g, 'zzz') === 0, 'no posts, no streak');
  console.assert(name({username: 'sam'}) === 'sam' && name({username: 'sam', display_name: 'Sam D'}) === 'Sam D', 'display name falls back to username');
  console.log('self-check ok');
}
